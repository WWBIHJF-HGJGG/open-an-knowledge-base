<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>推送回顾</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&family=Amiri+Quran&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f3ec;
        --surface: #fffdf8;
        --surface-2: #efe8da;
        --ink: #26221b;
        --ink-soft: #6d6455;
        --line: #ddd2bf;
        --accent: #2f6b52;
        --accent-soft: #e3ede6;
        --gold: #9a7422;
        --morning: #a86f14;
        --morning-bg: #f6ead2;
        --paper: #47627e;
        --paper-bg: #e2e9f0;
        --noon: #2f6b52;
        --noon-bg: #e0ece4;
        --night: #5b4a72;
        --night-bg: #e9e3f2;
        --english: #a34a2a;
        --english-bg: #f3e0d3;
        --q-ar: #1a1a1a;
        --q-en: #33302a;
        --q-zh: #d97757;
        --q-num: #8d7c5f;
        --q-word-line: rgba(90, 80, 60, 0.42);
        --q-hl: rgba(154, 116, 34, 0.22);
        --q-hl-edge: #9a7422;
        --shadow: 0 1px 2px rgba(60, 48, 24, 0.08), 0 8px 24px rgba(60, 48, 24, 0.07);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171a17;
          --surface: #20241f;
          --surface-2: #2a2e28;
          --ink: #ece7da;
          --ink-soft: #a89f8d;
          --line: #3a3f36;
          --accent: #7fbd9e;
          --accent-soft: #26362c;
          --gold: #d3ab54;
          --morning: #e0aa4e;
          --morning-bg: #3b2f1b;
          --paper: #9db8d4;
          --paper-bg: #27333f;
          --noon: #8ccbab;
          --noon-bg: #233730;
          --night: #c0aee0;
          --night-bg: #322b42;
          --english: #e8a183;
          --english-bg: #3d2a20;
          --q-ar: #f4efe3;
          --q-en: #d9d2c2;
          --q-zh: #eda27e;
          --q-num: #a2937a;
          --q-word-line: rgba(225, 215, 195, 0.42);
          --q-hl: rgba(211, 171, 84, 0.30);
          --q-hl-edge: #d3ab54;
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.3);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Noto Sans SC", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 16px;
        line-height: 1.6;
      }
      .serif { font-family: "Noto Serif SC", "Songti SC", "SimSun", serif; }

      .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 64px; }

      /* ---------- header ---------- */
      header.page-head { padding: 8px 0 20px; border-bottom: 2px solid var(--ink); }
      header.page-head h1 {
        margin: 0;
        font-family: "Noto Serif SC", serif;
        font-weight: 900;
        font-size: clamp(30px, 6vw, 44px);
        letter-spacing: 0.04em;
        line-height: 1.15;
      }
      .head-sub {
        margin: 10px 0 0;
        color: var(--ink-soft);
        font-size: 15px;
      }
      .head-sub b { color: var(--ink); font-weight: 700; }

      /* ---------- controls ---------- */
      .controls {
        position: sticky; top: 0; z-index: 20;
        background: var(--bg);
        padding: 14px 0 10px;
        border-bottom: 1px solid var(--line);
      }
      .search-row { display: flex; gap: 10px; }
      .search-box {
        flex: 1; display: flex; align-items: center; gap: 8px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0 12px;
      }
      .search-box svg { flex: none; color: var(--ink-soft); }
      .search-box input {
        flex: 1; min-width: 0;
        border: 0; outline: 0; background: transparent;
        color: var(--ink);
        font: inherit; font-size: 15px;
        padding: 10px 0;
      }
      .search-box input::placeholder { color: var(--ink-soft); }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
      .chip {
        appearance: none; cursor: pointer;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        font: inherit; font-size: 14px; font-weight: 500;
        padding: 6px 14px;
        border-radius: 999px;
      }
      .chip .n { color: var(--ink-soft); font-size: 12.5px; margin-left: 4px; }
      .chip[aria-pressed="true"] {
        background: var(--ink); color: var(--bg); border-color: var(--ink);
      }
      .chip[aria-pressed="true"] .n { color: inherit; opacity: 0.7; }

      /* ---------- day sections ---------- */
      .day { margin-top: 34px; }
      .day-head {
        display: flex; align-items: baseline; gap: 12px;
        margin-bottom: 14px;
      }
      .day-head .d {
        font-family: "Noto Serif SC", serif;
        font-weight: 900; font-size: 22px;
      }
      .day-head .w { color: var(--ink-soft); font-size: 14px; }
      .day-head .rule { flex: 1; border-top: 1px solid var(--line); transform: translateY(-4px); }
      .day-head .c { color: var(--ink-soft); font-size: 13px; white-space: nowrap; }

      .entries { display: grid; grid-template-columns: 1fr; gap: 16px; }
      @media (min-width: 760px) {
        .entries { grid-template-columns: 1fr 1fr; }
        .entries .entry.wide { grid-column: 1 / -1; }
      }

      .entry {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 18px 18px 14px;
        display: flex; flex-direction: column;
      }
      .entry-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .tag {
        font-size: 13px; font-weight: 700;
        padding: 2px 10px; border-radius: 999px;
        letter-spacing: 0.06em;
      }
      .tag.morning { color: var(--morning); background: var(--morning-bg); }
      .tag.paper { color: var(--paper); background: var(--paper-bg); }
      .tag.noon { color: var(--noon); background: var(--noon-bg); }
      .tag.night { color: var(--night); background: var(--night-bg); }
      .tag.english { color: var(--english); background: var(--english-bg); }
      .time { color: var(--ink-soft); font-size: 13px; }
      .has-full { margin-left: auto; color: var(--ink-soft); font-size: 12.5px; }
      .entry h2 {
        margin: 10px 0 0;
        font-family: "Noto Serif SC", serif;
        font-weight: 700; font-size: 19px; line-height: 1.45;
        overflow-wrap: anywhere;
      }
      .preview {
        margin: 8px 0 0;
        color: var(--ink-soft);
        font-size: 14.5px; line-height: 1.7;
        display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      }
      .entry-foot { margin-top: auto; padding-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
      .btn {
        appearance: none; cursor: pointer;
        font: inherit; font-size: 14px; font-weight: 500;
        border-radius: 9px; padding: 8px 16px;
        border: 1px solid var(--line);
        background: var(--surface-2); color: var(--ink);
      }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      @media (prefers-color-scheme: dark) {
        .btn.primary { color: #10221a; }
      }
      .btn:active { transform: translateY(1px); }

      .empty-note { color: var(--ink-soft); font-size: 14px; margin: 10px 0 0; }

      /* ---------- reader dialog ---------- */
      dialog.reader {
        width: min(760px, calc(100vw - 24px));
        max-height: calc(100dvh - 32px);
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        color: var(--ink);
        padding: 0;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
      }
      dialog.reader::backdrop { background: rgba(20, 18, 12, 0.55); }
      dialog.reader[open] { display: flex; flex-direction: column; }
      .reader-head { flex: none; }
      .reader-body { flex: 1 1 auto; min-height: 0; }
      .reader-head {
        position: sticky; top: 0;
        background: var(--surface);
        padding: 18px 22px 12px;
        border-bottom: 1px solid var(--line);
        display: flex; gap: 12px; align-items: flex-start;
      }
      .reader-head .meta { flex: 1; min-width: 0; }
      .reader-head h2 {
        margin: 6px 0 0;
        font-family: "Noto Serif SC", serif;
        font-size: 21px; line-height: 1.4; font-weight: 700;
        overflow-wrap: anywhere;
      }
      .reader-close {
        flex: none; appearance: none; cursor: pointer;
        width: 38px; height: 38px; border-radius: 50%;
        border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
        font-size: 18px; line-height: 1;
      }
      .reader-body { padding: 20px 22px 28px; overflow-y: auto; }
      .reader-body img.card-full {
        display: block; width: min(340px, 100%); margin: 0 auto 22px;
        border-radius: 10px; border: 1px solid var(--line);
      }
      .audio-box {
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px 16px;
        margin: 0 0 22px;
      }
      .audio-box .audio-title { font-weight: 700; font-size: 15px; margin: 0; }
      .audio-box .audio-note { color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
      .audio-item { margin-top: 12px; }
      .audio-item .audio-label { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 5px; }
      .audio-item audio { width: 100%; display: block; }
      /* lesson player stays pinned to the top of the reader while scrolling */
      .reader-body > .audio-box {
        position: sticky; top: -20px; z-index: 6;
        box-shadow: 0 14px 22px -16px rgba(60, 48, 24, 0.55);
      }
      /* audio-only view (「听音频」) */
      .audio-view-note { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 4px; line-height: 1.7; }
      .audio-view-body .audio-item { margin-top: 16px; }
      .audio-view-body .audio-item audio { width: 100%; display: block; }
      .full-text { font-size: 16.5px; line-height: 1.95; }
      .full-text p { margin: 0 0 1em; overflow-wrap: anywhere; }
      .full-text a { color: var(--accent); overflow-wrap: anywhere; }
      .full-text [dir="rtl"] { font-size: 1.12em; line-height: 2.1; }

      /* ---------- quran lessons: tricolor standard (same as lesson PDFs) ---------- */
      .full-text .q-chapter {
        font-family: "Noto Serif SC", "Songti SC", serif;
        font-size: 1.16em; font-weight: 700; color: var(--ink);
        margin: 1.5em 0 0.9em;
      }
      .full-text .q-chapter:first-child { margin-top: 0.15em; }
      .full-text .q-verse { margin: 0 0 1.6em; }
      .full-text .q-num {
        margin: 0 0 0.3em;
        font-size: 0.8em; font-weight: 700; letter-spacing: 0.1em;
        color: var(--q-num);
      }
      .full-text .q-ar {
        display: block;
        font-family: "Amiri Quran", "Noto Naskh Arabic", "Traditional Arabic", serif;
        font-size: 1.45em; line-height: 2.4;
        color: var(--q-ar);
        text-align: right;
        margin: 0 0 0.5em;
      }
      .full-text p.q-ar { margin: 0 0 0.45em; }
      .full-text .q-ar-row { margin: 0 0 0.45em; }
      .full-text .q-ar-row .q-ar { margin-bottom: 0; }
      .full-text .q-en { color: var(--q-en); line-height: 1.8; margin: 0 0 0.35em; }
      .full-text .q-zh { color: var(--q-zh); line-height: 1.85; margin: 0; }
      .full-text .q-label {
        color: var(--ink-soft); font-size: 0.76em; font-weight: 700;
        letter-spacing: 0.05em; margin-right: 0.7em;
      }
      .full-text .q-ar-row .q-label { display: block; margin: 0 0 0.1em; }

      /* ---------- tap-to-listen verses (Quran lessons) ---------- */
      .full-text .q-verse.q-tap {
        cursor: pointer;
        border-radius: 10px;
        padding: 8px 10px 4px;
        margin-left: -10px; margin-right: -10px;
        transition: background-color 0.25s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .full-text .q-verse.q-tap:active { background: var(--accent-soft); }
      .full-text .q-verse.q-playing { background: var(--accent-soft); }
      .full-text .q-verse.q-tap .q-num::after {
        content: "▶";
        font-size: 0.7em;
        margin-left: 0.7em;
        letter-spacing: 0;
        opacity: 0.55;
      }
      .full-text .q-verse.q-paused {
        background: var(--surface-2);
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .full-text .q-verse.q-paused .q-num::after { content: "❚❚"; opacity: 0.7; }

      /* ---------- reading cursor (诵读光标) ----------
         While a lesson plays, the words already read carry a soft
         highlighter wash (--q-hl) and the word at the playhead gets a
         firmer wash plus an underline edge, so the eye can follow the
         recitation word by word — Arabic line first, then the English
         line. The wash is painted by wireTapToListen as a pure function
         of the playhead, so it freezes on pause and follows seeks.
         The word at the playhead also swells a touch (scale 1.15, just
         enough to draw the eye) with a short ease on the transform;
         every word span is inline-block so the swell never reflows the
         line around it — read and unread words keep their places. */
      .full-text .q-w {
        border-radius: 3px;
        display: inline-block;
        transition: transform 0.22s ease;
      }
      .full-text .q-w.q-read { background: var(--q-hl); }
      .full-text .q-w.q-now {
        background: var(--q-hl);
        box-shadow: inset 0 -0.14em 0 var(--q-hl-edge);
        transform: scale(1.15);
      }
      @media (prefers-reduced-motion: reduce) {
        .full-text .q-w { transition: none; }
        .full-text .q-w.q-now { transform: none; }
      }

      /* ---------- tap-a-word lookup (English lines only) ---------- */
      .full-text .q-word {
        cursor: pointer;
        border-radius: 3px;
        text-decoration: underline dotted;
        text-decoration-color: var(--q-word-line);
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
        -webkit-tap-highlight-color: transparent;
      }
      .full-text .q-word:active { background: var(--accent-soft); }
      .word-pop {
        position: fixed; z-index: 60;
        width: max-content; max-width: min(320px, calc(100vw - 20px));
        background: var(--surface); color: var(--ink);
        border: 1px solid var(--line); border-radius: 12px;
        box-shadow: 0 16px 40px rgba(20, 16, 8, 0.28);
        padding: 12px 30px 13px 14px;
      }
      .word-pop .wp-word {
        font-family: "Noto Serif SC", "Songti SC", serif;
        font-size: 17px; font-weight: 700; line-height: 1.3;
        overflow-wrap: anywhere;
      }
      .word-pop .wp-phon { color: var(--ink-soft); font-size: 13.5px; margin-left: 8px; }
      .word-pop .wp-lemma { color: var(--ink-soft); font-size: 12.5px; margin-top: 1px; }
      .word-pop .wp-defs { font-size: 14.5px; line-height: 1.65; margin-top: 5px; overflow-wrap: anywhere; }
      .word-pop .wp-base { margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--line); }
      .word-pop .wp-base .wp-lemma { margin-top: 0; }
      .word-pop .wp-base-phon { color: var(--ink-soft); font-size: 12px; margin-left: 6px; }
      .word-pop .wp-base-defs { font-size: 12.5px; line-height: 1.6; color: var(--ink-soft); margin-top: 2px; overflow-wrap: anywhere; }
      .word-pop .wp-speak {
        appearance: none; cursor: pointer; margin-top: 9px;
        display: inline-flex; align-items: center; gap: 6px;
        font: inherit; font-size: 13.5px; font-weight: 500;
        color: var(--ink); background: var(--surface-2);
        border: 1px solid var(--line); border-radius: 999px;
        padding: 5px 12px 5px 10px;
      }
      .word-pop .wp-speak:active { transform: translateY(1px); }
      .word-pop .wp-speak svg { flex: none; }
      .word-pop .wp-close {
        position: absolute; top: 6px; right: 6px;
        appearance: none; cursor: pointer;
        width: 26px; height: 26px; border-radius: 50%;
        border: 0; background: transparent; color: var(--ink-soft);
        font-size: 14px; line-height: 1;
      }

      /* ---------- lightbox ---------- */
      dialog.lightbox {
        border: 0; padding: 0; background: transparent;
        max-width: calc(100vw - 16px); max-height: calc(100dvh - 16px);
      }
      dialog.lightbox::backdrop { background: rgba(10, 10, 8, 0.88); }
      dialog.lightbox img {
        display: block; max-width: 100%; max-height: calc(100dvh - 70px);
        border-radius: 8px; margin: 0 auto;
      }
      .lightbox-bar { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; }
      .lightbox-bar a, .lightbox-bar button {
        appearance: none; cursor: pointer; font: inherit; font-size: 14px;
        color: #f2eee2; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.3);
        border-radius: 8px; padding: 7px 14px; text-decoration: none;
      }

      .no-results {
        margin-top: 40px; text-align: center; color: var(--ink-soft);
        font-size: 15px; padding: 32px 16px;
        border: 1px dashed var(--line); border-radius: 14px;
      }
      footer.page-foot {
        margin-top: 56px; padding-top: 16px;
        border-top: 1px solid var(--line);
        color: var(--ink-soft); font-size: 13.5px;
      }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="page-head">
        <h1>推送回顾</h1>
        <p class="head-sub" id="headSub"></p>
      </header>

      <div class="controls">
        <div class="search-row">
          <label class="search-box">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="searchInput" type="search" placeholder="搜标题或正文，比如「梦想」「dropout」" autocomplete="off" />
          </label>
        </div>
        <div class="chips" id="chips" role="group" aria-label="按栏目筛选"></div>
      </div>

      <main id="days"></main>
      <div class="no-results hidden" id="noResults">没有找到符合条件的推送，换个关键词或栏目试试。</div>

      <footer class="page-foot" id="pageFoot"></footer>
    </div>

    <dialog class="reader" id="reader" aria-label="推送全文">
      <div class="reader-head">
        <div class="meta">
          <div class="entry-top" id="readerMeta"></div>
          <h2 id="readerTitle"></h2>
        </div>
        <button class="reader-close" id="readerClose" aria-label="关闭">✕</button>
      </div>
      <div class="reader-body" id="readerBody"></div>
      <div class="word-pop hidden" id="wordPop" role="dialog" aria-label="单词释义">
        <button class="wp-close" id="wordPopClose" type="button" aria-label="关闭释义">✕</button>
        <div><span class="wp-word" id="wordPopWord"></span><span class="wp-phon" id="wordPopPhon"></span></div>
        <div class="wp-defs" id="wordPopDefs"></div>
        <div class="wp-base hidden" id="wordPopBase">
          <div class="wp-lemma"><span id="wordPopLemma"></span><span class="wp-base-phon" id="wordPopBasePhon"></span></div>
          <div class="wp-base-defs" id="wordPopBaseDefs"></div>
        </div>
        <button class="wp-speak" id="wordPopSpeak" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.4 5.6a9 9 0 0 1 0 12.8"/></svg>
          朗读发音
        </button>
      </div>
    </dialog>

    <dialog class="reader" id="audioView" aria-label="听音频">
      <div class="reader-head">
        <div class="meta">
          <div class="entry-top" id="audioViewMeta"></div>
          <h2 id="audioViewTitle"></h2>
        </div>
        <button class="reader-close" id="audioViewClose" aria-label="关闭">✕</button>
      </div>
      <div class="reader-body audio-view-body" id="audioViewBody"></div>
    </dialog>

    <dialog class="lightbox" id="lightbox" aria-label="卡片大图">
      <img id="lightboxImg" alt="" />
      <div class="lightbox-bar">
        <a id="lightboxDl" href="#" download>下载原图</a>
        <button id="lightboxClose">关闭</button>
      </div>
    </dialog>

    <script>
      "use strict";
      var ENTRIES = [{"date": "2026-10-15", "type": "午读", "title": "The Dead Are Alive in Their Graves（第1集）", "card": "noon_2026-10-15.png", "text": "标题：Ep.1《The Dead Are Alive in Their Graves》\n讲者：Dr. Omar Suleiman（奥马尔·苏莱曼博士）\n视频：https://www.youtube.com/watch?v=09PKK8tGQoc\nYaqeen 页面：https://yaqeeninstitute.org/watch/series/the-other-side-barzakh-and-beyond/the-dead-are-alive-in-their-graves-the-other-side\n\n精华一句：\n也许我能借我的遗留的财产而行善。绝不然！这是他一定要说的一句话，在他们的前面，有一个屏障，直到他们复活的日子。——《古兰经》23:100，马坚译\n\n凝练一段：\n我们亲手埋葬的人并没有死——他们此刻就活在巴尔扎赫：一个与今世平行存在的完整世界，那里的人口远比今世多，他们在那里停留的岁月，也将比今世的一生更长。坟墓是后世的第一站：对一些人，它是刑罚的开始；对另一些人，它是安息，是与所爱之人的重聚。易卜拉欣·本·艾德海姆把问路的人带到墓地，因为人最终都搬去那里定居，不再回来。与其恐惧那个未知，不如趁现在动手——你的坟墓是一座在建的家园，而我们离搬进去，只差一次心跳。\n\n完整全文翻译：\n\"在彼岸再会吧。\"——你确定吗？你这是要去哪里？我怎么知道自己能到达那里？那边是什么样子？你能给我讲一讲吗？那边的人认识我吗？你见过我的家吗？在那里，我被看作义人，还是恶人？此刻我周围的一切，什么才是真实的？\n\n有一个你身处的世界，还有另一个与它同时存在、你看不见的世界——但它看得见你。真主、天使，以及幽玄界的其他存在，都在注视着你。你眼中所见的万物，比它们看上去的要深邃，甚至可能比你更能感知那个境界。而你，离它只有一步之遥。\n\n一切都要从一个基本事实说起：我们亲手埋葬的人，其实并没有死。他们进入了巴尔扎赫——一个平行存在的境界，那里此刻就有像你一样活生生的人。他们有的正仰望绿鸟在头顶翱翔——烈士的灵魂曾栖居其间；有的正溺于血河之中；有的住在美丽的宅邸里，与几十年前就已离世的家人团聚；有的正被多头的野兽吞噬。那么，这个境界究竟是什么？我们对住在其中的人们知道多少？了解那个世界，对今天的我们理解自己身处的这个世界，又有什么帮助？对我们每个人各自踏上的、寻回归向真主之路的旅程，又意味着什么？\n\n几个世纪以前，在伊拉克库法附近的荒漠里，有个士兵在四处游荡，想找到城镇的中心。他在寻路时，遇见了那个时代最著名的学者之一——易卜拉欣·本·艾德海姆，可他根本不知道对方是谁。他走上前问他：你是奴隶吗？易卜拉欣说：是的。士兵又问——用他的说法——城镇的聚居地在哪里？大家都住在哪儿？易卜拉欣·本·艾德海姆说：跟我来。然后把他带到了一片墓地。士兵说：我是让你带我去城镇的聚居地。易卜拉欣说：就在这里。说着又指向那片墓地。于是士兵打了他的头，又把他拖到真正的城镇里。人们赶忙围上来，冲士兵说：你在干什么？这是易卜拉欣·本·艾德海姆！士兵说：可我问过他是不是奴隶啊——仿佛那样就能让他的行为变得可以似的。人们问易卜拉欣：我们的老师啊，你为什么不直接告诉他你是谁？他说：他问我是不是奴隶，却没有问我是谁的奴隶——我是真主——赞美他，至高无上的他——的奴隶。他们又问：他打你的时候，你说了什么？他说：我向真主祈祷，求真主赐他乐园。他们说：你为什么这样做？他说：因为我知道，我会因他而得到报赏，我不愿他因我而受到惩罚。他们说：好吧，可你当初为什么把他带到墓地去？他向你问的是城镇的聚居地（al-'imran），问的是市中心在哪里啊。易卜拉欣·本·艾德海姆说：我注意到，人们搬进自己的坟墓之后，就在那里定居下来，再没有人从那里回到这里。也就是说，墓地，才是活人真正居住的地方。（故事载加扎利《宗教科学的复兴》卷三，据该集 References）\n\n人们常说，成功的秘诀是\"领先一步\"。而对虔诚的前辈来说，秘诀是\"领先一站\"——在灵性生活的方方面面，他们都已做好准备，仿佛已经活在后世之中。可是，如果我们能走到先辈们的坟前，亲口问问他们：你们现在过得怎么样？那会怎样？据贾比尔（愿主喜悦他）传述，先知（愿主福安之）说：古时以色列人中有一群人出行，途中路过一片墓地。他们彼此说：我们来礼两拜，向真主祈求，让这些人中的一位回来，告诉我们死亡是怎么回事、坟墓中的生活又是怎样的。于是他们都礼了两拜，向真主作了祈祷。紧接着，一个人从一座坟墓中站了起来，抖落身上的尘土，说道：众人啊，你们所看见的，不过如此。我死去已经一百年了，可是我死亡那一刻的灼热，至今尚未冷却。你们能求真主让我回到我从前的状态吗？（出处：《穆斯奈德·艾哈迈德·祖赫德》第88号，据该集 References）\n\n其实，我们并不需要亡者来告诉我们死亡有多么真实，也不需要他们告诉我们：我们所有人终有一天都会落脚在巴尔扎赫。每一个曾行走于大地之上、已经离世的灵魂，此刻都在那里。想想看：如今地球上的人口将近八十亿；而在巴尔扎赫，据估计有一千一百七十亿个人类的灵魂。当然，确切的数目无从知晓——想想真主所说的\"其间还有许多民众与世代\"就好。你会在那里住多少年？直到审判日。也就是说，绝大多数人在巴尔扎赫度过的岁月，将比他们在今世的一生更长。你也许明天就搬进去，然后在那里住上一千年，甚至更久。它被称作\"巴尔扎赫的生活\"，自有其道理：你在那里有完整的生活——有家人，有朋友，有大人，有孩子，有家，有街区，有饮食，那个境界甚至有它自己的动物。生活的一切要素都在那里，只是配着它独有的一套维度、空间与时间。所以它不像今世——在那里你不会衰老；也不像乐园——在那里我们人人同龄。你似乎还可以同时身处两地，或者至少以惊人的速度在其间转移。想一想先知（愿主福安之）：这一刻，他在阿克萨清真寺领着众先知礼拜；几乎转瞬之间，他已遍行七重天，与他们逐一交谈（《穆斯林圣训集》172，据该集 References）。如果你这一刻还在自己的坟墓里，下一刻就到了真主的宝座之下，那会怎样？你看，你越是正直，你在那个世界里能自由往来的范围就越大，可以如头等舱的旅客一般，随心所欲地周游那整个世界。\n\n而最重要的是：巴尔扎赫此刻正在进行。想想穆萨与法老——他们都活在那个世界里。先知（愿主福安之）曾看见穆萨独自在自己的坟墓中礼拜（《穆斯林圣训集》2375，据该集 References）。当我们在故事里读到他独自躺在尼罗河的摇篮中时，他早已在那边礼拜；而当我们还在这里读到法老把人们投入火沟时，真主已在那边把法老投入火沟。这一切，都和我们眼前的事物一样真实。虽然我们尚不能用肉身感知它，但我们拥有通向巴尔扎赫的门径，提醒我们那个境界的丰富维度：睡着时，我们有时会通过梦进入它；醒着时，坟墓正凝视着我们，像一扇门，通向一个全新的现实世界——那个世界由你愿意在当下的现实中作出的改变成就。我们每个人，离进入那个维度都只差一次心跳——或者一颗炸弹。\n\n伊玛目哈桑·巴士里这样说我们所有人：«يَا ابْنَ آدَمَ إِنَّمَا أَنْتَ أَيَّامٌ»——\"阿丹的子孙啊！你不过是若干个日子。每过去一天，你的一部分就随之而去。\"（载《先贤传记》Hilyat al-Awliya'，据该集 References；此处中文为讲稿英译的忠实翻译）对于压迫我们的人，我们也当记得：他们同样不过是若干个日子而已。真主说：«فَلَا تَعْجَلْ عَلَيْهِمْ ۖ إِنَّمَا نَعُدُّ لَهُمْ عَدًّا»——\"所以你对他们不要急躁，我只数他们的寿数。\"（《古兰经》19:84，马坚译）伊本·阿巴斯（愿主喜悦他）说，这话的意思是：«نَعُدُّ أَنفَاسَهُمْ فِي الدُّنْيَا»——\"我们数着他们在今世的每一次呼吸。\"（《伊本·卡希尔经注》，据该集 References；此处中文为讲稿英译的忠实翻译）那么，当你将在那个世界醒来时，你真的知道自己会属于哪一类人吗？你会与烈士们一同飞翔吗——他们因为曾为真主献出自己整个人生，再也不会感到痛苦？还是会与暴君们一同在痛苦中腐烂——为你曾在今世令其受苦的那些生命？你会与真诚的信士们相聚吗——他们真正安息在平安与喜悦之中，期待着一个更大的喜悦来临？还是会与否认者和伪信者为伍，转而预尝永恒的刑罚？又或者，你处在两者之间——一个善恶交织、带着缺点的信士，在那里为自己的罪过偿付，或者盼望真主——赞美他，至高无上的他——宽宥它们？正是在这一站，一切都将变得清清楚楚。\n\n正因如此，奥斯曼（愿主喜悦他）每当站在坟墓旁，总会哭泣，直到泪水湿透他的胡须。有人对他说：提到乐园与火狱时，你不曾这样哭；可是站在这里，你为什么哭得这么厉害？他说，先知（愿主福安之）曾说：«إِنَّ الْقَبْرَ أَوَّلُ مَنَازِلِ الآخِرَةِ»——\"坟墓是后世诸阶段中的第一站。若一个人从中得以得救，那么之后的阶段对他而言将更为容易，若他未能从中得救，那么之后的阶段将比它更加严峻。\"（《提尔米兹圣训集》2308，奥斯曼的释奴哈尼传述；阿拉伯原文经 sunnah.com 核对，中文为圣训翻译百科全书 hadeethenc.com/zh 官方中文版）真主的使者（愿主福安之）还说：我从未见过任何景象，能比坟墓更令人惊惧。（同上，提尔米兹 2308；该句暂无可核对的权威中文译文，此处中文为讲稿英译的忠实翻译）但是，坟墓并不必然只是一个令人恐惧的未知之地，它也可以是安息与报赏之所。对一些人来说，坟墓就是安息。麦斯鲁格（愿主慈悯他）说：对信士来说，没有比他的坟墓更好的住所了。«قَدِ اسْتَرَاحَ مِنْ أَمْرِ الدُّنْيَا أَوْ مِنْ عَذَابِ اللَّهِ»——\"他已经从今世的事务中解脱，也从真主的惩罚中解脱。\"（载瓦基尔·本·杰拉赫《苦行之书》，据该集 References；此处中文为讲稿英译的忠实翻译）\n\n对于我们中间那些失去过某个人的人——那个人曾是我们一生中最大的喜悦之源——坟墓也可以成为我们终于与深爱之人重聚的地方。奥斯曼·本·萨乌达（愿主慈悯他）说，他的母亲拉希芭（愿主慈悯她）是一位正直的女子，在临终之时，她看着他，对他说：我的儿子啊，无论生前死后，都不要离弃我。于是，他就像从前去她家里探望她那样，去她的坟前探望她，为她向真主祈祷。后来，他在梦中见到母亲：她容颜美丽，正接受着无穷无尽的礼物——丝绸的衣裳与香水。然后她在梦中转向他说：你来探望我的坟墓时，我很高兴地迎接你。所以，不要停止来看我。（载伊本·焦齐《杰出者品性》，据该集 References）\n\n但是现在，请想一想你自己的坟墓——总有一天，你会去到那里，并在其中住上一段长短未知的岁月。那座坟墓是什么样子？它感觉起来如何？它闻起来又是什么气味？阿卜杜拉·本·加利卜（愿主慈悯他）去世时，刚一下葬，一股奇异的香气就如雾一般从他的坟中飘出。后来，他在梦中被人问起那股香气，他说：那是我诵读的气息，和我干渴的气息。所以，在你们开启斋月的时候，我想请你们带着自己斋戒时的气息想一想这件事。你的坟墓正在呼吸。它是一座正在建造中的家园，也是一扇门，通向一个大多数人毫不留意的现实——尽管它绝对无可避免。那么，你的\"彼岸\"是什么样子？你已经建造了什么在那里等着你？在表面之下，我们将找到什么答案，足以让我们获得一些清明，让头顶上那个残酷的世界多少变得可以理解一些？（阿卜杜拉·本·加利卜之事载伊本·拉杰卜《知识的精华》，据该集 References）\n\n讲者最后以《古兰经》信士章第100节作结——整个系列的名字\"巴尔扎赫\"，正出自这一节：\n\n\"也许我能借我的遗留的财产而行善。绝不然！这是他一定要说的一句话，在他们的前面，有一个屏障，直到他们复活的日子。\"（《古兰经》23:100，马坚译）\n\n引文核对说明：转录来源为 Yaqeen 官网官方 WP 接口（https://cdn.yaqeeninstitute.org/wp-json/wp/v2/posts/33006，acf.transcript_content，WEBVTT 全文，AI 生成，时长 13:09），并以该集页面 References 脚注核对引文。本集于 Muse 接手前已推送，本次为按午读规格补做的存档。古兰经 23:100（整节，卡片引文）与 19:84 的阿拉伯原文取自 api.quran.com text_uthmani，中文为马坚译（api.quran.com 译本资源 56），逐字核对。圣训《提尔米兹圣训集》2308 阿拉伯原文经 sunnah.com 逐字核对；其中\"坟墓是后世的第一站\"一段的中文采用圣训翻译百科全书（hadeethenc.com/zh/browse/hadith/11205）官方中文版；同段后半句\"我从未见过比坟墓更令人惊惧的景象\"暂无可核对的权威中文译文，正文为讲稿英译的忠实翻译并已标注。哈桑·巴士里之言、伊本·阿巴斯对 19:84 的解说、麦斯鲁格之言均为前辈言论而非圣训，阿拉伯原文按讲稿所引，出处据该集 References，中文为讲稿英译的忠实翻译并已标注。贾比尔所传以色列人事迹出处为《穆斯奈德·艾哈迈德·祖赫德》第 88 号；易卜拉欣·本·艾德海姆事迹载加扎利《宗教科学的复兴》卷三第 70 页；穆萨坟中礼拜与阿克萨领拜为《穆斯林圣训集》2375、172，均据该集 References。卡片阿语字体：默认的 Amiri Quran 字体对本节停顿符号 ۚ（U+06DA）的渲染位置有误（符号脱离词身），自查时改用管线字体清单内的 Scheherazade New，并经 100% 放大核验：连写、符号位置与中文均无误。", "cardImg": "noon_2026-10-15.jpg"}, {"date": "2026-10-16", "type": "午读", "title": "They Know About Your World（第2集）", "card": "noon_2026-10-16.png", "text": "标题：Ep.2《They Know About Your World》（他们知道你的世界）\n讲者：Dr. Omar Suleiman（奥马尔·苏莱曼博士）\n视频：https://www.youtube.com/watch?v=MAKqzsr25kM\nYaqeen 页面：https://yaqeeninstitute.org/watch/series/the-other-side-barzakh-and-beyond/theyre-watching-your-world-the-other-side\n\n精华一句：\n他和他的部下，的确能看见你们；而你们却不能看见他们。——《古兰经》7:27，马坚译\n\n凝练一段：\n你从不孤单。人生是一座舞台，观众远超你的想象：天使注视着你、为你助威，以求饶的祈祷为你吟诵；恶魔在旁喝倒彩，还潜入你体内低语；陆地与海洋的万物、天地本身都在看着你，连已故的亲人都会收到你的消息——为你的善行庆贺，为你的过失羞惭。而最大的观众，是时时刻刻看着你的真主。台上展示的不是身体，而是灵魂的倾向：你越寻求真主，恶魔的音量就越低，天使的提示就越清晰。别等到落幕后走进后台，才去猜他们如何评价你——现在就问自己：在那个你尚未踏入的世界里，你的名声如何？\n\n完整全文翻译：\n他投篮，球进了，全场沸腾。你见过成千上万人挤满一座体育场、观看一场大赛吗？想想看：观众全神贯注地盯着场上或球场上运动员的每一个动作，时而欢呼，时而喝倒彩。而当惊人的事情发生时——比如最后一分钟的压哨绝杀——他们欣喜若狂，齐声高呼你的名字。这是每个孩子的梦想，对吧？无论是在空荡荡的体育馆里投出想象中的制胜球，还是渴望成名致富，或是沉迷于社交媒体，看着自己的帖子收获点赞和评论来获得认可——归根结底，多少都关乎被关注。我们天生就渴望被关注。想想心理治疗中一个常见的主题：我想被看见，我想被听见，我想被感受到。可是，被谁看见？以什么方式？如果我告诉你：你早已拥有一批观众，是任何体育场、任何银幕、任何社交媒体的粉丝量都无法匹敌的呢？万物都在注视着你——在你上方、环绕着你、在你脚下、在你身外。你的灵魂所拥有的观众，是数以百万、十亿计的生灵。而你的整个世界，其实只是一个舞台。\n\n也许你察觉不到那些评述，因为你看不见你的观众。那是因为你是人，还身处今世。与我们周围的造化相比，人类的感知其实非常有限。想想鹰：它的视力是我们的八倍，能在三公里之外看见一只兔子。蜜蜂能看见紫外线，也就是说，它们能看见花朵上我们根本不知道存在的纹路。猫能在光线比人类可察觉的下限还低六倍的环境里看清东西。而鲨鱼，能在二十五加仑水里嗅出一滴血。如果我们也能像这些生灵一样看、一样嗅、一样听呢？\n\n再想想先知（愿主福安之）说过的话：当你们听见公鸡啼叫时，就向真主祈求他的恩典，因为那只公鸡刚看见了一位天使；当你们听见驴叫时，就向真主求护佑、远离恶魔，因为那头驴刚看见了一个恶魔。（《布哈里圣训实录》3303、《穆斯林圣训实录》2729；阿拉伯原文已核对，暂无可核对的权威中文译文，此处中文为讲稿英译的忠实翻译）他还说：所有这些生灵都能听见坟墓中的刑罚，唯独我们听不见（参见《布哈里圣训实录》1338）——真主出于慈悯，饶了我们这一遭。我想请你想一想：如今，仅仅透过屏幕听见垂死之人的哭喊，我们已经难以正常生活了。假如我们能听见墓地里死者真正的哭喊呢？假如我们能听见已故的亲朋好友、也许正在自己的坟墓中呼喊呢？我们会彻底瘫软无力。而且真主的这份慈悯还不止于拜宰赫。试想：如果真主增强我们的视力，让我们能看见有人打喷嚏时漂浮在空气中的微粒，或者看见四周像昆虫一样爬动的尘螨，我们还能安然坐在社交场合里吗？所以，真主赐予我们恰到好处的感官、恰到好处的分辨率，让我们借此认识他。正因如此，先知（愿主福安之）说：أُوصِيكَ أَن تَسْتَحِي مِنَ اللَّهِ تَعَالَى كَمَا تَسْتَحِي مِنَ الرَّجُلِ الصَّالِحِ مِن قَوْمِكَ——“我嘱咐你：你要敬羞于真主——至高无上的他，一如你敬羞于你族人中的一位义人。”（伊本·罕百勒《禁欲书》载；阿拉伯原文据讲稿与该集 References 核对，暂无可核对的权威中文译文，此处中文为讲稿英译的忠实翻译）你不难想见：如果一位义人二十四小时陪着你、看着你，你的言行会有多么不同，更不用说他亲身在场了。而比任何义人都伟大的真主，却时时刻刻都在看着你。所以，当你想到自己这座舞台的观众时，不要忘记那位最伟大的、无形的观众——真主。看台上的其余一切，只有与真主相连，对你才有意义。\n\n如今，在这场盛大演出中被展示的，不是你的身体，也不是你的运动天赋，而是你的灵魂，以及它所倾向的东西。看台上有注视着你、为你加油的天使，也有对你喝倒彩的恶魔。你甚至可能在天使中有一位“粉丝”，但他们的助威不是呼喊和鼓掌，而是用为你求饶的祈祷来吟诵：وَيَسْتَغْفِرُونَ لِمَن فِي الْأَرْضِ——“并为地面上的人求饶。”（《古兰经》42:5节选，马坚译）但也有精灵一族，其中有众恶魔。他们中的一些就在你身旁大声交谈，而你一点也听不见。真主说：إِنَّهُ يَرَاكُمْ هُوَ وَقَبِيلُهُ مِنْ حَيْثُ لَا تَرَوْنَهُمْ——“他和他的部下，的确能看见你们；而你们却不能看见他们。”（《古兰经》7:27节选，马坚译）而那些恶魔还不只是从外部喝倒彩：他们能在你体内流动穿行——能流到什么程度，取决于你给了他们多少准入。这是一场为争夺你而打的、没有止息的战争，你必须学会每天屏蔽那些噪音。你越寻求真主——赞美他，至高无上的他，恶魔的音量就越低，你转而能听见天使的提示。赞美真主！想象一下成为“穆罕代斯”（muhaddath）——仿佛被天使耳语启示的人，就像欧麦尔（愿主喜悦他）那样。而大多数人是“穆太瓦斯维斯”（mutawasswas），即不断遭受恶魔低语侵扰的人。因为，正如你的社交媒体算法会随着你的欲望而变化，你的灵魂算法也是如此：如果你寻求真主，你的所见所闻会随之改变；反之亦然。\n\n然后你会意识到：注视你的不只是天使和恶魔。当你寻求真主的喜悦时，从陆地上的大象与蚂蚁，到海里的鱼，整个世界都在齐声为你求饶。但正如真主所说：لَا تَفْقَهُونَ تَسْبِيحَهُمْ——“但你们不了解他们的赞颂”（《古兰经》17:44节选，马坚译）——你察觉不到它们如何赞颂真主，也许也察觉不到它们如何为你求饶。另一方面，你也无从分辨：从天使到昆虫，万物会如何因为你已经犯下、或意图犯下的一项罪过，而本能地厌弃你。这并不是说，每一只不喜欢你的动物，都是在因你的罪而恨你。这一切只是说：正如在拜宰赫，人人都能透过你的身体看见你的灵魂，在今世，也已经有看不见的元素在与你的灵魂互动——而灵魂，才是首要的那个“你”。举个例子：你的灵魂有一种气味，会散发给其他生灵。有人问苏富扬：天使怎么知道一个人心怀的是善念还是恶念？他回答说：当一个人心怀善念时，天使会闻到从他身上散发出来的麝香；而当他心怀恶念时，他们闻到的是一股恶臭。（伊本·泰米叶《教法判例全集》转述）就连大地本身也是如此——真主——赞美他，至高无上的他——说：فَمَا بَكَتْ عَلَيْهِمُ السَّمَاءُ وَالْأَرْضُ——“天地没有哭他们”（《古兰经》44:29，马坚译），意思是：有些人，没有天为他们哭泣，没有地为他们悲伤。伊本·阿巴斯（愿主喜悦他俩）说：对于信士，天地会为之哭泣，因为他留下了美好的影响；他说，大地会为一位信士哭泣四十天。（《泰伯里经注》《伊本·凯西尔经注》）另一方面，先知（愿主福安之）在描述恶人死时其死亡之地散发出的恶臭时，真的拿起一块布捂在自己鼻子上，来形容那个灵魂会有多臭。而信士的芬芳，甚至会勾起天上天使的好奇，他们会问：这美好的香气是从哪里来的？（参见《穆斯林圣训实录》2872）\n\n而且，他们也都目睹了大地上的压迫。易卜拉欣（愿主赐他平安）被投入火中时，天使们难道不是在焦急地等待扑灭火焰的命令吗？就连青蛙都试图用嘴衔水去灭火。但真主自有安排：他命令火焰本身对易卜拉欣变得清凉平安——“火啊！你对易卜拉欣变成凉爽的和平的吧！”（《古兰经》21:69，马坚译）真主的使者（愿主福安之）不是说过吗：至仁主的天使们把翅膀覆展在沙姆（Ash-Sham）之上——那正是当今世上压迫最甚的地区。（《铁尔米兹圣训集》3594；此处为讲稿英文大意转述）在天使眼中，我们不是一串数字。你知道吗，赞美真主，我想起伊玛目艾哈迈德（愿主慈悯他）受刑的那段传述。有一个人说：我想起伊玛目艾哈迈德，想着他遭受鞭打时的坚忍，想着他身体孱弱却展现出那般力量，我不禁哭了。那天夜里，我在睡梦中听见一个声音对我说：你若能看见天上的天使们在他挨打时如何以他为荣，该多好！我说：天使们真的知道艾哈迈德在挨打吗？那声音回答：天上没有一位天使，不曾俯身注视他挨打的情景。（麦格迪西《顺民领袖受难记》）有多少天使目睹了加沙那位背诵《古兰经》的少年沙阿班（Shaaban）被焚烧？他们知道我们在经历什么。我们身边的每一位都知道。\n\n可你知道还有谁会得到我们的消息吗？我们在拜宰赫的亲人。赛达盖·本·苏莱曼·贾法利（愿主慈悯他）说：我曾做过一件可憎之事，在父亲去世之后为它懊悔不已。我犯了一项罪，后来在梦中见到了已故的父亲，他对我说：我的儿啊，当我们认定你的行为如同义人时，我别提多高兴了。可是有一回，我为你深感羞耻，所以，不要再让我在其他已故的信士面前蒙羞了。他的邻居们说：从那以后，每天夜里我们都能听见赛达盖在家中做夜间拜（qiyam）时祈祷：义人的匡正者啊，迷途者的向导啊，罪人的慈悯者啊！求你赐我一次美好的回归，归向你之后，永不再回到那曾使我蒙羞的事情上去。（伊本·艾比·敦亚《梦书》）在艾奈斯（愿主喜悦他）传述的一段圣训中，先知（愿主福安之）说：你们的行为会被呈报给你们已故的近亲：若是善行，他们就为之庆贺；若不是善行，他们就说：主啊，不要让他们死去，直到你引导他们，一如你曾引导我们。（《艾哈迈德圣训集》；暂无可核对的权威中文译文，此处中文为讲稿英文的忠实翻译）这就是走在我们前面的那些义人的心愿——而我们的消息抵达他们那里时，不带恶魔的宣传粉饰。我不禁想：当“自由巴勒斯坦”与阿克萨的消息被历代烈士们收到时，他们会如何迎接，真主意欲；我也想，哈蒂彻（愿主喜悦她）听到麦加光复的消息时，该有多么高兴；我还在想，先知（愿主福安之）对我们今天的努力——或者说我们的不作为——作何感想。相传，阿巴德·本·阿巴德曾去探望巴勒斯坦的长官易卜拉欣·本·萨利赫（愿主慈悯他），易卜拉欣对他说：请给我一些忠告。阿巴德对他说：你的行为会被呈报给亡者，而先知（愿主福安之）也在他们中间。光是这一点，就让易卜拉欣哭到胡须都被泪水浸透。我不禁想：易卜拉欣归真之时，或许亲自见到了先知（愿主福安之），那会是怎样的情景。\n\n你看，进入拜宰赫，就像演出全部落幕之后走进后台，或者与观众见面，听听他们这一路都在怎样议论你。但你不会想等到那时才弄明白。现在就问问自己：在所有注视你的人眼中，你是谁？先知（愿主福安之）此刻对你作何评价？他如何看待我们稳麦的现状？以你为荣的，是天使，还是因对你所做的一切而夸口的恶魔？亡者们怎样说你？先你一步进入拜宰赫的亲人们，听到了关于你行为的什么消息？他们对你的看法，会不会与你现在身边的人不同？在那个你尚未踏入的世界里，你的名声如何？在那个你尚未踏入的世界里，你的名声如何？\n\n引文核对说明：转录来源为 Yaqeen 官网官方 WP 接口（https://cdn.yaqeeninstitute.org/wp-json/wp/v2/posts/33046，acf.transcript_content，WEBVTT 全文，AI 生成，时长约 12:40），并以该集页面 References 逐条核对引文。古兰经 7:27、42:5、17:44、44:29、21:69 的阿拉伯原文经 api.quran.com text_uthmani 逐字核对，中文为马坚译（卡片与精华一句用 7:27 节选）。圣训阿拉伯原文经 sunnah.com 核对（鸡鸣驴叫：布哈里 3303、穆斯林 2729）；本集所引圣训与传述暂无可核对的权威中文译文，正文按讲稿英译忠实翻译并逐处标注出处，未作圣训正文式引译。伊本·阿巴斯“大地为信士哭泣四十天”一段，转录稿所附阿拉伯文有 AI 转写讹误，正文只按讲稿英译译出，未照录其阿拉伯文。References 中另列的宝座承载者为信士求饶（《古兰经》40:7）、天穹作响（铁尔米兹 2312）、临睡时天使与恶魔竞先（奈萨伊《大圣训集》）等条目，讲稿正文未引用，未收入译文。本篇为补档：该集已于 2026-10-16 推送，本次按午读规格重新取稿、翻译与制卡入档，未重复发送。", "cardImg": "noon_2026-10-16.jpg"}, {"date": "2026-10-17", "type": "30u30", "title": "30u30 第1天｜The Unreasonable Effectiveness of Recurrent Neural Networks", "card": "", "text": "30u30 第1天｜The Unreasonable Effectiveness of Recurrent Neural Networks（循环神经网络不可思议的有效性）——Andrej Karpathy，2015年博客\n\n一句话：这篇博客只做了一件看起来傻乎乎的事：把莎士比亚、Linux 内核源码一个字一个字喂给循环神经网络，只要求它猜下一个字。结果它自己学会了拼写、语法和格式，生成的莎剧台词和 C 代码像模像样——\"猜字游戏\"猜出了真本事。\n\n核心思想，用生活比方讲：\n想象一个特别爱玩接龙的人：你说上半句，他接下半句。要接得准，他必须记住前面聊了什么、谁在说话、括号开了有没有关上。RNN（循环神经网络）就是这样，它的脑子里有一个小本本（专业叫法是\"隐藏状态\"），每读一个字就往本本上更新一笔，靠这本小本本记住上下文；普通神经网络像看一张照片答一个问题，它像追连环画，一格一格往后看，还记得前情。\n\n训练方法笨得可爱：给它看海量文本，一个字一个字地让它猜\"下一个字是什么\"，猜错了就调整。没人教它语法，没人告诉它莎士比亚的人名要全大写、台词要缩进、C 代码语句末尾要加分号——这些规矩全是它为了把字猜准，自己从数据里琢磨出来的。用仓库笔记的话说：想预测得好，就必须摸清数据背后的结构。\n\n看看它学出来的东西：喂了 440 万字符的莎士比亚全集，它写出的台词里人物名全大写加冒号、节奏像模像样，连词儿都透着古风——只是偶尔生造单词，意思也连不上，学到的是\"形\"，不是\"意\"。喂了 Linux 内核源码，它生成的 C 代码有缩进、有分号、有注释腔，就是编译不过。喂维基百科，它会自己加上 [[链接]] 和日期格式。标题里的\"不可思议的有效性\"是借来的：1960 年物理学家维格纳写过名篇《数学在自然科学中不可思议的有效性》，Karpathy 说，字符预测这件事，也有一种说不清道不明的神奇。\n\n为什么重要：\n这是第一次有人用如此直观的方式让大众看见：原来\"预测下一个字\"这么简单的任务，能逼出对语言结构的理解。这篇博客也成了整套 30u30 的起点——仓库把它放在第 1 天，点题就一句：\"这就是 GPT 那个故事开始的地方。\"\n\n和现代 AI 的关系：\n今天 ChatGPT 们干的核心活儿，和这篇博客里一模一样：预测下一个 token（词片）。变的只是三件事：把 RNN 换成了 Transformer（第 13 天会讲），把\"字\"换成了更大的词片，把规模放大了上万倍。当然，这篇博客也埋下了 RNN 的死穴：小本本容量就那么大，文章一长，前面的就忘了，梯度还会消失——明天的第 2 天，讲的就是来救场的 LSTM。\n\n代码要点（仓库里的实现）：\n仓库 papers/01_Unreasonable_Effectiveness 里的 implementation.py 是纯 NumPy 的字符级 RNN，蓝本是 Karpathy 随博客发布的 min-char-rnn.py（一百来行）。模型本体只有三个权重矩阵加 tanh，一点不神秘。训练用的是随时间反向传播（BPTT），有个保命细节：梯度必须裁剪到 [-5, 5]，不然几百步就爆掉；优化器用 Adagrad。生成文本时有个\"温度\"旋钮：调低，输出更保守靠谱；调高，更放飞、错字也更多，0.7 到 0.8 通常最像样。还有两个坑仓库的笔记里写了：softmax 之前先减去最大值防止数值溢出；隐藏状态在每个 epoch 开头清零，但一批接一批之间要续上，不然学不到跨批的长规律。\n\n原文：https://karpathy.github.io/2015/05/21/rnn-effectiveness/\n当天页面：https://github.com/Ojhaharsh/30u30/tree/main/papers/01_Unreasonable_Effectiveness", "cardImg": ""}, {"date": "2026-10-17", "type": "午读", "title": "They May Have Another Name For You（第3集）", "card": "noon_2026-10-17.png", "text": "标题：Ep.3《They May Have Another Name For You》（他们也许用另一个名字称呼你）\n讲者：Dr. Omar Suleiman（奥马尔·苏莱曼博士）\n视频：https://www.youtube.com/watch?v=rivtc2KCbkE\nYaqeen 页面：https://yaqeeninstitute.org/watch/series/the-other-side-barzakh-and-beyond/your-name-in-the-heavens-the-other-side\n\n精华一句：\n故你们当记忆我，（你们记忆我），我就记忆你们；你们当感谢我；不要孤负我。——《古兰经》2:152，马坚译\n\n凝练一段：\n我们在人间忙着给自己挣名：头衔、声誉、被人称颂。可真正要紧的，是你在真主与众天使那边的\"名字\"：每个仆人都在诸天有一份名声，是好是坏，随行为而定。名字是父母给的，名声却是自己挣的——诚实挣来\"至诚者\"，贪财只落得\"财富的奴仆\"。你多记念真主，真主便在更尊贵的集会中记念你；到灵魂升天之日，天使将以你最配得的绰号呼唤你。那么，你在那边的名字是什么？\n\n完整全文翻译：\n你在这里叫什么名字？到了彼岸，他们又会怎么称呼你？我们一生花了那么多力气，只为给自己挣一个名字。从年幼时起，人就渴望被记住，渴望人们提起自己时带着钦佩。心理学甚至告诉我们：你的名字是你最强的兴奋剂——每个人都想听到自己的名字。想想人们有多兴奋：看到自己的名字被喜欢的明星提及，出现在喜欢的节目里，或刻在某块牌匾、某张证书上。可你想过没有：你在真主那里的名字是什么？在你周围的众天使那里、在先你而去的众灵魂那里，你的名声是什么？有没有可能，你在那边的名字，与你在这里的名字并不相同？你的名字前面会不会有一个头衔？或者，他们会不会用一种品质代替你的姓氏来称呼你？你又会在什么时候知道这一切？\n\n先知（愿主福安之）的一段祈祷词里，谈到了真主的尊名。他向真主祈求说：我以你所有的尊名向你祈求——你为自己所取的尊名、你在你的经典中启示的尊名、你传授给你任何一位受造物的尊名、以及你在你独有的幽玄知识中为自己保留的尊名（阿拉伯原文：«أسألك بكل اسم هو لك، سميت به نفسك، أو أنزلته في كتابك، أو علمته أحدا من خلقك، أو استأثرت به في علم الغيب عندك»；《艾哈迈德圣训集》，伊本·马斯欧德传述）。这意味着：有些尊名，真主或许传授给了我们之外的受造物——也许天使们以其他名字认识他，超出我们所知的范围；还有些尊名，是真主保留在幽玄之中的，他曾以此自称，而我们甚至无从接触。所以，我们知道\"拉赫曼\"（至仁主）、\"拉希姆\"（至慈主），但请想象，还有多少优美的尊名，我们从未听过。\n\n我们的先知（愿主福安之）也有许多名字。他说：«لي خمسة أسماء: أنا محمد، وأحمد، وأنا الماحي الذي يمحو الله بي الكفر، وأنا الحاشر الذي يحشر الناس على قدمي، وأنا العاقب»——\"我有五个名称：我是穆罕默德；我是艾哈迈德；我是抹去者，真主以我而抹去异教徒；我是集聚者，人们将集聚在我的面前；我是封印者。\"（圣训翻译百科全书 hadeethenc.com/zh 官方中文版；布哈里与穆斯林共同辑录，见《穆斯林圣训实录》2354）而\"封印者\"（阿吉卜），正是其后不再有任何先知的人。在另一段传述中，他还用许多名字称呼自己，其中包括\"纳比·拉赫曼\"（慈悯的先知），传述者亚泽德补述还有\"纳比·塔巴\"（忏悔的先知）（同上，hadeethenc.com/zh 官方中文版；《穆斯林圣训实录》2355）。这些名字中，有些是真主直接赐予他的，比如穆罕默德和艾哈迈德；但另一些名字，如\"萨迪格\"（诚实者）、\"艾敏\"（可信赖者），是他（愿主福安之）凭着受福的品格、在非凡的一生中挣来的。\n\n真主这样说到宰凯里雅之子叶哈雅：«اسمه يحيى لم نجعل له من قبل سميا»——\"他的名字是叶哈雅，我以前没有使任何人与他同名。\"（《古兰经》19:7 节选，马坚译）这既是向叶哈雅品格的报喜——他的品格将以\"哈亚\"（hayā，谦逊、羞耻心）来定义；也是他将成为烈士的报喜——因为\"叶哈雅\"意为\"生命\"，而众烈士是\"活着的\"（aḥyā）。但那都是先知们。我们这些普通人呢？\n\n先知（愿主福安之）说：«ما من عبد إلا وله صيت في السماء»——\"没有任何一个真主的仆人，不是已经在诸天有了一个'塞特'（ṣīt）——一个名字，或者说一份名声。\"（塔巴拉尼《中辞典》，艾布·胡莱赖传述；阿拉伯原文已经核对，该段暂无可核对的权威中文译文，此处为讲稿英文的忠实翻译。）这段圣训首先显明的是你的名声：先知（愿主福安之）接着说，若你在诸天的名声是好的，它会降临到大地上的人们那里；若是坏的，也同样会降下来。但设想一下：这份名声所系的名字，不只是你父母给你的名字，而是你的行为为你挣来的名字——那会怎样？\n\n有一段关于欧麦尔·本·阿卜杜勒·阿齐兹的优美故事，能让我们对此有惊人的洞见。欧麦尔说：一天晚上，我在梦中看见先知（愿主福安之），在一片绿色的草地上，他对我说：你将要接管我的稳麦的事务；当那一刻到来时，不要让人们流血。«فإن اسمك في الناس عمر واسمك عند الله جابر»——\"因为你在人们之中的名字是欧麦尔，而你在真主那里的名字是贾比尔（Jābir）。\"贾比尔，意为缝合者、带来安慰的人。赞美真主！就人的名字而言，作为一位领袖，\"贾比尔\"——带来安慰的人——恰恰是\"贾巴尔\"（Jabbār，暴君）的反面。但请想想这个梦给我们的启示：欧麦尔本是因祖父得名，寄望他成为祖父那样的人，而他确实做到了；但后来，真主把他放在一个境地里，让他得以解锁另一个名字。有时，真主也会把你放在某个境地，让你为自己解锁一个新的层次、一个新的名字——但你必须亲手挣得它。\n\n至于你父母给你的名字，它的好坏，只取决于你实际上拿它做了什么。当今之世，有多少名叫\"穆罕默德\"的人，所作所为却与他们所效法之人（愿主福安之）截然相反？你可以名叫\"阿卜杜拉\"（真主的仆人），实际上却以先知（愿主福安之）所说的名字著称：\"迪尔汗的仆人\"\"第纳尔的仆人\"——财富的奴仆（语出《布哈里圣训实录》2886：«تعس عبد الدينار والدرهم والقطيفة والخميصة، إن أعطي رضي، وإن لم يعط لم يرض»——第纳尔、迪尔汗、天鹅绒与华服的奴仆必遭毁灭：给了他，他就满意；不给，他就不悦；该段暂无可核对的权威中文译文，此处按讲稿转述）。昔日有一个暴君在麦地那大肆破坏，他的名字叫穆斯林·本·欧格白，可人们并不叫他\"穆斯林\"，而是叫他\"穆季里姆\"（Mujrim）——罪犯。\"智慧之父\"（艾布·哈卡姆）曾是一个男子的原名，但他因拒绝真理，最终以\"无知之父\"（艾布·杰赫勒）之名被人所知。另一面是艾布·伯克尔·随迪格（愿主喜悦他）：他因伊斯兰赢得了\"随迪格\"（诚实者）的头衔。但你必须亲自进入\"诚实\"（ṣidq）这所学校，才能为自己挣得这个名字。所以先知（愿主福安之）说：«وما يزال الرجل يصدق ويتحرى الصدق حتى يكتب عند الله صديقا»——\"人不断诚实、刻意追求诚实，直到在安拉那里被记为'至诚者'。\"（圣训翻译百科全书 hadeethenc.com/zh 官方中文版；《穆斯林圣训实录》2607）想想你在大地上要花多少年，才能挣得一个博士学位、一个医学博士学位，或别的什么头衔——在诸天挣得一个名字或头衔，同样需要时间和努力。而让你的名字在诸天被频频以赞美提及，又是何等美好。\n\n这正是先知（愿主福安之）嘱咐我们要多纪念真主、多做记念（dhikr）的原因。他说，你们用来纪念真主的，是他的赞颂（tasbīḥ，赞他清净）、他的太赫利勒（tahlīl，宣念他的独一）和他的颂扬（taḥmīd，对他的称颂）；而这些记念词会环绕宝座盘旋，发出如蜜蜂般的嗡嗡声，提及念诵它们的人——\"你们当中谁不愿意自己不断以这样的方式被提及呢？\"（《伊本·马哲圣训集》3809，努尔曼·本·拜希尔传述；阿拉伯原文：«إن مما تذكرون من جلال الله التسبيح والتهليل والتحميد، ينعطفن حول العرش، لهن دوي كدوي النحل، تذكر بصاحبها، أما يحب أحدكم أن يكون له - أو لا يزال له - من يذكر به»；该段暂无可核对的权威中文译文，此处为讲稿英文的忠实翻译。）你做的善越多，真主就越以他一切完美美好的尊名提及你，以你最美好的名字称呼你。真主说：\"故你们当记忆我，（你们记忆我），我就记忆你们；你们当感谢我；不要孤负我。\"（《古兰经》2:152，马坚译）如果你在内心纪念他，他就在他那里纪念你；如果你在一群人中纪念他，他就在一群更尊贵的人中纪念你——正如他在古都斯圣训中所说：\"我依照我的仆人对我的期望而待他；当他记念我时，我便与他同在。如果他在心中记念我，我就在我这里记念他；如果他在众人中记念我，我就在比他们更尊贵的众人中记念他。\"（布哈里与穆斯林共同辑录，见《穆斯林圣训实录》2675、《布哈里圣训实录》7405；圣训翻译百科全书 hadeethenc.com/zh 官方中文版）如果真主在那边以赞美提及你的名字，那么这边有多少仇视者以轻蔑提及你的名字，又有什么关系呢？无论他们怎样称他为\"穆赞曼\"（被谴责者），他永远是穆罕默德（愿主福安之）——永远受称颂。\n\n正如大地上有嫉妒，诸天里也有嫉妒。伊布利斯曾嫉妒安优卜（愿他平安）——为什么？因为安优卜在地上如此正直，他的名字在诸天被一再提及（见伊本·焦齐《明灯》）。但受益者不必是先知，也不必是名人。大地上多少名人，在诸天里是无名之辈？大地上多少无名之人，在诸天里却是名人？如果你在这里不被人谈论呢？如果你是个所谓\"无足轻重的人\"呢？要知道：只要你在那边被认识，谁在这里认识你并不重要。就像欧麦尔（愿主喜悦他）对一个从战场回来、正逐一列出阵亡者名字的人说的：那人念完所有知名的名字后说：\"还有一群人，是信士的长官所不认识的。\"欧麦尔哭了，他说：\"只要真主认识他们，信士的长官不认识他们，又有什么关系呢？\"（伊本·凯西尔《始与终》10:124）\n\n那么，你在诸天的名字是什么？你此刻在那个世界里被谈论的程度如何？如果你的名字是\"法鲁克\"（Fārūq，明辨真理与虚妄者）——因为你在一个充斥宣传的时代里引领真理？如果你的名字是\"阿迪尔\"（ʿĀdil，公正的人）——因为你在一个压迫的世界里为正义奋斗？或者他们叫你\"塔希拉\"（Ṭāhira，纯洁者）——因为你拒绝被不端与压迫的罪行玷污？在拜宰赫里，关于你的头条新闻写的是什么？这不是无法知道的：把《古兰经》中每一种善与恶的品质都拿来，问问自己，哪一种最切合你。\n\n好，撇开我们自己的内省：我们何时才能知道自己在那边的名字和名声？首先，你在活着时就能知道。有人问先知（愿主福安之）：\"你如何看待一个人，他行了善，人们便称赞他？\"他（愿主福安之）说：«تلك عاجل بشرى المؤمن»——\"那是信士提前得到的喜报。\"（《穆斯林圣训实录》2642；该段暂无可核对的权威中文译文，此处为讲稿英文的忠实翻译。）然后，你的殡礼（janāzah）会到来，大地上的见证人将为\"你在这里是怎样的人\"作证。如果今天就是你殡礼的日子，人们谈论你时，每个人都会提到的、且确实属实的那种品质，会是什么？因为先知（愿主福安之）说：\"你们是真主在大地上的见证人。\"（《布哈里圣训实录》1367、《穆斯林圣训实录》949）\n\n然后，在你的殡礼之后，你的灵魂将亲耳听见这一切。我们死去时，将以那些绰号被称呼——依据真主对我们的了解，以及他向诸天所宣告的关于我们的事；而诸天的见证人——众天使——将以那些名字说话。先知（愿主福安之）这样讲述善良的灵魂上升时的情景：他们每经过一群天使，天使们都会说：\"这芬芳的灵魂是什么人的？\"而怀抱你的天使会说：\"是某人，某人之子。\"他们会以你最喜爱的绰号称呼你。反过来，如果那灵魂是邪恶的，先知（愿主福安之）说，他们会说：\"这恶臭是什么？\"天使会说：\"是某人，某人之子。\"他们会以最恶劣的绰号称呼它。（《艾哈迈德圣训集》灵魂升天长篇圣训，白拉·本·阿济卜传述；此处按讲稿转述，暂无可核对的权威中文译文。）\n\n那么，你究竟是谁？你出生时，有一张属灵的出生证明。上面写的不是\"男\"或\"女\"，而是你将是\"赛义德\"（saʿīd，蒙福者）还是\"沙基\"（shaqī，薄命者）（语本伊本·马斯欧德传述的圣训：胎儿在母腹中即被记录其行为、给养、寿限与祸福，见《布哈里圣训实录》3208、《穆斯林圣训实录》2643）。而现在，你有一张属灵的死亡证明，上面写着\"泰伊拜\"（ṭayyiba，纯洁）或\"海比萨\"（khabītha，污秽）——基于你的灵魂在大地上这段时间里所积攒的一切。那才是那一刻最重要的名字——不是你墓碑上的名字，而是那块石头另一边、以你的名字做下的那份预留。但在你的灵魂完全进入坟墓之前，有没有办法预先看一眼，那份预留为你在彼岸准备了什么？\n\n引文核对说明：转录来源为 Yaqeen 官网官方 WP 接口（https://cdn.yaqeeninstitute.org/wp-json/wp/v2/posts/33073，acf.transcript_content，WEBVTT 全文，AI 生成，时长 13:03）+ 该集页面 References 脚注核对引文；转录稿结尾的悬念问句重复出现一次，正文译出一次。古兰经 2:152、19:7 阿拉伯原文取自 api.quran.com text_uthmani，中文为马坚译（api.quran.com 资源 56），逐字核对；2:152 译文中的括注为该数字版本原文所有，照录。圣训阿拉伯原文经 sunnah.com、hadeethenc 与 dorar.net 圣训百科逐字核对。圣训中文采用圣训翻译百科全书（hadeethenc.com/zh）官方中文版的有：先知诸名（《穆斯林圣训实录》2354 及另一传述 2355）、\"至诚者\"（《穆斯林圣训实录》2607）、古都斯圣训\"记念我\"段（《穆斯林圣训实录》2675、《布哈里圣训实录》7405）。其余圣训——《艾哈迈德圣训集》尊名祈祷词、塔巴拉尼《中辞典》\"诸天名声\"（多拉尔百科核阿拉伯原文，阿尔巴尼判为真实，见《真实圣训总汇》5732）、《布哈里圣训实录》2886\"财富的奴仆\"、《伊本·马哲圣训集》3809\"记念词环绕宝座\"、《穆斯林圣训实录》2642\"提前的喜报\"、《艾哈迈德圣训集》灵魂升天长篇圣训——暂无可核对的权威中文译文，正文按讲稿英文忠实翻译并逐处标注，未作圣训正文式引译；\"大地上的见证人\"（布哈里 1367、穆斯林 949）与\"出生即记录祸福\"（布哈里 3208、穆斯林 2643）为讲稿转述，阿拉伯原文已核对。欧麦尔·本·阿卜杜勒·阿齐兹之梦、欧麦尔与无名烈士、穆斯林·本·欧格白易名等故事，均按该集 References 所列出处（伊本·艾布·顿亚《梦书》、伊本·凯西尔《始与终》10:124、伊本·哈兹姆《史传精华》、伊本·焦齐《明灯》）随讲稿译出。", "cardImg": "noon_2026-10-17.jpg"}, {"date": "2026-10-17", "type": "夜读", "title": "背影", "card": "", "text": "夜读 · 朱自清《背影》\n\n我与父亲不相见已二年余了，我最不能忘记的是他的背影。那年冬天，祖母死了，父亲的差使也交卸了，正是祸不单行的日子，我从北京到徐州，打算跟父亲奔丧回家。到徐州见着父亲，看见满院狼藉的东西，又想起祖母，不禁簌簌地流下眼泪。父亲说：\"事已如此，不必难过，好在天无绝人之路！\"\n\n回家变卖典质，父亲还了亏空；又借钱办了丧事。这些日子，家中光景很是惨淡，一半为了丧事，一半为了父亲赋闲。丧事完毕，父亲要到南京谋事，我也要回到北京读书，我们便同行。\n\n到南京时，有朋友约去游逛，勾留了一日；第二日上午便须渡江到浦口，下午上车北去。父亲因为事忙，本已说定不送我，叫旅馆里一个熟识的茶房陪我同去。他再三嘱咐茶房，甚是仔细。但他终于不放心，怕茶房不妥帖；颇踌躇了一会。其实我那年已二十岁，北京已来往过两三次，是没有什么要紧的了。他踌躇了一会，终于决定还是自己送我去。我两三回劝他不必去；他只说：\"不要紧，他们去不好！\"\n\n我们过了江，进了车站。我买票，他忙着照看行李。行李太多了，得向脚夫行些小费，才可过去。他便又忙着和他们讲价钱。我那时真是聪明过分，总觉他说话不大漂亮，非自己插嘴不可。但他终于讲定了价钱；就送我上车。他给我拣定了靠车门的一张椅子；我将他给我做的紫毛大衣铺好坐位。他嘱我路上小心，夜里要警醒些，不要受凉。又嘱托茶房好好照应我。我心里暗笑他的迂；他们只认得钱，托他们直是白托！而且我这样大年纪的人，难道还不能料理自己么？唉，我现在想想，那时真是太聪明了。\n\n我说道：\"爸爸，你走吧。\"他往车外看了看，说：\"我买几个橘子去。你就在此地，不要走动。\"我看那边月台的栅栏外有几个卖东西的等着顾客。走到那边月台，须穿过铁道，须跳下去又爬上去。父亲是一个胖子，走过去自然要费事些。我本来要去的，他不肯，只好让他去。我看见他戴着黑布小帽，穿着黑布大马褂，深青布棉袍，蹒跚地走到铁道边，慢慢探身下去，尚不大难。可是他穿过铁道，要爬上那边月台，就不容易了。他用两手攀着上面，两脚再向上缩；他肥胖的身子向左微倾，显出努力的样子。这时我看见他的背影，我的泪很快地流下来了。我赶紧拭干了泪，怕他看见，也怕别人看见。我再向外看时，他已抱了朱红的橘子往回走了。过铁道时，他先将桔子散放在地上，自己慢慢爬下，再抱起桔子走。到这边时，我赶紧去搀他。他和我走到车上，将橘子一股脑儿放在我的皮大衣上。于是扑扑衣上的泥土，心里很轻松似的，过一会说：\"我走了，到那边来信！\"我望着他走出去。他走了几步，回过头看见我，说：\"进去吧，里边没人。\"等他的背影混入来来往往的人里，再找不着了，我便进来坐下，我的眼泪又来了。\n\n近几年来，父亲和我都是东奔西走，家中光景是一日不如一日。他少年出外谋生，独立支持，做了许多大事。哪知环境却如此颓唐！他触目伤怀，自然情不能自已。情郁于中，自然要发之于外；家庭琐屑便往往触他之怒。他待我渐渐不同往日。但最近两年不见，他终于忘却我的不好，只是惦记着我，惦记着我的儿子。我北来后，他写了一封信给我，信中说道：\"我身体平安，惟膀子疼痛厉害，举箸提笔，诸多不便，大约大去之期不远矣。\"我读到此处，在晶莹的泪光中，又看见那肥胖的，青布棉袍，黑布马褂的背影。唉！我不知何时再能与他相见！\n\n1925年10月在北京\n\n——朱自清《背影》", "cardImg": ""}, {"date": "2026-10-18", "type": "晨读", "title": "上午的光", "card": "morning_2026-10-18.png", "text": "晨读 · 上午的光\n\n一句话：\n誓以上午，誓以黑夜，当其寂静的时候，你的主没有弃绝你，也没有怨恨你。\n——马坚译 · 《古兰经》93:1-3\n\n一段话：\n我的仆人们啊！你们昼夜都在犯罪，我将饶恕一切罪恶，故你们当祈求我的饶恕，我会饶恕你们。我的仆人们啊！那只是你们自己的善功，我将详尽地加以统计，以便完美地赏赐你们。所以，谁得善报，当感赞真主；谁得恶报，当自责。\n——《穆斯林圣训实录》2577，艾布·赞尔传述；中文译自圣训翻译百科全书（hadeethenc.com）\n\n一篇文章：\nYaqeen 的 Dr. Jibran Khokhar 写了篇《Prophetic Solutions for Doom Spiraling》，讲的就是\"越想越绝望\"的恶性循环怎么破。开头很扎心：\"万一考试砸了怎么办？万一永远找不到想要的工作怎么办？\"一个焦虑的念头会繁殖出几十个相关的恐惧，把人困在原地。\n\n现代心理学有个办法叫\"抽离\"：把自己的处境当成别人的事来看，情绪强度立刻降下来。文章说，信仰给了我们更深的一层：托靠（tawakkul）。内心的声音说\"你完了\"，信仰提醒你：真主的慈悯和大能，永远大于眼前的考验。\n\n文章举了个让人难忘的例子：壕沟之战最黑暗的时候，穆斯林们饥寒交迫挖战壕，遇到一块砸不动的巨石。先知 ﷺ 挥斧三下，每一下迸出的火花里他都说看到了未来：\"沙姆的钥匙\"\"波斯的钥匙\"\"也门的钥匙\"。在几乎看不到生路的时刻，他谈的是希望。\n\n最关键的一句：希望不是被动的心态，而是要行动。先知 ﷺ 说，即使复生日降临，你手里还有一株树苗，只要来得及种下，就种下它。哪怕一个微笑，都是在下坠中种下希望。\n\nhttps://yaqeeninstitute.org/read/paper/prophetic-solutions-for-doom-spiraling-cultivating-hope-in-a-cycle-of-negativity-essay", "cardImg": "morning_2026-10-18.jpg"}, {"date": "2026-10-18", "type": "30u30", "title": "30u30 第2天｜Understanding LSTM Networks", "card": "", "text": "30u30 第2天｜Understanding LSTM Networks（理解 LSTM 网络）——Christopher Olah，2015年博客\n\n一句话：这是一篇图解长文，讲清楚了 LSTM（长短期记忆网络）是怎么靠一条\"记忆传送带\"和三道\"门\"记住长期信息的，它成了之后十年网上所有 LSTM 图解的祖师爷。\n\n核心思想，用生活比方讲：\n想象你在读一本很长的小说，看到第 200 页突然要回答\"主角小时候养过什么狗\"。普通循环神经网络（RNN）就像没带笔记本读书，越读前面的忘得越多，因为它每走一步都要把记忆\"揉\"一遍，揉多了就糊了，这就是梯度消失。\n\nLSTM 聪明在哪？它单独铺了一条\"传送带\"（细胞状态），信息可以直接躺在上面滑过去，不被揉搓。传送带旁边站着三个管理员：\n遗忘门：看一眼旧笔记，决定擦掉哪些（比如\"之前的主角是男性\"这条信息，新主角登场了就擦掉）\n输入门：决定把哪些新内容写上去\n输出门：决定这一步要把笔记里的哪部分拿出来用\n更新靠加法而不是乘法：旧记忆 × 遗忘门 + 新内容 × 输入门。加法让梯度可以直接流回去，消失问题就这么治好了。\n\n为什么重要：\n在 2015 年，这是第一次有人把 LSTM 的内部机制画得人人能看懂。它提出的\"加法式记忆\"思路直接成了后来所有门控循环网络的模板——包括简化版的 GRU。文章还顺带做了一件事：认真对比了各种 LSTM 变体，引用 Greff 等人的结论说\"变体之间其实都差不多\"，核心就在于那条传送带。\n\n和现代 AI 的关系：\nLSTM 是 Transformer 之前的王者，统治了机器翻译、语音识别好多年。2017 年《Attention Is All You Need》之后，Transformer 用自注意力取代了循环结构，LSTM 退居二线。但有意思的是，Olah 在文章结尾就预言了：\"下一步是注意力机制。\"他猜对了方向，只是没猜到注意力会彻底取代 LSTM。今天 LSTM 还活在时间序列预测、流式语音、边缘小模型这些地方。\n\n代码要点（仓库里的实现）：\n仓库 papers/02_Understanding_LSTM 下有纯 NumPy 实现的 LSTM 类：forward 前向算出四个门的输出，backward 反向传播，更新权重；train_minimal.py 可以直接在文本文件上训练，还能采样生成文本。几个实用坑仓库的速查里都写了：学习率太高 loss 会爆成 NaN（加梯度裁剪，代码里已经有 np.clip(grad, -5, 5)）；loss 不降多半是遗忘门偏置没初始化成 1（让门默认\"记住\"是个标准技巧）。\n\n原文：http://colah.github.io/posts/2015-08-Understanding-LSTMs/\n当天页面：https://github.com/Ojhaharsh/30u30/tree/main/papers/02_Understanding_LSTM", "cardImg": ""}, {"date": "2026-10-18", "type": "午读", "title": "What Do My Dreams Really Mean?（第4集）", "card": "noon_2026-10-18.png", "text": "标题：Ep.4《What Do My Dreams Really Mean?》\n讲者：Dr. Omar Suleiman（奥马尔·苏莱曼博士）\n视频：https://www.youtube.com/watch?v=Mc5Nj65GFmM\n\n精华一句：\n人们到了死亡的时候，真主将他们的灵魂取去；尚未到死期的人们，当他们睡眠的时候，真主也将他们的灵魂取去。——《古兰经》39:42，马坚译\n\n凝练一段：\n每晚入睡，都是一次小死：灵魂离体而去，或与亡者相会，或瞥见乐园，或带来讯息，清晨又被送回，给你再一次忏悔的机会。梦有三种——来自真主的佳梦、来自恶魔的噩梦、日有所思的呓语；分辨的钥匙不在梦本身，而在你醒着的心：言语诚实的人，梦也真实；心醒着的人，梦才是礼物，而非迷途。\n\n完整全文翻译：\n你梦见过什么？你的梦又是由什么构成的？你的梦曾警告过你、指引过你，还是让你陷入困惑？你的梦告诉了你关于自己的什么？它们是你日思夜想的一面镜子，还是来自幽玄世界给你的讯息？当你梦见已故的亲人，是他们在探望你，还是你的灵魂在前往他们的世界？你的梦可以是一扇通往潜意识的窗，也可以是一道门，通向彼岸那个等待着你的世界。每个夜晚，你的灵魂都会离开你的身体，去探访你的下一站，然后再回来，给你又一次向真主忏悔的机会——趁一切还来得及。\n\n在加沙有一位28岁的年轻人，名叫阿米尔，住在纳赛尔医院里。视频里可以看到他失去了一只眼睛，经历了多次手术。采访他的医生问他：这是怎么回事？你遭受了如此残酷的打击，为什么看起来还这么开心？他说：你看，我28岁，在医院里住了40天。而那是我一生中最美好的五秒钟。\n\n\n\n这让我想起先知（愿主福安之）时代的一件事。艾奈斯（愿主喜悦他）说，先知（愿主福安之）喜爱美好的梦。每天他都会问圣门弟子们：你们当中有谁昨晚做了好梦？艾奈斯（愿主喜悦他）说，如果做梦的人以品行端正著称，先知（愿主福安之）就会更加重视他的梦。于是有一位妇女来到先知（愿主福安之）面前说：真主的使者啊，我梦见自己进入了乐园。她还说出了在那里见到的十二个男子的名字。她说，他们浑身是血。然后真主——赞美他，至高无上的他——对一群天使说：把他们带到拜宰赫之河去（阿拉伯原文作\"去نهر البيذخ\"，转录稿音译为 nahr al-barzakh）。他们进入那条河，再出来时，面庞皎洁如满月。接着他们得到了金色的座椅，面前摆着新鲜的食物和椰枣。她说：我坐下来，和他们一起吃了。然后，就在那位妇女讲完她的梦的那一刻，一个人来到先知（愿主福安之）面前，带来了消息：正是先知（愿主福安之）早前派出去远征的那十二个人，如今全部殉难了。那么，这里到底发生了什么？这些人是真的进入了乐园吗？他们是进入了拜宰赫吗？他们真的在与别的灵魂相会吗？\n\n在心理学中，梦被称为\"通往无意识的康庄大道\"。梦会告诉我们很多关于自己的事：我们的无意识里装着什么，现实中我们在牵挂什么，我们的心真正连着哪里。如果你看义人们的梦，他们总是在梦见先知（愿主福安之），或梦见乐园的景象，或梦见其他义人——因为他们的梦映照着充满他们内心、头脑和灵魂的东西。你的梦也同样映照着充满你的东西。所以，是的，我们的梦充满意义，哪怕是那些源于我们自身的梦。在伊斯兰中，梦自有其分量，但我们也不能把它抬高到开始忽视清晰现实的地步。说到底，不要活在梦里，活到不再去追寻《古兰经》和圣训中鲜活的指令。你们的先知（愿主福安之）要的不是一个沉睡的稳麦。毕竟，他——愿主赐他平安与祝福——是那个双眼闭上、心却从不睡眠的人。当你的心醒着，奇妙的事就会发生。\n\n先知（愿主福安之）说：\"你们中最真实的梦，就是那些说话最真实的。\"（圣训翻译百科全书 hadeethenc.com/zh 官方中文版）所以，一位席迪格（诚实者）——我们之前讲过的——会因为诚实的心而得到带有真实指引的梦。先知（愿主福安之）还说：\"最恶劣的谎言是：有人声称他看到了没有看到的东西。\"（圣训翻译百科全书 hadeethenc.com/zh 官方中文版）随着末日的临近，时代越来越充满欺骗——今世表面上看似真实的东西其实是谎言，有时反之亦然——先知（愿主福安之）说，真主会以几乎不会落空的梦来回赐我们。（\"当时间接近尾声时，信士的梦几乎不假。\"——圣训翻译百科全书 hadeethenc.com/zh 官方中文版）梦中始终带有一分真实，以至于先知（愿主福安之）把它形容为先知品格的四十六分之一。（\"信士的梦是圣品的四十六分之一。\"——同上）你可能会问，这个数字怎么理解？在先知（愿主福安之）接受启示的23年里，头六个月，真主只通过真实的梦与他沟通。六个月占23年，正好是四十六分之一。当然，区别在于：我们不会因为梦而成为先知。而且与先知们——他们的梦永远真实——不同，我们这些人，有的梦真实，有的梦不真实。\n\n先知（愿主福安之）说，梦有三种：一种是来自真主——赞美他，至高无上的他——的真实异象；一种是来自恶魔的令人不安的噩梦；还有一种是\"哈迪苏·奈夫斯\"（hadithun-nafs），即我们反刍的念头，这是大多数梦。他（愿主福安之）说，如果有人见到了自己不喜欢的东西，就不要去寻求它的解释。相反，让他起身礼拜，不要把这件事告诉别人。在另一段传述中，先知（愿主福安之）警告说，噩梦的解释系于鸟足之上。想象一下，它在你头顶飞翔——他是说，不要通过寻求解释让它应验、落到你身上。相反，只管向真主——赞美他，至高无上的他——求护佑。（此处为讲稿英文大意转述；\"梦有三种\"\"梦系鸟足\"两段圣训的阿拉伯原文已核对，暂无可核对的权威中文译文，故未作圣训正文式引译。）\n\n但除了梦的不同种类，事实是：梦依然是一扇门，通向来自幽玄世界的沟通——无论是真主通过天使传来的讯息，还是对即将发生之事的直接启示，或是与已故亲人的相见。在一段传述中，当先知（愿主福安之）听人讲述一个关于他的梦时，他明确地说：灵魂确实相会（阿拉伯原文：إن الروح يلقى الروح；该段暂无权威中文译文，此处为大意）。这是什么意思？我们的灵魂真的在梦中相会，还是这只是象征？如果真的相会，谁去往哪里？是我们的灵魂前往拜宰赫，还是亡者的灵魂回到今世？首先，真主——赞美他，至高无上的他——当然能跨越维度连接灵魂，哪怕他们还活在今世。看看欧麦尔（愿主喜悦他）对赛里耶（愿主喜悦他）的喊话：赛里耶是他的一位统帅，远在千里之外，军队在山后遭到伏击。欧麦尔在麦地那竟感知到了这一切，喊道：\"赛里耶，山！山！\"（Ya Sariatul Jabal——赛里耶啊，看山那边！）而赛里耶远在波斯听到了这喊声，率军退守山地，击退了进攻。伊本·盖伊姆（愿主慈悯他）说：活着的灵魂确实能以唯有真主知晓的方式相会，无论睡着还是醒着。\n\n灵魂的连接不只发生在今世的维度里。真主也必定会让灵魂在拜宰赫这一维度里跨越空间相会。每个夜晚，你都在睡梦中与拜宰赫相遇，因为每个夜晚你都会经历一次小死。真主——赞美他，至高无上的他——说：\"人们到了死亡的时候，真主将他们的灵魂取去；尚未到死期的人们，当他们睡眠的时候，真主也将他们的灵魂取去。他已判决其死亡者，他扣留他们的灵魂；他未判决其死亡者，便将他们的灵魂放回，至一定期。对于能思维的民众，此中确有许多迹象。\"（《古兰经》39:42，马坚译）睡眠时灵魂被取去，然后又被送回。是的，你们的灵魂到了另一个世界，但仍与身体相连——这就是为什么身体还活着，尽管意识已降到最低。睡得越深，你对今世的意识和觉知就越淡，就越可能滑入拜宰赫。反过来，睡得越浅，就越不可能做真实的梦，越可能只是在脑中重播念头，经历\"哈迪苏·奈夫斯\"。伊本·盖伊姆（愿主慈悯他）在《灵魂之书》（Kitab al-Ruh）中解释了灵魂如何前往拜宰赫。人真正死亡时，灵魂从口中离去——如先知（愿主福安之）所说——双眼追随它，直到它彻底离开身体。赞美真主，你常能看到烈士的面容：口微张，双眼上望，带着微笑，仿佛看见自己离开这个世界。但伊本·盖伊姆（愿主慈悯他）说，睡眠者的灵魂仍系于身体，像一道光从鼻孔逸出——只是部分地。诚实的灵魂上达诸天再返回；说谎的灵魂则在半空遇到恶魔，异象就被败坏了。\n\n伊本·阿巴斯（愿主喜悦他）说，活着的信士之魂与亡者之魂会在梦的世界里相会，彼此询问一些事情。真主扣留亡者的灵魂，把活人的灵魂送回身体。那么，怎么分辨这些梦呢？有一些征兆可以留意。如果梦来自真主——赞美他，至高无上的他——它要么命你行善、禁你作恶——因为真主——尊贵威严的他——永远只这样命令你；要么它会应验——因为真主——赞美他，至高无上的他——只以真实沟通；要么它会增长你的信仰——因为真主——尊贵威严的他——会赐给你能增长信仰的东西，这正是我们与真主——赞美他，至高无上的他——关系的常态。当然，还有什么比亲见先知（愿主福安之）本人更殊胜？那必定来自真主，因为恶魔无法化作先知（愿主福安之）的形象。\n\n如果梦来自恶魔，想想恶魔想让你干什么。第一，它让你恐惧——因为真主——尊贵威严的他——说：\"那个恶魔，只图你们畏惧他的党羽\"（《古兰经》3:175，马坚译）；它还会煽动你的欲望，怂恿你犯罪；或者给你一些违背启示的东西，哪怕它看起来像个美梦。所以，你不可能在梦里领受新的启示，或得到某种真主——赞美他，至高无上的他——的新征兆——只要它不是宗教中已确立的。但如果梦来自我们大脑里储存的残余记忆，在睡眠中被上传到意识里，那它就是无意义的，可能是我们未解的心结或紧张情绪，闪回与记忆的混杂。有时里面也有好的东西——因为你一直在往意念里装好的东西——你可能看见清真寺、《古兰经》，但也混着一堆毫无道理的东西。那就是\"哈迪苏·奈夫斯\"。\n\n说到真实的梦与灵魂的相会，亡者不能决定去探望谁，活人也不能决定见到哪位亡者。这些都是真主——赞美他，至高无上的他——出于特定的原因赐予的礼物。所以，如果你有已故的亲人，别因为觉得他们在梦里探望别人比探望你多而生气。睡后真主是否把你的灵魂送回、是否让灵魂们在睡梦中相会，全由真主——赞美他，至高无上的他——定夺。那么，在这类与灵魂沟通的梦里，我们会看到什么？有时你只是看到所爱的人，穿着他们最喜欢的衣服，以最美的样子，在乐园里漫步，梦中对你微笑。有时他们看起来很忧愁，因为他们需要你做点什么，好升到更高的品级。有时你会看到有人出现，请你去处理一笔债务——就像萨比特·本·盖斯（愿主喜悦他）：耶玛麦战役之后，这位烈士在梦中出现，请他的同伴去找一副在战场上被偷走的铠甲，并说出了确切的地点。他还说：去请艾布·伯克尔（愿主喜悦他）——哈里发——用这副铠甲替我偿还一笔债务。结果，铠甲就在他说的那个地方找到了，艾布·伯克尔（愿主喜悦他）真的按梦中所托行事了。\n\n有时是忠告。伊玛目苏富扬·绍里（愿主慈悯他）的许多学生在他去世后仍在梦中见到他，他还在给他们忠告。苏富扬·本·欧耶奈（愿主慈悯他）说：我梦见我的老师苏富扬·绍里（愿主慈悯他），我说：请给我忠告。他说：你要少交际，亲近的人要少。也有人只是在乐园里见到他，在梦里问他是怎么到那里的。贾乌利（愿主慈悯他）传述：有人梦见苏富扬·绍里，问他：真主怎样对待你了？他说：我刚被放入坟墓，转眼就站在了众世界的主面前。我进去后，立刻有人对我说：苏富扬。我说：在。他说：你还记得有一天，你把真主看得比自己的欲望更重吗？我说：记得。话音刚落，乐园的大盘美食就端到了我面前。还有一个人，苏艾尔·本·海姆斯（愿主慈悯他）说：梦里我看见苏富扬·绍里（愿主慈悯他）从一棵椰枣树飞到另一棵椰枣树，口中一直念着：\"一切赞颂，全归真主！他对我们实践了他的约言。\"（《古兰经》39:74，马坚译）赞美真主，当你看到已故的父母、老师或朋友享受乐园的甘美，是多么甜蜜。有时你甚至会看到有人告诉你，你的时辰快到了，他们正为你的到来而欣喜。这些都是可能的。但再说一遍：你不能活在梦里。你活在清醒时做出的一个个选择里——正是这些选择，决定你的下一站究竟是哪里。重要的是：不要把噩梦变成自我实现的预言，也不要把美梦当成虔诚的试金石。因为，我们睡眠时，心绝不该睡。但你能做的最美的梦、能相见的最好的灵魂，是真主最优秀的造化——真主的使者（愿主福安之）。在梦中见到他，是何等特别的恩典。\n\n引文核对说明：转录来源为 Yaqeen 官网官方接口（https://cdn.yaqeeninstitute.org/wp-json/wp/v2/posts/33111，acf.transcript_content，WEBVTT 全文，时长 15:45）；转录稿 1:39–2:20 为采访原声视频片段、无文字，结尾一句截断，正文已如实标注。古兰经 39:42、3:175、39:74 阿拉伯原文取自 api.quran.com text_uthmani，中文为马坚译，逐字核对。圣训阿拉伯原文经 sunnah.com 核对，中文采用圣训翻译百科全书（hadeethenc.com/zh）官方中文版；\"梦有三种\"\"梦系鸟足\"\"灵魂相会\"三段暂无可核对的权威中文译文，正文按讲稿大意转述并已标注，未作圣训正文式引译。", "cardImg": "noon_2026-10-18.jpg"}, {"date": "2026-10-18", "type": "夜读", "title": "麦琪的礼物（节选）", "card": "night_2026-10-18.png", "text": "夜读 · 欧·亨利《麦琪的礼物》（节选）\n王永年 译（人民文学出版社《欧·亨利短篇小说选》）\n\n圣诞前夜。德拉只有一元八角七分，却想给丈夫吉姆买一件像样的礼物。她做了一个决定——\n\n德拉的美丽的头发披散下来，微波起伏，闪烁生光，有如一股褐色的小瀑布。它的长度达到膝部以下，仿佛给她披上了一件衣服。她又神经质地、匆匆地把头发挽了起来。有一次，她踌躇了一分钟，静静地站着，一两滴眼泪溅落在破旧的红地毯上。\n\n她穿上那件旧的褐色夹克，戴上那顶旧的褐色帽子，裙子一摆，眼里仍闪耀着光芒，飘出房门，下楼跑到街上。\n\n她停步的地方，招牌上写着：\"索夫罗妮夫人——专营各种头发用品。\"德拉跑上一层楼，气喘吁吁地定定神。夫人身躯庞大，脸色过分白皙，冷若冰霜，简直不像\"索夫罗妮\"。\n\n\"你要买我的头发吗？\"德拉问。\n\n\"我买头发，\"夫人说。\"把帽子脱下来，让我看看头发的样子。\"\n\n褐色的小瀑布披散下来。\n\n\"二十块钱，\"夫人用内行的手托起那一团头发说。\n\n\"快给我，\"德拉说。\n\n啊！接下来的两个小时，仿佛插上了玫瑰色的翅膀。她在各家商店里搜寻给吉姆的礼物。\n\n她终于找到了。那一定是专为吉姆特制的，决非为别人。各家商店都没有这样一件东西，她把所有的商店都翻了个底朝天。这是一条白金表链，设计简单朴素，单凭质地而不用装潢来炫耀价值——正如一切好东西都应该这样。这条表链甚至配得上那只金表。她一看见就知道一定属于吉姆。像吉姆本人。朴实无华而又价值不菲——两者正可形容。她花去二十一块钱买了它，匆匆赶回家去，兜里还剩八角七分。有了这条表链，吉姆在任何场合都可以名正言顺地看时间了。金表虽好，有时他却偷偷地看一眼，只因为表上系的是旧皮带，而不是表链。\n\n七点钟，咖啡煮好了，煎锅放在炉子上，又热又准备煎肉排。\n\n吉姆从来不晚。德拉把表链对折，攥在手里，坐在靠近房门的一张桌子旁，吉姆进来总是先到那里。\n\n接着她听到他下楼梯的声音，她的脸色刷地一下变得苍白。她有一个每天都要默念的简单的小祈祷：\"上帝啊，但愿他觉得我还是漂亮的。\"\n\n门开了，吉姆走了进来，又把门关上。他看上去瘦削而严肃。可怜的人儿，他只有二十二岁——却负担着一个家庭！他需要一件新大衣，手上连手套也没有。\n\n吉姆走到门口，纹丝不动地站住，像猎狗嗅到鹌鹑气味似的。他的眼睛盯着德拉，流露出一种她无法理解的神情，把她吓坏了。那既不是愤怒，也不是惊讶，又不是不满，更不是厌恶；那是她意料之外的任何一种神情。他只是古怪地盯着她，脸上带着那种神情。\n\n德拉从桌上溜下来，向他走去。\n\n\"吉姆，亲爱的，\"她喊道，\"别那样看着我。我把头发剪了卖掉，因为不给你买一件礼物，我过不去这个圣诞节。它会再长起来的——你不会见怪，是吗？我是不得已才这么办的。我的头发长得快。说'圣诞快乐'，吉姆，让我们快快乐乐的吧。你不知道我给你买了一件多么好的——多么美丽精致的礼物啊！\"\n\n\"你把头发剪掉了？\"吉姆吃力地问道，好像他还没有弄清这个显而易见的事实。\n\n\"剪掉了，卖掉了，\"德拉说。\"你不也同样喜欢我吗，吉姆？没有了长发，我还是我，不是吗？\"\n\n吉姆从大衣口袋里掏出一包东西，扔在桌上。\n\n\"德拉，\"他说，\"别对我有什么误会。不管是剪头发、修脸，还是洗头，我对我的姑娘的爱情是绝不会减低一分的。但是，如果你把那包东西拆开，就能明白我刚才为什么愣住了。\"\n\n她那白皙灵巧的手指撕开了线绳和包装纸。接着是一声狂喜的叫喊；紧接着，唉！又变成女性化的歇斯底里的眼泪和号叫，逼得公寓的主人赶紧使出浑身解数的安慰本领。\n\n因为摆在面前的是那套梳子——全套的梳子，包括两鬓用的和脑后用的，是德拉在百老汇的一个橱窗里看了好久、羡慕得要死的梳子。这些美妙的发梳，纯玳瑁做的，边上镶着珠宝——颜色正好同她那已经失去的美丽头发相配。她知道这套梳子价钱昂贵，她的心向往已久，渴望得到，但从不敢存有奢望。如今，这套梳子居然属于她了，可惜那有资格佩戴这垂涎已久的装饰品的美丽长发却没有了。\n\n但她还是把梳子紧紧抱在怀里，过了好久，她才能抬起泪眼，带着笑容说：\"我的头发长得快，吉姆！\"\n\n接着德拉像一只被烫着的小猫似的跳起来，叫道：\"噢，噢！\"\n\n吉姆还没有看到他那美丽的礼物。她急切地把礼物摊在手掌上，伸到他面前。那黯淡无光的贵重金属仿佛闪烁着，反映出她那明朗而热烈的心情。\n\n\"漂亮吗，吉姆？我找遍了全城才找到的。现在你每天要看上一百次时间了。把你的表给我，我要看看配上表链是什么样子。\"\n\n吉姆不但没有照办，反而倒在沙发上，把两手枕在头下，笑了。\n\n\"德拉，\"他说，\"让我们把圣诞节的礼物放在一边，保存一会儿。它们太好看了，我舍不得现在就用。我卖掉了金表，给你买了梳子。现在，你把肉排放在火上煎吧。\"\n\n麦琪是聪明人，聪明绝顶的人，由于他们是聪明人，毫无疑问，他们的礼物也是聪明的礼物。在这里，我已经笨拙地向你们讲述了一个没有曲折、不足为奇的故事：两个傻孩子住在公寓里，极不明智地为了对方而牺牲了他们家中最大的财富。可是，让我们对现今的聪明人说最后一句话，在一切馈赠礼品的人当中，那两个人是最聪明的。在一切馈赠又接收礼品的人当中，像他们两个这样的人也是最聪明的。无论在任何地方，他们都是最聪明的人。他们就是麦琪。\n\n——欧·亨利《麦琪的礼物》（节选），王永年 译，人民文学出版社《欧·亨利短篇小说选》", "cardImg": "night_2026-10-18.jpg"}, {"date": "2026-10-19", "type": "晨读", "title": "不要绝望于真主的慈恩", "card": "morning_2026-10-19.png", "text": "一句话：\n\"怜悯他人者必得至仁主的怜悯，你们当怜悯地面上的生物，那么天上的主必怜悯你们。\"\n——圣训，《提尔米兹圣训集》第1924段（阿卜杜拉·本·阿慕尔传述；中文译文逐字取自圣训翻译百科全书 hadeethenc.com，该页未署个人译者名）\n\n一段话：\n我们常常把祈祷变成例行公事，匆匆念完，心却不在。可想一想：当你有求于父母、上司，或某个能左右结果的人，你会字斟句酌，挑好时机地点，恭敬恳切，不敢怠慢。那么面对你的主——那位永不疲倦、不被情绪与时间限制的至仁至慈者，你又该如何准备这场谈话？先知教导我们：祈祷贵在真诚，只向真主祈求；贵在耐心专注，不因一时未见应答就急躁；也要在小净、朝向、举手这些外在礼节里表达敬畏。你每一次真诚的呼唤，祂都不会让你空手而归。\n（据 Yaqeen Institute Roohi Tahir《How to Make Dua》一文要点精炼）\n\n一篇文章：\n今天的主读是 Yaqeen 研究所 Roohi Tahir 今年三月发表的短文《How to Make Dua: The Etiquette of Calling upon Allah》（如何祈祷：呼求真主的礼节）。文章开篇点出一个现代病：在分心成瘾的时代，我们的祈祷常常沦为打卡式的机械动作，心不在焉，还没见效就先放弃。可吊诡的是，面对世间的权威，我们反而懂得精心准备措辞、挑选时机、恭敬恳求；面对永不疲倦的真主，我们理应更用心。\n\n作者整理了先知传授的六条祈祷礼节：一，真诚，只向真主祈求，这是藏于内心、唯真主可见的功修维度，要在每件善功里用心涵养；二，耐心专注，不可急躁，把祈祷当作与深爱敬重者的专注交谈；三，注重外在状态：小净、朝向天房、举起双手、出声念出，以示敬畏；四，赞美真主并祝福先知，只求合法之事——穆斯林的祈祷要么即刻实现，要么被积攒于后世，要么被用来挡开同等的灾祸，而真主的给养远比我们所求的更多；五，抓住蒙应答的尊贵时刻：夜的后三分之一、主麻日、宣礼之后、叩头中、阿拉法日、斋戒时等等，尤其被压迫者的祈祷与真主之间毫无遮蔽；六，向众先知学习：阿丹的忏悔、努哈的坚忍、尤努斯在重重黑暗中的呼求、宰凯里雅的低语、易卜拉欣的顺从远见。\n\n结尾处作者写道：祈祷是我们与真主关系的活的表达，是我们对祂的认知、对祂智慧的托靠、对祂慈恩的确信。每一次呼求，都在打磨我们的心，校准人生的方向，把一切事务托付给那位永远在听、永远临近、永远全能的主。\n\n原文链接：https://yaqeeninstitute.org/read/blog/how-to-make-dua-the-etiquette-of-calling-upon-allah\n原作者：Roohi Tahir（Yaqeen Institute）", "cardImg": "morning_2026-10-19.jpg"}, {"date": "2026-10-19", "type": "30u30", "title": "30u30 第3天｜Recurrent Neural Network Regularization", "card": "", "text": "30u30 第3天｜Recurrent Neural Network Regularization（循环神经网络正则化）\n作者：Wojciech Zaremba、Ilya Sutskever、Oriol Vinyals，2014年\n\n一句话：这篇论文只干了一件事——找到给 LSTM 用 dropout 的正确姿势：只在层与层之间的\"纵向\"连接上用，时间轴上的\"横向\"记忆连接一个都别碰。\n\n核心思想：\n先说 dropout 是什么。训练神经网络时，dropout 会随机\"掐掉\"一部分神经元，逼网络不许依赖某几个神经元，练出更抗造的本事——有点像考试前故意遮住课本里几个关键词背书，逼自己真正理解而不是死记硬背。这招在前馈网络里大获成功，但搬到 RNN 上就翻车了，甚至有人发论文说 dropout 对循环网络根本没用。\n\n为什么翻车？LSTM 里信息走两个方向：纵向（层与层之间往上走），和横向（沿着时间一步步往前走，就是昨天说的\"记忆传送带\"）。如果你连横向也掐，等于每一步都在记忆传送带上随机戳洞——35步下来，记忆被戳了35次，LSTM 还记得住长距离的东西才怪。论文原话就是这个意思：标准 dropout 扰动了循环连接，让 LSTM 很难学会长期保存信息。\n\n生活里打个比方：小组玩\"传话记数字\"，规则是每个人复述前面所有人报过的数字。如果你每次传递时都随机涂掉几个数字（横向捣乱），最后没人记得完整串；但如果你只在\"交卷抄写\"环节偶尔涂掉几个（纵向），传送链本身干干净净，大家照样记得住，还练出了\"缺几个数字也能推出来\"的本事——这就是正则化想要的效果。\n\n论文的改动其实就一行：在 LSTM 门计算公式里，给纵向输入套上 dropout 算子 D()，横向的原样不动。输入词向量和顶层输出到 softmax 之前也加 dropout。更妙的是一个叫 L+1 的性质：一条信息从最底层走到输出，不管它在时间上存了多少步，总共只会遇到 L+1 次 dropout（L层加一次输出）。捣乱程度不随序列长度增长——序列再长也不怕，这就是它成功的关键。\n\n为什么重要：\n（1）它推翻了\"dropout 对 RNN 无效\"的结论，证明不是方法不行，是之前用错了位置。\n（2）数字非常硬：在 Penn Treebank 语言建模上，困惑度从114.5（不用正则）降到78.4（大模型加 dropout），把当时最好的107.5甩开将近30分。\n（3）它最早证明了\"正则化解锁规模\"：不用 dropout 时模型越大越过拟合、效果越差；用了之后，越大越好。规模和正则化要配着用，这条规律后来被反复验证。\n\n和现代 AI 的关系：\n（1）今天训练大模型，dropout 无处不在——Transformer 的注意力层和前馈层后面都接着 dropout，思想源头就是这篇。它是把 dropout 引入序列模型的开山之作。\n（2）2016年的变分 dropout（同一张 mask 在所有时间步复用，效果更好）就是站在它肩膀上继续改进的。\n（3）ChatGPT 这类大模型训练时，靠的正是\"大模型 + 强正则化\"的组合拳，这篇2014年的论文是最早的实证之一。\n\n代码/实现要点（仓库 implementation.py，纯 NumPy）：\n（1）dropout_forward：训练时按 keep_prob 随机生成二值 mask，输出除以 keep_prob 做放缩（叫 inverted dropout，这样推理时不用改代码）；测试时直接原样返回，绝不加 dropout。\n（2）RegularizedLSTM 类：单层 LSTM，dropout 只加在输入嵌入和输出层——正好对应论文\"纵向加、横向不加\"的原则。\n（3）仓库还额外实现了三样论文里没有、但实践中常和 dropout 搭着用的东西：层归一化、L2权重衰减、早停（验证集损失不降就停），代码里都标明了是\"我们的补充\"。\n（4）练习1就是手写 dropout 的前向和反向传播，练完这篇论文的核心就真正懂了。\n\n原论文：https://arxiv.org/abs/1409.2329\n30u30 当天页面：https://github.com/Ojhaharsh/30u30/tree/main/papers/03_RNN_Regularization", "cardImg": ""}, {"date": "2026-10-19", "type": "午读", "title": "How to See the Prophet ﷺ in a Dream（第5集）", "card": "noon_2026-10-19.png", "text": "标题：Ep.5《How to See the Prophet ﷺ in a Dream》（如何在梦中见到先知 ﷺ）\n讲者：Dr. Omar Suleiman（奥马尔·苏莱曼博士）\n视频：https://www.youtube.com/watch?v=QFrMbpwgjMw\nYaqeen 页面：https://yaqeeninstitute.org/watch/series/the-other-side-barzakh-and-beyond/how-to-see-the-prophet-in-a-dream-the-other-side\n\n精华一句：\n凡是向我致以祝安的人，安拉都会将我的灵魂归还于我，使我能够回应他的祝安。——圣训 · 《艾布·达乌德圣训集》2041（圣训翻译百科全书 hadeethenc.com/zh 官方中文版）\n\n凝练一段：\n梦见先知，是白天追随他的回声。想成为有幸在梦中见到他的人，路不在玄妙的技巧里，而在每天的功修里：多为他送祝福——每一次祝安，他都在另一端回应你；多敬畏、多行善，活得像他。梦中见他即是真见，因为那形象无人能假冒；但虔诚的标尺不在梦里，而在你醒着的每一步。今晚，就为他送上祝福吧——也许今夜，他就会来看你。\n\n完整全文翻译：\n今晚，你就能在梦中见到先知（愿主福安之）——只要你今天活得像他一样。那会是什么感觉？感受到他的温暖？感受到他的临在？看到他的微笑？那些追随先知足迹而去的、你所爱的人们，此刻是否正坐在他的身边？他们会不会正在等你——等你在今世彻底扭转人生，好让你们在那边重聚？\n\n你听说过那位加沙妇女的故事吗？她在大屠杀发生之前，就梦见了这场屠杀。就在毁灭的画面开始在各个群组里流传之前不久，她的这个梦已经在无数群组中传开了。她在梦中说：我看见先知（愿主福安之）坐在阿克萨清真寺的庭院里，来自世界各地的人们正向他聚拢而来。但他们不是普通人——他们是受压迫的穆斯林。她说：我看见了来自叙利亚的穆斯林，来自也门的穆斯林，来自伊拉克的穆斯林，来自维吾尔、克什米尔和索马里的穆斯林，他们全都来到先知（愿主福安之）身边，聚集在他周围。聚拢的人越来越多，先知（愿主福安之）看着他们，微笑着说：لَتَدْخُلُنَّ الْجَنَّةَ زُمَرًا——\"你们必将成群结队地进入乐园。\"\n\n然后他对他们说：نَصْرُ اللَّهِ آتٍ فَأَبْشِرُوا——\"真主的援助即将到来，你们当报喜。\"\n\n这时，有人对先知（愿主福安之）说：يَا رَسُولَ اللَّهِ وَمَتَى هَذَا الْفَوْزُ——\"真主的使者啊，这胜利何时到来？\"先知（愿主福安之）回答说：شَهَادَةٌ——\"殉道，才是真正的胜利。\"接着，先知（愿主福安之）开始给他们讲他自己和圣门弟子们在麦加的艰难岁月。他细数那些日子：他们遭受折磨的日子，被驱逐的日子，迁徙的日子——愿主福安之——以及先知（愿主福安之）和他的同伴们经历过的所有艰难时刻，仿佛在说：我们也曾走过。正当他讲着，一支庞大的军队出现了。她说，他们身躯魁伟，人数众多，多到数也数不清。她说，他们的面庞皎洁如满月。先知（愿主福安之）指向这支军队说：سَتُنْصَرُونَ بِهَذَا الْجَيْشِ——\"你们将借这支军队获得胜利，你们将借这支军队获得胜利。\"然后他指向他们——愿主福安之——他们便开始替穆斯林作战，直到胜利。她说，在梦的最后，我看着他说：أَنْتَ رَسُولُ اللَّهِ——\"你真的是真主的使者吗？\"先知（愿主福安之）说：أَنَا نَبِيُّكُمْ مُحَمَّدٌ——\"我是你们的先知穆罕默德——愿主福安之。我是你们的先知穆罕默德——愿主福安之。\"这些梦见先知（愿主福安之）的梦，一代又一代地支撑着这位先知的稳麦走下去，有时，也支撑着一个个具体的个人。\n\n艾奈斯·本·马立克（愿主喜悦他）说：我在麦地那服侍了先知（愿主福安之）十年，我从未见过比他更俊美、更有吉庆的人。他是万物中最优秀的，品性最高尚的。但在今世与他相伴、服侍了他十年之后，艾奈斯在先知（愿主福安之）归真后又活了九十年。你能想象他有多思念他吗？他有多渴望再次与他相聚？穆桑纳·本·赛义德传述：我听见艾奈斯（愿主喜悦他）说：والله ما من ليلة إلا وأنا أرى فيها حبيبي ﷺ——\"以真主发誓，没有一夜，我不在其中见到我的挚爱——愿主福安之。\"艾奈斯（愿主喜悦他）说这话时，常常泪流满面。\n\n就这样，他在这里服侍了他十年，又在梦中见了他九十年，凭真主——赞美他，至高无上的他——的意欲，他如今已与他相聚。每当说起这话，他便开始哭泣（愿主喜悦他）。当他活到一百多岁、终于归真时，他嘱咐人们把他从先知（愿主福安之）那里留下的所有遗物与他一同安葬，包括先知的头发和他的手杖。想象一下吧：在梦中思念了先知（愿主福安之）九十年之后，他们在拜宰赫的重逢该是何等景象。但关键在于：你不必曾与先知（愿主福安之）生活在一起，也能与他相连。怎样才能成为有幸在梦中见到他的人呢？先从最基本的说起。每当你为他（愿主福安之）送上一次祝福，先知（愿主福安之）说：«مَا مِنْ أَحَدٍ يُسَلِّمُ عَلَيَّ إِلاَّ رَدَّ اللَّهُ عَلَيَّ رُوحِي حَتَّى أَرُدَّ عَلَيْهِ السَّلاَمَ»——\"凡是向我致以祝安的人，安拉都会将我的灵魂归还于我，使我能够回应他的祝安。\"（《艾布·达乌德圣训集》2041，艾布·胡莱赖传述；中文为圣训翻译百科全书 hadeethenc.com/zh 官方中文版）\n\n在另一段传述中，先知（愿主福安之）说：你们最尊贵的日子中有主麻日，所以在这一天要多为我向真主祈求祝福，因为你们的祝福会被呈献给我。（阿拉伯原文：«إِنَّ مِنْ أَفْضَلِ أَيَّامِكُمْ يَوْمَ الْجُمُعَةِ... فَإِنَّ صَلاَتَكُمْ مَعْرُوضَةٌ عَلَيَّ»；《艾布·达乌德圣训集》1047，欧斯·本·欧斯传述）有人问：真主的使者啊，当你的身体已经腐朽、与尘土混合之后，我们的祝福又怎会被呈献给你呢？他说：«إِنَّ اللَّهَ عَزَّ وَجَلَّ حَرَّمَ عَلَى الأَرْضِ أَجْسَادَ الأَنْبِيَاءِ»——\"真主——尊贵威严的他——禁止大地吞噬众先知的身体。\"（本段圣训暂无可核对的权威中文译文，此处中文为讲稿英文的忠实翻译，非圣训正文式引译。）所以，如果你此刻向他致安，他的灵魂此刻正在完好如初的身体里回应你，就像当年圣门弟子们在麦地那与他交往时一样。先知（愿主福安之）还对穆阿兹（愿主喜悦他）说：«إِنَّ أَوْلَى النَّاسِ بِي الْمُتَّقُونَ، مَنْ كَانُوا حَيْثُ كَانُوا»——离我最近的人，是最敬畏的人，无论他们是谁，无论他们身在何处。（《伊本·希班圣训集》647；暂无可核对的权威中文译文，此处中文为讲稿英文的忠实翻译。）重要的是要记住：虔诚的门槛，不是在梦中见到先知（愿主福安之），而是在日常生活中追随他。顺带一提，历史上最虔诚的一些人，一生从未在梦中见过先知（愿主福安之）；而有时，不那么虔诚的人却偏偏见到了他。但也许，那就是真主为那个人开的一剂药，引他迈出走向真主——尊贵威严的他——的下一步。\n\n无论如何，这无疑是一份厚重的恩典——因为谁见到了他（愿主福安之），谁就真正见到了他。先知（愿主福安之）说：«وَمَنْ رَآنِي فِي الْمَنَامِ فَقَدْ رَآنِي، فَإِنَّ الشَّيْطَانَ لاَ يَتَمَثَّلُ فِي صُورَتِي»——谁在梦中见我，谁就真正见了我，因为恶魔无法化作我的形象。（《布哈里圣训实录》110，艾布·胡莱赖传述；讲稿所引为该段圣训的中间节选；暂无可核对的权威中文译文，此处中文为讲稿英文的忠实翻译，按硬规则未列入卡片与精华一句。）这里有两点极其重要：第一，恶魔无法假冒他；第二，必须是他的真实形象，才算真正见到了他。而你见到先知（愿主福安之）的样子，也可能在向你传递不同的信息。伊玛目伊本·哈杰尔（愿主慈悯他）从艾布·杰姆拉那里传述：他说，如果你梦见先知（愿主福安之）容光焕发，那是做梦者宗教虔诚的好征兆；但如果先知（愿主福安之）身上有伤口或伤痕，那其实是做梦者自身宗教有缺欠的征兆。有一个人来找伊本·西林（愿主慈悯他）说：我梦见自己亲手埋葬了先知（愿主福安之）。伊本·西林（愿主慈悯他）把这解为：这个人陷入了异端创新——等于在埋葬圣行。另一方面，许多学者梦见自己在掘开先知（愿主福安之）的坟墓。其中就有伊玛目艾布·哈尼法（愿主慈悯他），他说：我做了一个梦，梦见自己在掘开先知（愿主福安之）的坟墓，然后开始整理他的骸骨。后来这被解为：他将整理先知（愿主福安之）的传述。所以，这其实是个好梦。\n\n努尔丁·赞吉（愿主慈悯他）——萨拉丁（愿主慈悯他）的前任——他做了一个梦见先知（愿主福安之）的梦。梦中先知（愿主福安之）面带忧色，指着两个人对努尔丁说：救我脱离这两条狗。努尔丁立刻派了两名士兵去麦地那，说：去找这两个人。他把两人的长相描述得一清二楚，士兵们果然找到了两个乔装的十字军——长相与先知（愿主福安之）在梦中描述的一模一样——他们正在地下挖掘，企图潜入先知（愿主福安之）的陵墓。伊玛目布哈里（愿主慈悯他）梦见自己在为使者（愿主福安之）驱赶苍蝇，后来这被解为：他将清除那些假冒先知（愿主福安之）之名的伪造圣训。当伊玛目艾哈迈德（愿主慈悯他）遭受酷刑时，他常梦见先知（愿主福安之）对他说：艾哈迈德啊，忍耐吧。他身边的人也常做关于他与先知（愿主福安之）同在的梦。伊玛目沙斐仪（愿主慈悯他）说：我梦见先知（愿主福安之）对我说：伊德里斯之子啊——伊本·伊德里斯啊——给这个年轻人艾哈迈德报喜吧，他很快将在真主的宗教上受到考验。他将被要求说出不该说的话。当他拒绝说出他们要他说的话时，他必将遭受鞭打。但真主必将为他传播一种知识，这种知识直到复生日都不会消失。\n\n另一位老人说：我昨天在梦中见到了先知（愿主福安之）、艾布·伯克尔和欧麦尔，他们正走过巴格达的一条运河，使者（愿主福安之）的斗篷从右肩滑落。这时，你——艾哈迈德啊——冲上前去，捡起那件斗篷，重新披回使者（愿主福安之）的肩上。于是先知（愿主福安之）转身看向你，艾布·伯克尔和欧麦尔也转身看向你，对你说：报喜吧，你明日将在乐园中与我们为伴。老人接着对艾哈迈德身边的人说：艾哈迈德披回使者（愿主福安之）肩上的那件斗篷，就是他的圣行（愿主福安之）——艾哈迈德将把圣行带回人们中间。赞美真主！先知（愿主福安之）在梦中探望你，往往就像他在今世探望你一样：他在肯定你的正道，指引你走向更好的路，或在艰难中安慰你。这直到今天仍在发生。阿菲娅·西迪基博士——可能是这个星球上受冤屈最深的女性——她提到，她梦见先知（愿主福安之）在安慰她、抚平她的痛苦，而稳麦已经把她遗忘了。还有许许多多的人，在最艰难的时刻，被赐予了这份最珍贵的礼物——一个梦。\n\n最美的梦之一，属于谢赫基什克（愿主慈悯他）。1996年12月6日，一个主麻日的清晨，他醒来后转头问儿子：先知（愿主福安之）归真时多少岁？儿子说：63岁，这你知道的。谢赫基什克（愿主慈悯他）说：一切赞颂归于真主，我也63岁了。他说：昨晚我梦见了先知（愿主福安之）、艾布·伯克尔和欧麦尔。顺带一提，他们三人归真时都是63岁。先知（愿主福安之）看着我说：向欧麦尔致安——代我向欧麦尔问安。他说：我便向欧麦尔致了安，然后我就死了。接着他说：我在这梦里又看到自己，像拉远了镜头一样——我的身体正由先知（愿主福安之）、艾布·伯克尔和欧麦尔为我洗礼。赞美真主！就在同一天，谢赫基什克（愿主福安之）在主麻日的叩头中归真了——正如他生前一直向真主祈求的那样。但那是在他用一生热爱先知（愿主福安之）、竭力把他的光延续到大地上之后。这就是关键。\n\n说到底，正如伊本·盖伊姆（愿主慈悯他）所说：这份爱，在今世确立，然后在拜宰赫确立，再到报应的家园——后世确立。人将与他所爱的人在一起，在所有这些居所里。所以，努力吧，努力吧，努力吧。如果你今世无缘得见他，真主意欲，你将在拜宰赫得他亲迎，在乐园中永远与他为伴。\n\n即使你觉得自己不配——在灵魂得以沐浴先知临在的那一刻到来之前——你可曾敢梦想，去见一见那位他与你共同崇拜的主宰？因为，如果你能在梦中见到真主最优秀的造化，那么，亲见真主本身呢？\n\n绝不然！这只是他说的一句话，在他们身后，有一道屏障，直到他们复活之日。（《古兰经》23:100 后半段）\n\n（讲者最后说：Al-Fatiha——请大家诵念开端章。）\n\n引文核对说明：转录来源为 Yaqeen 官网官方 WP 接口（https://cdn.yaqeeninstitute.org/wp-json/wp/v2/posts/33118，acf.transcript_content，WEBVTT 全文，AI 生成，时长 13:02）+ 该集页面 References 脚注核对引文。圣训阿拉伯原文经 sunnah.com 逐字核对。圣训中文仅艾布·达乌德 2041 采用圣训翻译百科全书（hadeethenc.com/zh）官方中文版；其余三条暂无可核对的权威中文译文，正文为讲稿英文的忠实翻译并已标注。古兰经 23:100 阿拉伯原文取自 api.quran.com text_uthmani，讲者仅引用后半段。", "cardImg": "noon_2026-10-19.jpg"}, {"date": "2026-10-19", "type": "夜读", "title": "秋天的怀念", "card": "night_2026-10-19.png", "text": "夜读 · 史铁生《秋天的怀念》\n\n双腿瘫痪以后，我的脾气变得暴躁无常，望着天上北归的雁阵，我会突然把面前的玻璃砸碎；听着录音机里甜美的歌声，我会猛地把手边的东西摔向四周的墙壁。母亲这时就悄悄地躲出去，在我看不见的地方偷偷地听着我的动静。当一切恢复沉寂，她又悄悄地进来，眼圈红红的，看着我。\"听说北海的花儿都开了，我推着你去走走。\"她总是这么说。母亲喜欢花，可自从我瘫痪以后，她侍弄的那些花都死了。\"不，我不去！\"我狠命地捶打这两条可恨的腿，喊着，\"我活着有什么意思！\"母亲扑过来抓住我的手，忍住哭，说：\"咱娘儿俩在一块儿，好好儿活……\"\n\n可我一直都不知道，她的病已经到了那步田地。后来妹妹告诉我，母亲常常肝疼得整宿整宿翻来覆去睡不了觉。\n\n那天我又独自坐在屋里，看着窗外的树叶\"刷刷拉拉\"地飘落。母亲进来了，挡在窗前，\"北海的菊花开了，我推着你去看看吧。\"她憔悴的脸上现出央求的神色。\"什么时候？\"\"你要是愿意，就明天？\"她说。我的回答已经让她喜出望外了。\"好吧，就明天。\"我说。她高兴得一会儿坐下，一会儿站起。\"那就赶紧准备准备。\"\"哎呀，烦不烦！几步路，有什么好准备的！\"她也笑了，坐在我身边，絮絮叨叨地说着：\"看完菊花，咱们就去'仿膳'，你小时候最爱吃那儿的豌豆黄儿。还记得那回我带你去北海吗？你偏说那杨树花是毛毛虫，跑着一脚踩扁一个……\"她忽然不说了。对于\"跑\"和\"踩\"一类的字眼儿，她比我还敏感。她又悄悄地出去了。\n\n她出去后，就再也没回来。邻居们把她抬上车时，她还在大口大口地吐着鲜血。我没想到她已经病成那样。看着三轮车远去，也绝没有想到竟是永远永远的诀别。\n\n邻居的小伙子背着我去看她的时候，她正艰难地呼吸着。别人告诉我，她昏迷前的最后一句话是：\"我那个有病的儿子和我那个未成年的女儿……\"\n\n又是秋天，妹妹推我去北海看了菊花。黄色的花淡雅，白色的花高洁，紫红色的花热烈而深沉，泼泼洒洒，秋风中正开得烂漫。我懂得母亲没有说完的话。妹妹也懂。我俩在一块儿，要好好儿活……\n\n——史铁生《秋天的怀念》（1981年作；统编版语文七年级上册第5课课文，人民教育出版社）", "cardImg": "night_2026-10-19.jpg"}, {"date": "2026-10-20", "type": "晨读", "title": "起不来晨礼？试试这个办法", "card": "morning_2026-10-20.png", "text": "一句话：\n\"凡培养自己的性灵者，必定成功；凡戕害自己的性灵者，必定失败。\"\n——《古兰经》91:9-10 · 马坚译\n\n一段话：\n天地的创造，昼夜的轮流，在有理智的人看来，此中确有许多迹象。他们站着，坐着，躺着记念真主，并思维天地的创造，（他们说）：我们的主啊！你没有徒然地创造这个世界。我们赞颂你超绝万物，求你保护我们，免受火狱的刑罚。\n——《古兰经》3:190-191 · 马坚译\n\n一篇文章：\n今天的文章来自澳大利亚谢赫 Belal Assaad 的官方 YouTube 频道，题目很实在：《如果你总在晨礼时起不来，不妨试试这个办法》。\n\n谢赫先讲了一位兄弟的真实经历。这位兄弟常年苦恼自己起不来做晨礼，后来想出一个\"狠招\"：他把手机闹铃录成了自己的声音。闹钟一响，响起的不是音乐，而是他自己一遍遍的喊话：\"起来！想象你此刻就躺在坟墓里，你拿什么去见真主？别浪费时间了，起来，你这个懒人！\"语气又急又不留情面，他每次都被自己的声音\"骂\"醒，不出十秒就彻底清醒了。\n\n谢赫由此点出关键：与自己的私欲角力，本身就是信仰的样子。很多人以为，礼拜时若心里不情愿、提不起劲，这拜功就不算数了——恰恰相反。他说，你的里面仿佛住着两个人：一个想赖在床上，一个把你往床下拽。它们每一次交锋，你都在做选择：往哪个方向走？\n\n晨起的那一刻，就是一天中第一次角力。挣扎本身不是软弱的证据，而是被引导的起点。正如真主所说：\"为我而奋斗的人，我必定指引他们我的道路。\"（《古兰经》29:69，马坚译）\n\n原作者：Belal Assaad（澳大利亚谢赫）\n原文链接：https://www.youtube.com/watch?v=t06FbNpz9xo", "cardImg": "morning_2026-10-20.jpg"}, {"date": "2026-10-20", "type": "30u30", "title": "30u30 第4天｜Keeping Neural Networks Simple by Minimizing the Description Length of the Weights", "card": "", "text": "30u30 第4天｜Keeping Neural Networks Simple by Minimizing the Description Length of the Weights（把神经网络变简单：最小化权重的描述长度）\n作者：Geoffrey Hinton、Drew van Camp，1993 年，发表于 COLT 1993（计算学习理论年会）。Hinton 就是后来拿诺贝尔物理学奖的那位。\n\n一句话：这篇只有 6 页的纯理论论文证明了\"最小描述长度\"和\"变分贝叶斯\"其实是同一回事——把每个权重从固定数值变成一个带噪声的分布，让网络被迫变简单、泛化更好。这是贝叶斯深度学习的奠基性工作之一。\n\n核心思想，换个生活里的比方讲：\n想象你要把训练好的网络\"寄\"给朋友，权重是信里的清单。普通网络每个权重记成 5.123456 这种精确小数，相当于每张清单都要写满九位数字，又费纸又啰嗦。Hinton 说：别记精确数了，记成\"大概是 5.1，前后浮动 0.2\"就行——也就是权重不再是一个数，而是一个分布。如果你抖一下这个权重（加一点噪声）网络照样工作，说明你根本不需要那九位小数，省下来的精度就等于省下来的信纸。而\"比特归还（bits back）\"是论文最妙的一笔：如果收发两方共用随机数发生器，采样用的随机性本身能传递信息，抵消掉一部分描述成本。算到最后，每个权重的描述成本恰好等于 KL 散度：KL(q||p)。于是训练目标变成：数据误差 + 权重复杂度的 tug-of-war，复杂就得多付 KL 的账。\n\n为什么重要：第一，它把信息论的\"最小描述长度\"和贝叶斯统计的\"变分推断\"焊在了一起，这个等式 KL + 误差 后来成了整个贝叶斯深度学习的训练范式。第二，它最早讲清了\"平坦最小值\"的道理：权重自带噪声，网络就不能站在损失曲面又窄又尖的山顶上——稍微一抖误差就爆炸；只能退到宽阔平坦的山谷里，训练和测试之间的小扰动才翻不起浪。第三，这是 1993 年的事，比 VAE（2014）、Bayes by Backprop（2015）早了二十多年；同期 MacKay（1992）用拉普拉斯近似走了另一条路，一起奠定了贝叶斯深度学习的地基。论文只有一个小回归玩具实验证明想法可行，没有 MNIST、没有 benchmark——它是纲领，不是擂台成绩。\n\n和现代 AI 的关系：今天大模型训练里到处都能看到它的影子。VAE 的 ELBO 目标函数就是论文里这个公式；Dropout 被证明（Gal & Ghahramani 2016）本质上是在做近似变分推断；现代的权重剪枝、模型压缩（比如 LLM 量化）背后都是\"权重能省多少精度\"的 MDL 直觉。至于实用派会说：真正的贝叶斯神经网络因为每个权重存均值和方差两套参数、每次前向传播都不一样，太慢了——所以 30u30 的实现用重参数化 trick（Kingma 2014 的方法，不是论文里的）才让它能实际训练。\n\n代码/实现要点（仓库 implementation.py，纯 NumPy）：\n1. BayesianLinear 层：每个权重存两套参数——均值 mu 和 rho（sigma = softplus(rho)，保证标准差为正），初始化 rho = -3，开始时权重只带一点点不确定性。\n2. 每次 forward 都重新采样：w = mu + sigma * epsilon，epsilon 是标准正态噪声。所以同一个输入跑两次结果不一样，这就是不确定性本身。\n3. 损失 = MSE + beta * KL，KL 有闭式公式 0.5*sum(sigma^2 + mu^2 - 1 - log(sigma^2))。beta 最关键（0.001 到 1.0）：太大模型直接躺平预测直线，太小又退化成普通网络、不确定性消失。\n4. 预测时跑 100 次取均值和标准差：在有数据的地方预测紧、在缺数据的地方发散——仓库的缺口正弦波实验把这个可视化得很好，标准网络在没见过的数据上敢自信地胡说，贝叶斯网络会诚实地说\"我不知道\"。\n\n原论文：https://www.cs.toronto.edu/~hinton/absps/colt93.pdf\n30u30 当天页面：https://github.com/Ojhaharsh/30u30/tree/main/papers/04_Minimizing_Description_Length", "cardImg": ""}, {"date": "2026-10-20", "type": "午读", "title": "Is Allah Speaking to You?（第6集）", "card": "noon_2026-10-20.png", "text": "标题：Ep.6《Is Allah Speaking to You?》（真主在对你说话吗？）\n讲者：Dr. Omar Suleiman（奥马尔·苏莱曼博士）\n视频：https://www.youtube.com/watch?v=fRVNp0AYoPA\nYaqeen 页面：https://yaqeeninstitute.org/watch/series/the-other-side-barzakh-and-beyond/can-you-see-allah-in-a-dream-the-other-side\n\n精华一句：\n每当你诵读《古兰经》，他就在对你说话；每当你礼拜，他就在回应你。\n\n凝练一段：\n你不必见到真主，就能和他说话：每天的拜功里，你诵念开端章，他逐句回应你；每一次诵读《古兰经》，都是他在对你说话；每一次祈祷，都是你在对他说话。有些人谈论真主，却从不和真主说话；有些人知道关于真主的事，却不认识真主。从\"难道我不是你们的主吗\"到坟墓中的\"谁是你的主\"，这一生就是你认识他的时间。今晚带着小净入睡吧——让你的灵魂今夜就在他的宝座前叩头。\n\n完整全文翻译：\n你见过真主吗？如果没有见过，你多久能和他说一次话？\n\n每天，我们睁开眼睛，映入眼帘的是周遭的世界：造化的壮美、我们所爱之人的面庞、那些我们有时遗忘的恩典。视觉是一种强大的感官。人们说，眼见为实，对吧？可你见过真主吗？如果你从未见过他，又该如何亲近他？\n\n艾布·耶济德·比斯塔米说：\"我在梦中见到了我的主。我说：'雅·拉布，凯法·塔里古·伊莱克（Ya Rabb, kaifa tariqo ilayk）？——我的主啊，我如何才能亲近你？'我的主回答说：'乌特鲁克·奈夫塞克·沃·塔阿勒（Utruk nafsak wa ta'al）——抛下你自己，走近些。'\"（伊本·焦兹《纯洁者的特质》）\n\n伊玛目艾哈迈德（愿主慈悯他）也说：\"我在梦中见到了我的主。我说：我的主啊，寻求亲近你的人，该如何亲近你？他回答：'雅·艾哈迈德·比·凯拉米（Ya Ahmad bi kalami）——艾哈迈德啊，凭我的言辞。'\"指的是诵读《古兰经》。\"我说：我的主啊，是带着理解诵读，还是不带理解诵读？\"真主——尊贵威严的他——回答：带着理解或不带理解都行。意思是：《古兰经》是吉庆的，带着经注和理解来诵读当然更好，但仅仅是诵念真主的言辞本身，就是亲近他的最佳方式之一。（伊本·焦兹《忠告集》）\n\n伊本·焦兹（愿主慈悯他）还提到，叶海亚·本·巴卡（愿主慈悯他）在梦中见到了他的主，他说：\"雅·拉布，凯姆·艾德乌凯·沃·拉·图吉布尼（Ya Rabb, kam ad'uuka wa la tujeebunee）？——我的主啊，我向你祈求了多久，你却没有应答我？\"真主回应他说：\"雅·叶海亚，印尼·乌希布·安·艾斯麦阿·扫特克（Ya Yahya inni uhibbu an asma'a sawtak）——叶海亚啊，我喜爱听到你的声音。\"\n\n先知（愿主福安之）说，伊赫桑（ihsan，至善）就是：你以能看见真主的方式崇拜他；如果你看不见他，那就知道他看见你。（《布哈里圣训实录》50；《穆斯林圣训实录》8；阿拉伯原文 «أَنْ تَعْبُدَ اللَّهَ كَأَنَّكَ تَرَاهُ، فَإِنْ لَمْ تَكُنْ تَرَاهُ فَإِنَّهُ يَرَاكَ» 经 sunnah.com 核对；暂无可核对的权威中文译文，此处中文为讲稿英文的忠实翻译。）\n\n可这在实践中到底意味着什么？先知（愿主福安之）在一则传述里做了展开。穆阿兹（愿主喜悦他）说：我去见先知（愿主福安之），说：\"雅·拉苏鲁拉，奥斯尼（Ya Rasulullah, awsini）——真主的使者啊，请给我忠告。\"先知（愿主福安之）说：\"我劝你：以你能看见真主的方式崇拜他，把自己算作已死之人，在每块石头、每棵树旁记念真主。如果你犯了一件罪，就用一件善功来替补它：隐秘的罪用隐秘的善功替补，公开的罪用公开的善功替补。\"（伊本·艾比·谢拜《穆桑纳夫》；伊本·罕百里《苦修书》；暂无可核对的权威中文译文，此处中文为讲稿英文的忠实翻译。）\n\n请你想一想：以能看见真主的方式崇拜他，和把自己算作已死之人，这两者之间有什么关联？其中的智慧之一是：你开始如实地看清现实。而没有什么比真主——赞美他，至高无上的他——本身更真实。\n\n先知（愿主福安之）和先贤们传下过一些梦境，他们在梦中说：我见到了真主。我们知道这些人都是诚实可信的人。据记载，伊玛目艾布·哈尼法（愿主慈悯他）多次有过这样的经历。所以，这是一个确立的现象。但在梦中见到真主是罕见的——是灵魂独一无二的体验，是心的视见，真实却远不及在后世真正亲见真主——那才是我们所有人渴望的真正恩赐。这是真主——赞美他，至高无上的他——赐给少数虔诚先贤的礼物，我们不该对此过度执着。\n\n那为什么还要提起呢？因为如果你留意，就会发现：即使在那为数不多的梦境里，重点依然是——你要通过《古兰经》中他的言辞、通过你祈祷（du'a）中的言辞，与真主相连。这就是关键。你不必在这里见到真主——你每天本来就已经在直接地、多次地与真主打交道。有些人谈论真主，却不和真主——赞美他，至高无上的他——说话；有些人知道关于真主的事，却不认识真主。而懂得灵魂的这种直接交接，足以深刻地改变人生。当然，任何感受到与真主——赞美他，至高无上的他——这种直接联系的人，都会想要更多。\n\n这就是为什么穆萨（愿主赐他平安）想在今世见到他，却未能如愿。但真主以什么尊荣了他？真主仍然尊荣他为凯利穆拉（Kaleemullah）——真主直接与之对话的人。\n\nوَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ——\"如果我的仆人询问我的情状，你就告诉他们：我确是临近的。\"（《古兰经》2:186 前半段）\n\n在你来到这个世界之前，真主曾直接对你说话：أَلَسْتُ بِرَبِّكُمْ——\"难道我不是你们的主吗？\"（《古兰经》7:172 节选）\n\n下一次，你将在坟墓中被问到：من ربك（man rabbuk）——\"谁是你的主？\"在这两个问题之间，你有整整一生的时间去认识他。你准备好回答了吗？\n\n理论上讲，一个信士一生中与真主说话的次数，本该超过与任何人的交谈——光算拜功（salah）就够了。每一次你礼拜、诵念开端章，真主都在直接回应你。就算你一天连一次圣行拜都不做，你每天也至少有十七次与真主直接对话。这还不算拜功中的其他部分，也不算你白天所做的那些祈祷。\n\n拜功是信士的登霄。正如真主带着先知（愿主福安之）的身与魂踏上通往他的旅程、直接为他规定了拜功一样，真主也赐给了你拜功——你的灵魂借此升向他，直接与他对话。先知（愿主福安之）说：仆人离真主最近的时刻，是在叩头（sujood）中。（《穆斯林圣训实录》482；暂无可核对的权威中文译文，此处中文为讲稿英文的忠实翻译。）\n\n我记得曾问过一位刚皈依伊斯兰的兄弟：对你来说，伊斯兰最美的地方是什么？他说：兄弟，真主太容易接近了。我从不知道，能直接和真主说话会是这样一种感觉。\n\n先知（愿主福安之）怎么说？真主说：«إِنَّ اللَّهَ عَزَّ وَجَلَّ يَقُولُ أَنَا مَعَ عَبْدِي إِذَا هُوَ ذَكَرَنِي وَتَحَرَّكَتْ بِي شَفَتَاهُ»——\"真主——尊贵威严的他——说：我与我的仆人在一起，只要他记念我、双唇因诵念我的名号而翕动。\"（《伊本·马哲圣训集》3792，艾布·胡莱赖传述；阿拉伯原文经 sunnah.com 核对；暂无可核对的权威中文译文，此处中文为讲稿英文的忠实翻译。）你记念真主，真主必记念你。\n\n你的灵魂时时刻刻都在渴慕他，即使在你睡着的时候。伊玛目拜哈基（愿主慈悯他）提到一段归于艾布·达尔达（愿主喜悦他）的传述，另有一段几乎一字不差的话归于阿卜杜拉·本·阿慕尔（愿主喜悦他）：信士的灵魂在睡眠时被带到真主的宝座前；如果他是带着塔哈拉（tahara，洁净）的状态入睡的，他的灵魂就被允许向真主叩头。（拜哈基《信仰之枝》）\n\n赞美真主！我们知道圣行是睡前做小净，如果我们这样做，天使们整夜都会为我们祈祷。（《布哈里圣训实录》247；《穆斯林圣训实录》2710）所以，即使在睡梦中，你也被带近了。如果你在睡前做的最后一件事是善功——带着小净入睡——那么你的灵魂将以这种状态度过整夜。\n\n而灵魂渴慕他——赞美他，至高无上的他——的程度，决定了你从进入拜宰赫（barzakh）的那一刻起，多快、多深地与他相遇。\n\n已经有人见到真主了吗？再说一次，没有什么能比得上后世的亲见。贾比尔（愿主喜悦他）传下过一则优美的传述：我父亲在吴侯德殉难后，先知（愿主福安之）来见我，说：\"雅·贾比尔，马·利·阿拉卡·蒙凯西兰（Ya Jabir, ma li araka munkasiran）？——贾比尔啊，我怎么看你愁容满面？\"我说：\"真主的使者啊，我父亲殉难了——他在吴侯德那天阵亡，留下了一大家子要养，还有一身债务。\"先知（愿主福安之）对他说：\"要不要我告诉你一件让你宽心的事？马·凯莱麦拉胡·艾哈丹·盖特·伊拉·敏·沃拉伊·希贾布（Ma kallamAllahu ahadan qat illa min warai hijab）——真主从未对任何人说过话，除非隔着帷幕。沃·凯莱麦拉胡·阿巴克·基法汉（Wa kallamAllahu abaka kifahan）——但真主直接对你父亲说了话。他说：'雅·阿卜迪，塔曼纳·阿莱亚·乌阿提克（Ya abdi tamanna alayya u'teek）——我的仆人啊，向我祈求吧，我必赐给你。'你父亲说：'雅·拉布，图赫伊尼·法·乌格塔鲁·菲克·萨尼延（Ya Rabb, tuhyini fa uqtalu feeka thaniyan）——我的主啊，让我复活吧，好让我再一次为你殉道。'真主说：'印奈胡·萨巴盖·敏尼·安奈胡姆·伊莱哈·拉·亚尔吉乌恩（Innahu sabaqa minni annahum ilayha la yarji'oon）——我已经前定：他们不会再回到那个世界。'你父亲说：'雅·拉布，法·艾布里格·曼·沃拉伊（Ya Rabb, fa abligh man warai）——我的主啊，那就把这个消息传达给我身后的人吧。'\"（《铁密济圣训集》3010；《伊本·马哲圣训集》190；阿拉伯原文经 sunnah.com 核对；暂无可核对的权威中文译文，此处中文为讲稿英文的忠实翻译。）\n\n就在那时，真主——赞美他，至高无上的他——降示了关于烈士的经文：他们是艾哈亚（ahya），是活着的；真主——赞美他，至高无上的他——确在照料他们。（《古兰经》3:169）\n\n想想吧：在经历了那样美妙的一刻之后，他唯一的愿望就是回来，再一次为真主献出生命。想象这份渴望，再想想加沙、也门以及整个穆斯林世界的烈士们——他们如今亲历真主的亲近，不只渴望见到他，更渴望一而再、再而三地为他奋斗、为他牺牲。\n\n还记得伊玛目艾哈迈德（愿主慈悯他）吗？他在受酷刑时，常梦见先知（愿主福安之）。他去世后，他的一位学生说：\"我在梦中见到了伊玛目艾哈迈德，我问他：'雅·阿巴·阿卜杜拉（Ya Aba Abdillah）——阿卜杜拉之父啊，你的主怎样对待你了？'伊玛目艾哈迈德回答：'他饶恕了我。他对我说：雅·艾哈迈德，你为我挨了六十鞭。我说：是的，我的主。他说：现在，我的脸为你显现，你想看多久就看多久。'\"（巴格达迪《巴格达史》）\n\n赞美真主！你看，在看不见他时为真主做出的苦涩牺牲，和在那边见到他时的甘甜之间，有着多么直接的联系。\n\n也许还要过一段时间，你才能直接见到他——赞美他，至高无上的他。我们知道，终极的亲见是为乐园保留的。但在此期间，你能看到他的迹象。当你死去，又一重迹象向你显现，为你揭开你与他之间的又一层面纱。我们死时，信士看到的是慈悯的天使，不信者看到的是惩罚的天使，而烈士从受难的第一击起就直接看到了乐园。\n\n但如果你是信士，那时你将拥有属于你自己的\"夜行登霄\"。正如伊玛目达哈克（愿主慈悯他）所传：当信士仆人的灵魂被取走，它被升上诸天，与真主最亲近者陪伴着它。他们说：\"雅·拉布，阿卜杜凯·富兰（Ya Rabb, abduka fulan）——我的主啊，这是你的仆人某某。\"尽管真主比他们更了解他。然后真主——赞美他，至高无上的他——降下一份封印的证书，保证他免于真主的刑罚。\n\n接着他说，这就是真主这句话的含义：كَلَّا إِنَّ كِتَابَ الْأَبْرَارِ لَفِي عِلِّيِّينَ ۝ وَمَا أَدْرَاكَ مَا عِلِّيُّونَ ۝ كِتَابٌ مَرْقُومٌ ۝ يَشْهَدُهُ الْمُقَرَّبُونَ——\"真的，善人们的记录，确在善行簿中。你怎能知道善行簿是什么？是一本封存的簿子，真主所亲近的天神们将作证它。\"（《古兰经》83:18-21 · 马坚译；阿拉伯原文取自 api.quran.com text_uthmani）\n\n问题是：你现在能透过他的迹象和经文看到真主吗？这对你产生了什么影响？还是说，你要等到宇宙把你吞噬殆尽，等到看清一切时却已无力行动？如果你渴望在那一天亲眼见到他的这份恩赐，你可曾意识到，真主已经在今世给了你直达他的通道？\n\n你要在那边等着见他，还是要在今世磨利你的眼光，继续寻求与他的亲近？لَقَدْ كُنتَ فِي غَفْلَةٍ مِّنْ هَٰذَا فَكَشَفْنَا عَنكَ غِطَاءَكَ فَبَصَرُكَ الْيَوْمَ حَدِيدٌ——\"你确忽视此事，现在我已揭开你的蒙蔽，所以你今日的眼光是锐利的。\"（《古兰经》50:22 · 马坚译；阿拉伯原文取自 api.quran.com text_uthmani）可那时，你已经死了。你，又何曾真正活过？\n\n引文核对说明：转录来源为 Yaqeen 官网官方 WP 接口（https://cdn.yaqeeninstitute.org/wp-json/wp/v2/posts/33176，acf.transcript_content，WEBVTT 全文，AI 生成）+ 该集页面 References 脚注核对引文。古兰经阿拉伯原文取自 api.quran.com text_uthmani，中文为马坚译（2:186、7:172 为讲者引用的节选，已标注；83:18-21、50:22 为完整引用）。圣训阿拉伯原文经 sunnah.com 逐字核对（布哈里 50、伊本·马哲 3792、铁密济 3010）；本集圣训暂无可核对的权威中文译文，正文圣训部分为讲稿英文的忠实翻译并已逐条标注，未列入卡片与精华一句。\n", "cardImg": "noon_2026-10-20.jpg"}, {"date": "2026-10-19", "type": "古兰经学习", "title": "古兰经学习｜开端章 + 黄牛章 1-10", "card": "", "text": "【开端章 Al-Fatiha（1:1-7）】\n1:1\nبِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ\nIn the name of Allāh, the Entirely Merciful, the Especially Merciful.\n奉至仁至慈的真主之名\n1:2\nٱلْحَمْدُ لِلَّه

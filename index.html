e have believed,\" they say, \"Should we believe as the foolish have believed?\" Unquestionably, it is they who are the foolish, but they know [it] not.\n中译（马坚）：有人对他们说：你们应当象众人那样信道。他们就说：我们能象愚人那样轻信吗？真的，他们确是愚人，但他们不知道。\n\n【2:14】\n阿拉伯原文：وَإِذَا لَقُوا۟ ٱلَّذِينَ ءَامَنُوا۟ قَالُوٓا۟ ءَامَنَّا وَإِذَا خَلَوْا۟ إِلَىٰ شَيَـٰطِينِهِمْ قَالُوٓا۟ إِنَّا مَعَكُمْ إِنَّمَا نَحْنُ مُسْتَهْزِءُونَ\n英译（Saheeh International）：And when they meet those who believe, they say, \"We believe\"; but when they are alone with their evil ones, they say, \"Indeed, we are with you; we were only mockers.\"\n中译（马坚）：他们遇见信士们就说：我们已信道了。他们回去见了自己的恶魔，就说：我们确是你们的同党，我们不过是愚弄他们罢了。\n\n【2:15】\n阿拉伯原文：ٱللَّهُ يَسْتَهْزِئُ بِهِمْ وَيَمُدُّهُمْ فِى طُغْيَـٰنِهِمْ يَعْمَهُونَ\n英译（Saheeh International）：[But] Allāh mocks them and prolongs them in their transgression [while] they wander blindly.\n中译（马坚）：真主将用他们的愚弄还报他们，将任随他们彷徨於悖逆之中。\n\n【2:16】\n阿拉伯原文：أُو۟لَـٰٓئِكَ ٱلَّذِينَ ٱشْتَرَوُا۟ ٱلضَّلَـٰلَةَ بِٱلْهُدَىٰ فَمَا رَبِحَت تِّجَـٰرَتُهُمْ وَمَا كَانُوا۟ مُهْتَدِينَ\n英译（Saheeh International）：Those are the ones who have purchased error [in exchange] for guidance, so their transaction has brought no profit, nor were they guided.\n中译（马坚）：这等人，以正道换取迷误，所以他们的交易并未获利，他们不是遵循正道的。\n\n【2:17】\n阿拉伯原文：مَثَلُهُمْ كَمَثَلِ ٱلَّذِى ٱسْتَوْقَدَ نَارًا فَلَمَّآ أَضَآءَتْ مَا حَوْلَهُۥ ذَهَبَ ٱللَّهُ بِنُورِهِمْ وَتَرَكَهُمْ فِى ظُلُمَـٰتٍ لَّا يُبْصِرُونَ\n英译（Saheeh International）：Their example is that of one who kindled a fire, but when it illuminated what was around him, Allāh took away their light and left them in darkness [so] they could not see.\n中译（马坚）：他们譬如燃火的人，当火光照亮了他们的四周的时候，真主把他们的火光拿去，让他们在重重的黑暗中，甚麽也看不见。\n\n【2:18】\n阿拉伯原文：صُمٌّۢ بُكْمٌ عُمْىٌ فَهُمْ لَا يَرْجِعُونَ\n英译（Saheeh International）：Deaf, dumb and blind - so they will not return [to the right path].\n中译（马坚）：（他们）是聋的，是哑的，是瞎的，所以他们执迷不悟。\n\n【2:19】\n阿拉伯原文：أَوْ كَصَيِّبٍ مِّنَ ٱلسَّمَآءِ فِيهِ ظُلُمَـٰتٌ وَرَعْدٌ وَبَرْقٌ يَجْعَلُونَ أَصَـٰبِعَهُمْ فِىٓ ءَاذَانِهِم مِّنَ ٱلصَّوَٰعِقِ حَذَرَ ٱلْمَوْتِ ۚ وَٱللَّهُ مُحِيطٌۢ بِٱلْكَـٰفِرِينَ\n英译（Saheeh International）：Or [it is] like a rainstorm from the sky within which is darkness, thunder and lightning. They put their fingers in their ears against the thunderclaps in dread of death. But Allāh is encompassing of the disbelievers.\n中译（马坚）：或者如遭遇倾盆大雨者，雨里有重重黑暗，又有雷和电，他们恐怕震死，故用手指塞住耳朵，以避疾雷。真主是周知不信道的人们的。\n\n【2:20】\n阿拉伯原文：يَكَادُ ٱلْبَرْقُ يَخْطَفُ أَبْصَـٰرَهُمْ ۖ كُلَّمَآ أَضَآءَ لَهُم مَّشَوْا۟ فِيهِ وَإِذَآ أَظْلَمَ عَلَيْهِمْ قَامُوا۟ ۚ وَلَوْ شَآءَ ٱللَّهُ لَذَهَبَ بِسَمْعِهِمْ وَأَبْصَـٰرِهِمْ ۚ إِنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ\n英译（Saheeh International）：The lightning almost snatches away their sight. Every time it lights [the way] for them, they walk therein; but when darkness comes over them, they stand [still]. And if Allāh had willed, He could have taken away their hearing and their sight. Indeed, Allāh is over all things competent.\n中译（马坚）：电光几乎夺了他们的视觉，每逢电光为他们而照耀的时候，他们在电光中前进；黑暗的时候，他们就站住。假如真主意欲，他必褫夺他们的听觉和视觉。真主对於万事确是全能的。", "cardImg": "", "audio": [{"src": "quran_al-baqarah_11-20.mp3", "label": "黄牛章 11-20"}]}, {"date": "2026-10-20", "type": "夜读", "title": "《给予》（Giving）——泰国 True Move H 公益短片", "card": "night_2026-10-20.png", "text": "夜读 · 真实故事：泰国公益短片《给予》（Giving）\n\n这是2013年泰国电信公司 True Move H 推出的一支三分钟公益短片。没有明星，没有大场面，讲的却是一个关于善意如何流转的故事。它上线后在全球被转发了上千万次，被无数人称为\"史上最催泪的公益广告\"。\n\n清晨的街角，一家药店门口传来呵斥声。一个瘦小的男孩被药店老板揪住衣领，手里攥着几包还没付钱的止痛药。\"小偷！\"老板骂得很凶，街坊们纷纷围了过来。\n\n男孩吓得浑身发抖，眼泪在眼眶里打转。他低声说：\"对不起……这是给我妈妈买的药，她病了，家里没有钱。\"\n\n就在这时，隔壁卖汤面的小店老板走了过来。他没有责怪孩子，也没有说教，只是默默掏出钱，替男孩付了药钱。他又转身对自己的女儿说：\"去，给孩子装一份蔬菜汤，让他带回去给妈妈。\"\n\n女儿装好热腾腾的一袋汤，递到男孩手里。男孩抱着药和汤，一步三回头地消失在街口。\n\n镜头一转，三十年后。\n\n汤面店老板老了，女儿也长大了，父女俩还守着那家小店。老板一辈子都是这样的人：街坊缺米少面，他顺手就帮了；看到挨饿的人经过，他总多盛一勺汤。善良，是他三十年如一日的生活方式。\n\n一天，老板在店里突然倒下，头部重重磕在桌角上，送进医院抢救，昏迷不醒。女儿衣不解带地守在病床前，可巨额的医药费很快压了下来——79万2千泰铢，约合2万多美元。她咬咬牙，准备把经营了半辈子的店铺卖掉，来换父亲活下去的机会。\n\n有一天清晨，她在父亲的病床前醒来，发现枕边放着一张新的费用单。她颤抖着打开，几乎不敢看数字——医药费总计：0泰铢。\n\n单据下方还有一行手写的英文：\n\n\"All expenses paid 30 years ago with three packs of painkillers and a bag of veggie soup.\"\n\n（三包止痛药，一袋蔬菜汤——这笔费用，早在三十年前就已经付清了。）\n\n落款是主治医生的名字。女儿抬头看向病房门口：那位医生，正是三十年前在药店门口偷药的男孩。他长大了，成了这家医院的医生，多年来一直在默默帮助有需要的人。而这一次，他回报的，是当年那份改变了他命运的善意。\n\n影片结尾，只有一句话：\n\nGiving is the best communication.\n给予，是最好的沟通。\n\n三十年前的一份善意，三十年后以另一种方式回来。人性之善，从来都不会真正消失，它只是换了一种样子，继续往前走。那位汤面店老板大概从没想过，自己随手的一次帮助，会在三十年后救了自己一命——善良从不求回报，但它从不会缺席。\n\n愿今晚的你，也被这份善意温暖。\n\n——泰国 True Move H 公益短片《给予》（Giving，2013年，三分钟）；故事梗概按影片内容复述，账单原文为影片画面英文、中文为直译；影片曾获 socialpsychology.org 2013 Day of Compassion 引文收录，mediapost（2013-09-19）、marketing-interactive（2013-09）等多家媒体报道", "cardImg": "night_2026-10-20.jpg"}, {"date": "2026-10-21", "type": "晨读", "title": "心安之处", "card": "morning_2026-10-21.png", "text": "一句话：\n\"他们信道，他们的心境因记忆真主而安静，真的，一切心境因记忆真主而安静。\"\n——《古兰经》13:28 · 马坚译\n\n一段话：\n艾布·穆萨传述：先知（愿主福安之）说：\"记念主宰的人，与不记念主宰的人，就如同活人与死人。\"（《布哈里正确圣训集》6407，布哈里、穆斯林共同辑录）圣训翻译百科全书释义：记念真主之人的心是活的，外在有生命之光，内在有认知的光明充盈，还能把益处带给周围的人；而不记念的人，心如死去，外在空虚无华，内在虚妄空洞，毫无益处可言。记念，是心灵的生命，正如灵魂是身体的生命。\n\n一篇文章：\n今天的文章来自美国伊玛目 Suhaib Webb 的官网，一份《记念与反思指南》（January Dhikr & Reflection Guide）。它的开篇只有一句话：Begin the year gently. Start with remembrance.——温柔地开始，从记念开始。\n\n这份指南的立意很特别：一月不必是压力、决心和\"做更多\"的代名词。它邀请人慢下来，重新连接，以记念真主、端正举意为根基，开启新的一程。指南里没有宏大的计划，只有简单而有意义的日常功课：每天的记念提示、校准举意的简短反思题、温和而不僵硬的节奏，以及留白——停下来、反思、与真主重新连接的空间。\n\n它的设计哲学是\"持续，而非完美\"：这套方法可以配合你已有的生活节奏，无论你是刚刚起步，还是正在重建坚持记念的习惯。它最后写道：This is not about starting fast. It's about starting sincere.——重要的不是起步快，而是起步真诚。\n\n清晨，正是\"温柔开始\"的时刻。新的一天，不必先立下宏大决心；先记念，心就安了。正如今天的经文所说：一切心境因记忆真主而安静。\n\n原作者：Suhaib Webb（美国伊玛目）\n原文链接：https://suhaibwebb.com/january-dhikr", "cardImg": "morning_2026-10-21.jpg"}, {"date": "2026-10-21", "type": "30u30", "title": "30u30 第5天｜A Tutorial Introduction to the Minimum Description Length Principle（最小描述长度原理导引）", "card": "", "text": "30u30 第5天｜A Tutorial Introduction to the Minimum Description Length Principle（最小描述长度原理导引）——Peter Grünwald，2004年\n\n一句话：这是一篇约80页的教程式综述，把\"最小描述长度\"（MDL）这套选模型的思想从头到尾讲了一遍——选模型就是选\"编码方案\"，能把数据压缩得最短的那个模型就是最好的模型。\n\n核心思想：想象你要把一份实验数据发给远方的朋友。有两种寄法：直接把原始数据一个个数抄过去；或者先讲规律，再说例外——比如\"这些点大致沿着一条三次曲线走，只有3个点偏了0.2\"。第二种寄法要付两份\"邮费\"：讲规律的钱（模型描述长度L(H)，参数越多越贵），再加上讲例外的钱（残差描述长度L(D|H)，拟合越差越贵）。太简单的模型，规律没讲清楚，例外一大堆；太复杂的模型，规律讲得比数据还啰嗦——比如100个数据点用99次多项式去拟合，光是写下100多个参数就比直接寄原始数据还贵了。最佳模型是两份邮费加起来最便宜的那个。妙处在于：没有任何人为设置的调参旋钮，平衡点是自动出现的。论文还讲了三个升级版：两步编码（最直白）、预序编码（不讲模型，直接看模型预测新数据的\"惊讶程度\"累计）、NML归一化极大似然（理论上的黄金标准，分母算\"这个模型族能拟合多少种数据\"，越灵活的模型族分摊下来每个数据集分得的概率越低、编码越贵）。\n\n为什么重要：这是奥卡姆剃刀的数学实现。Day4的Hinton & van Camp用MDL的思想去压缩神经网络权重，今天这篇讲的是它底下的数学地基。它还给出了和AIC、BIC两个经典准则的精细对比：AIC惩罚项固定（每个参数2分），数据量大时会系统性选复杂模型；BIC按log n惩罚，在指数族里和MDL很接近；而MDL最灵的一点是惩罚会\"看菜下碟\"——一个几乎为零的参数花的比特数，远少于一个远离零的参数。作者本人也很谨慎：MDL不假设数据真是某个\"真实模型\"生成的，只管压缩；他也提醒，别把\"压缩好\"直接等同于\"真理解\"，模型族选错了，压缩再好也白搭。\n\n和现代AI的关系：这篇论文的例子停留在多项式、马尔可夫模型层面，几乎没碰神经网络（作者明说深学习不是它的地盘），但它的精神活在大模型时代的每个角落：权重衰减、稀疏正则化、剪枝、LoRA、量化压缩，背后都是同一个直觉——用更短的描述学到真正的规律；大模型参数效率的研究（比如Chinchilla的规模律）在追问的也是\"同样的智能最少需要多少参数\"。可以这么说：Day4讲的是把这套思想装进神经网络，今天讲的是这套思想本身的说明书。\n\n代码要点：仓库把理论变成了可跑的实验（纯NumPy+SciPy）：\n1. two_part_mdl_polynomial：两步编码选多项式次数，模型比特数=(次数+1)×32，残差比特数用高斯公式(n/2)·log2(2πeσ²)；\n2. prequential_mdl_polynomial：按顺序逐个预测新点，累计\"-log预测概率\"作为编码长度，连模型描述都不需要写；\n3. nml_complexity_polynomial：按(k/2)·log(n/2π)估算模型族的随机复杂度；\n4. PolynomialMDL类封装了\"拟合—打分—选次数\"完整流程；跑python train_minimal.py，真实次数为3的带噪数据，MDL准确挑出3次，次数再高省下的残差比特抵不过新增参数的代价；\n5. compare_mdl_aic_bic和Monte Carlo蒙特卡洛对比（后者是仓库作者的自加料）把三个准则正面打一架。\n5道练习覆盖三步编码/预序编码/NML/准则对比，答案在solutions.py。\n\n原论文：https://arxiv.org/abs/math/0406077\n当天页面：https://github.com/Ojhaharsh/30u30/tree/main/papers/05_MDL_Principle\n\nMDL的发明者是Rissanen，Grünwald后来还把这篇讲义扩成了MIT出版社的专著《The Minimum Description Length Principle》（2007）。", "cardImg": ""}, {"date": "2026-10-21", "type": "午读", "title": "How Many Lives Do You Really Have?（第7集）", "card": "noon_2026-10-21.png", "text": "标题：Ep.7《How Many Lives Do You Really Have?》（你到底有几条命？）\n讲者：Dr. Omar Suleiman（奥马尔·苏莱曼博士）\n视频：https://www.youtube.com/watch?v=Dh8a8-UOEv0\nYaqeen 页面：https://yaqeeninstitute.org/watch/series/the-other-side-barzakh-and-beyond/how-many-lives-do-you-really-have-the-other-side\n\n精华一句：\n一个人可能活到八十岁才去世，但他的灵魂也许只有八天大——因为每一次挣扎、每一次回归真主，都在剥去旧我的一层外壳。\n\n凝练一段：\n这一集讲\"重生\"。讲者说，身体的死亡只发生一次，心灵却可以死去又重生无数次：伊布利斯因违抗被列入死者，欧麦尔却死而复生、带着光明行走人间。正如真主能使枯死的大地复活，也能让死去的心一次次活过来——小净与拜功、朝觐与迁徙、患难中的感恩，都是灵魂的\"再出生\"。但你要记住：肉体死亡的那一刻，灵魂重生的机会就永远结束了。\n\n完整全文翻译：\n照镜子的时候，你看到的或许是一个活生生的人。但在另一面，你会不会其实只是一具行尸走肉？你是真的活着，还是只是在等你的身体追上那颗已经死去的灵魂？你喂养身体让它活下去，可你是不是一直在让灵魂挨饿、饿到死去？你亲手杀死过自己的心多少次？而你又能让它起死回生多少次？\n\n伊玛目伊本·盖伊姆传述：真主曾启示穆萨（愿主赐他平安）说：\"穆萨啊，在我的造化之中，第一个真正死去的是伊布利斯——因为他违抗了我，而违抗我的人，我都把他算在死者之列。\"（伊本·盖伊姆《疾病与良药》）\n\n而欧麦尔（愿主喜悦他）恰恰相反——他被形容为一个死而复生的人。真主说：\nأَوَمَن كَانَ مَيْتًا فَأَحْيَيْنَاهُ وَجَعَلْنَا لَهُ نُورًا يَمْشِي بِهِ فِي النَّاسِ\n\"一个人，原是死的，但我使他复活，并给他一道光明，带著在人间行走。\"（《古兰经》6:122（节选）· 马坚译）\n\n请你想象一下：如果看到欧麦尔（愿主喜悦他）前半生的样子——酗酒、伤害身边的人，甚至密谋要杀害先知（愿主福安之）；再看到他后来成为哈里发的样子——那根本不是同一个人。\n\n在\"铁\"章中，真主说：\nأَلَمْ يَأْنِ لِلَّذِينَ آمَنُوا أَن تَخْشَعَ قُلُوبُهُمْ لِذِكْرِ اللَّهِ\n\"难道信士们以为时间还未到，故他们的心不为真主的教诲和他所降示的真理而柔和吗？\"（《古兰经》57:16（节选）· 马坚译）\n紧接着，真主又说：\nاعْلَمُوا أَنَّ اللَّهَ يُحْيِي الْأَرْضَ بَعْدَ مَوْتِهَا\n\"你们应当知道真主是使已死的大地复活的。\"（《古兰经》57:17（节选）· 马坚译）\n这就是一个迹象：无论你的心、你的灵魂死去了多少回，都还有机会被一次次带回生命。\n\n但问题是：你现在是活着，还是已经死了？这完全取决于你灵魂的状态。先贤们常说：比身体的死亡更可怕的，是心的死亡。\n\n先知（愿主福安之）说，诗人说过的最真诚的诗句是：\nأَلَا كُلُّ شَيْءٍ مَا خَلَا اللَّهَ بَاطِلُ\n\"除真主之外的一切，都是虚妄、可抛弃的。\"（《布哈里圣训实录》3841；《穆斯林圣训实录》2256；阿拉伯原文经 sunnah.com 核对；暂无可核对的权威中文译文，此处中文为讲稿英文的忠实翻译。）\n你的身体一旦与真主——赞美他，至高无上的他——断了连接，也在\"可抛弃\"之列。\n\n从身体上看，你的生命要经历许多阶段：先是众灵之境——前世之境，那时你只是一个灵魂；然后是今世的生命——身体与灵魂相合，你成了一个自我；再往后是坟墓的间隔期——灵魂继续前行，但仍以某种方式与身体相连，而身体在朽坏；最后是后世——真主——赞美他，至高无上的他——让雨从天而降，先知（愿主福安之）说，雨水落在尾骨上，一具新的身体便破土而出，与灵魂重新相合；这灵魂与身体，将带着永恒的结局活下去。\n\n这是身体。但你的灵魂和身体不一样——它可以一次次地重生、一次次地被带回生命。\n\n这为什么如此重要？因为一个人可能活到八十岁才去世，但就灵魂而言，他也许只有八天大——因为每一次挣扎、每一次回归真主，都在剥去旧我的一层外壳，剩下的，是一个崭新、被更新了的信士。\n\n赞美真主！我记得我们社区里有一位七十五岁的老人，他逢人便说自己只有四岁——因为他把归信作证的那一天当作自己的生日。\n\n但这不意味着他的重生是轻松的。当你成为穆斯林，你就脱去了旧生活的襁褓般的舒适：你曾消费的一切、你曾交往的人，更重要的是——你曾是的那个人。每一次重生都伴随着某种牺牲或不适，但随后而来的，是崭新的生命。\n\n请你留意先知（愿主福安之）提到的所有圣训——他告诉我们，人可以通过哪些方式回到\"母亲生下他的那一天\"的状态。\n\n首先，乌格白·本·阿米尔传述的圣训：先知（愿主福安之）说：\"只要有一个穆斯林，把小净做得完美，然后站起来礼拜，并且清楚自己在念什么，他走出这次拜功时，就会像他母亲生下他的那一天一样。\"（《达里米圣训集》；暂无可核对的权威中文译文，此处中文为讲稿英文的忠实翻译。）\n就像婴儿带着羊水来到这个世界，你带着小净的灵性之水走出拜功；婴儿出生时听到的第一件事是宣礼，而你——每一次小净、每一次拜功，都是在重演自己出生的循环。\n\n想一想：灵魂来到这个世界时是没有罪的。先知（愿主福安之）说，小净和拜功洗去我们的罪，就像生命之河洗去一切；残留在我们身上的，都会在鞠躬和叩头中抖落，就像抖落肩背上的沙子一样。（《伊本·希班圣训集》1734；暂无可核对的权威中文译文，此处中文为讲稿英文的忠实翻译。）\n\n然后是小净与拜功的\"加强版\"：步行去清真寺、等完一番拜再等下一番、在艰难的情况下做小净。这里有一段先知（愿主福安之）讲述的、他自己的梦境——可以说是最不可思议的传述之一。\n\n穆阿兹（愿主喜悦他）说：有一次，先知（愿主福安之）来上晨礼迟到了，眼看太阳就要升起，我们在清真寺里等着；然后他匆匆出来，宣了内宣礼，先知（愿主福安之）带领礼拜，并缩短了拜功。礼完拜，先知（愿主福安之）转过身来，用洪亮的声音对我们说：kama antum——\"保持你们的队形，不要动。\"然后他说：\"我要告诉你们今天早上我为什么迟到。昨夜我起来做夜间拜，做了小净，礼了我所能礼的拜——那是真主——赞美他，至高无上的他——为我规定的。然后我困了，就睡着了。他说：然后我看见真主——赞美他，至高无上的他——以最美好的形象显现，对我说：'呀·穆罕默德！'我说：'我的主啊，我来了（rabbi labbayk）。'他说：'你知道最高议会——众天使——此刻在争论什么吗？'我说：'我的主啊，我不知道（la adri ya rab）。'他又问了一遍，我还是这样回答；一共问了三遍。然后他说：他把手放在我的双肩之间，我感到一股清凉直透胸口，一切都向我显明了，我知道了答案。他又说：'呀·穆罕默德！'我答：'我的主啊，我来了。'他问：'他们在争论什么？'我说：'他们在争论，哪些善功能彻底罚赎罪过——这是众天使在天上的议题。'于是真主问我：'那是哪些呢？'我说：'步行去参加集体拜，礼完拜后坐在清真寺里等下一番拜，以及在艰难的情况下把小净做完美。谁能坚持这些，他将美好地活着、美好地死去，他的罪过将被涤净，如同他母亲生下他的那一天。'\"（《铁密济圣训集》3234；阿拉伯原文经 sunnah.com 核对；本段中文为讲稿英文的忠实翻译。该圣训另有可核对的权威中文译文：hadeethenc.com/zh/browse/hadith/6332，穆阿兹·本·贾巴尔传述，[健全的圣训]，铁尔米兹、艾哈迈德传述。）\n\n你看，肉体的出生有挣扎、有痛苦、有等待：母亲怀胎九月才分娩；灵魂也一样，怀揣着罪，直到把它交付给真主的饶恕——那一刻，灵魂重新出生。\n\n那么，做礼拜最尊贵的地方是哪里？是麦加。正因如此，先知（愿主福安之）说：\"谁来这座天房朝觐，远离房事、远离罪恶、远离争吵，他走出朝觐时，就会像他母亲生下他的那一天一样纯洁。\"（《布哈里圣训实录》1820；阿拉伯原文经 sunnah.com 核对；暂无可核对的权威中文译文，此处中文为讲稿英文的忠实翻译。）\n\n赞美真主！请你想一想：朝觐的每一个环节都在复刻你的出生。你站在阿拉法特——那正是你的灵魂来此之前所在的地方，你在那里与真主重立盟约；然后你前往穆兹达利法——众灵的停留之地；然后你来到人间，用石头击打恶魔——还记得你出生时恶魔戳了你一下吗？这一次，在灵魂的重生里，轮到你用石头击打恶魔了；然后你献上乌德希耶——你的牺牲——还记得你出生时献的是阿给格吗？这一次，献祭的是你自己；然后你把真主——赞美他，至高无上的他——放在生命的中心去环游，在奔走中把一切事务托付于他；到某个时刻你脱下戒衣——它多像你死时的寿衣；最后你与信士们一同庆祝——正如信士们在乐园中的庆祝。赞美真主！短短几天，就是生与死的一次完整预演。如果做得对，你的灵魂将彻底重生。\n\n今世的朝觐是灵魂的重生，因为它象征着后世的旅程。但重生不只发生在麦加的朝觐里，也发生在别的旅程中——包括另一个此刻离我们心很近的特殊地方：阿克萨清真寺。\n\n先知（愿主福安之）说，当苏莱曼（愿主赐他平安）建完远寺，他向真主祈求了三件事：他求真主赐他与真主的判断相合的判断力；他求真主赐他前无古人、后无来者的王权；他求真主：任何人来到这座清真寺，只为在这里礼拜，他走出时便罪孽全消，如同他母亲生下他的那一天。先知（愿主福安之）说：前两个祈求已被应允，我希望第三个也被应允了。（《伊本·马哲圣训集》1408；阿拉伯原文经 sunnah.com 核对；暂无可核对的权威中文译文，此处中文为讲稿英文的忠实翻译。）\n\n再往下是迁徙——为真主——赞美他，至高无上的他——而迁往他乡。在迁徙中，你是真真正正地在一片新土地上、为真主开始新生活——于是真主把你的罪留在了你离开的地方。\n\n最后，还有一种经常发生的事：在患难中感恩。这是舍达德·本·奥斯（愿主喜悦他）的圣训，他说：我听先知（愿主福安之）说，真主说：\"当我考验我的一个信士仆人，他因我的考验而赞美我，那么在那一天，他起身时将如同他母亲生下他的那一天一样，脱离罪恶。\"（《穆斯奈德·艾哈迈德》；阿拉伯原文经 sunnah.com 转引 Mishkat 1579 核对；暂无可核对的权威中文译文，此处中文为讲稿英文的忠实翻译。）\n这是因为罪会随着考验从你身上抖落——尤其当你在考验中赞美真主——赞美他，至高无上的他。考验越大，抖落的罪越多，加到你天秤上的回赐也越多。\n\n最后，把这些圣训总结起来，请你想一想伊玛目安萨里（愿主慈悯他）说过的一句话。他说：重生与死亡到底是什么？不过是从一种状态转移到另一种状态。你归信伊斯兰、你去朝觐、你迁徙——都是从一种状态转移到另一种状态。正如真主说：\nيَا أَيُّهَا الَّذِينَ آمَنُوا اسْتَجِيبُوا لِلَّهِ وَلِلرَّسُولِ إِذَا دَعَاكُمْ لِمَا يُحْيِيكُمْ\n\"信道的人们啊！当使者号召你们去遵循那使你们获得生命的（教训）的时候，你们当响应真主和使者。\"（《古兰经》8:24（节选）· 马坚译）\n\n你活着的每一天，都是重新塑造自己、复活心中的那颗心、甚至获得重生的机会。但当肉体死亡的那一刻到来、当你真正\"重生\"的那一刻，灵魂重生的机会就正式结束了。因为这一次，你将彻底脱下身体的躯壳、告别这个世界；你的死亡，将是你下一站的新生命——而那新生命的样子，取决于你在这一站过着怎样的人生。\n\n核对说明：转录稿取自 Yaqeen 官网 WP 接口（https://cdn.yaqeeninstitute.org/wp-json/wp/v2/posts/33216 的 acf.transcript_content，WEBVTT 全文，AI 生成），为第 1 优先级来源；本集 References 共 15 条，已用于核对全部引文。古兰经阿拉伯原文取自 api.quran.com text_uthmani，中文为马坚译（节选处已标注\"（节选）\"）。圣训阿拉伯原文经 sunnah.com 逐条核对（布哈里 3841、穆斯林 2256、布哈里 1820、铁密济 3234、伊本·马哲 1408、布哈里 4418、穆斯奈德·艾哈迈德舍达德传述）；其中铁密济 3234（穆阿兹梦境圣训）另有可核对的权威中文译文 hadeethenc.com/zh/browse/hadith/6332（[健全的圣训]，铁尔米兹、艾哈迈德传述），其余圣训暂无可核对的权威中文译文，正文为讲稿英文的忠实翻译并已逐条标注，未入卡片与精华一句。卡片引文为《古兰经》57:17（节选）· 马坚译。", "cardImg": "noon_2026-10-21.jpg"}, {"date": "2026-10-21", "type": "夜读", "title": "《小王子》第二十一章（节选）——狐狸与驯服", "card": "night_2026-10-21.png", "text": "《小王子》第二十一章（节选）——狐狸与驯服\n\n《小王子》是法国作家安托万·德·圣埃克絮佩里1943年出版的作品：一个来自小小星球的孩子，在宇宙间旅行，最后来到地球，遇见了一只狐狸。下面这段节选自第二十一章，译文是马振聘先生的经典译本（人民文学出版社《小王子》）。\n\n小王子在草地上遇见狐狸，狐狸请他\"驯服\"自己。小王子问，驯服是什么意思？狐狸说：\n\n\"对我来说，你还只是一个小男孩，就像其他千万个小男孩一样。我不需要你。你也同样用不着我。对你来说，我也只不过是一只狐狸，和其他千万只狐狸一样。但是，如果你驯服了我，我们就互相不可缺少了。对我来说，你就是世界上唯一的了；我对你来说，也是世界上唯一的了。\"\n\n狐狸又教小王子，该怎样驯服它：\n\n\"应当非常耐心。开始你就这样坐在草丛中，坐得离我稍微远些。我用眼角瞅着你，你什么也不要说。说话是误会的根源。但是，每天，你得坐得靠我更近些……\"\n\n\"最好还是在原来的那个时间来。比如说，你下午四点钟来，那么从三点钟开始，我就开始感到幸福。时间越临近，我就越感到幸福。到了四点钟的时候，我就会坐立不安；我就会发现幸福的代价。\"\n\n狐狸还说，被驯服之后，连世界都会变得不一样：\n\n\"我的生活很单调。我捕捉鸡，而人又捕捉我。所有的鸡全都一样，所有的人也全都一样。因此，我感到有些厌烦了。但是，如果你要是驯服了我，我的生活就一定会是欢快的。我会辨认出一种与众不同的脚步声。其他的脚步声会使我躲到地下去，而你的脚步声就会象音乐一样让我从洞里走出来。再说，你看！你看到那边的麦田没有？我不吃面包，麦子对我来说，一点用也没有。我对麦田无动于衷。而这，真使人扫兴。但是，你有着金黄色的头发。那么，一旦你驯服了我，这就会十分美妙。麦子，是金黄色的，它就会使我想起你。而且，我甚至会喜欢那风吹麦浪的声音……\"\n\n于是小王子驯服了狐狸。离别的时候到了。临走前，狐狸让小王子再去看看园子里的五千朵玫瑰。小王子对她们说：\n\n\"你们很美，但你们是空虚的。没有人能为你们去死。当然罗，我的那朵玫瑰花，一个普通的过路人以为她和你们一样。可是，她单独一朵就比你们全体更重要，因为她是我浇灌的。因为她是我放在花罩中的。因为她是我用屏风保护起来的。因为她身上的毛虫（除了留下两三只为了变蝴蝶而外）是我除灭的。因为我倾听过她的怨艾和自诩，甚至有时我聆听着她的沉默。因为她是我的玫瑰。\"\n\n小王子回到狐狸身边告别。\n\n\"再见了。\"小王子说道。\n\n\"再见。\"狐狸说，\"喏，这就是我的秘密。很简单：只有用心才能看得清。实质性的东西，用眼睛是看不见的。\"\n\n\"实质性的东西，用眼睛是看不见的。\"小王子重复着这句话，以便能把它记在心间。\n\n\"正因为你为你的玫瑰花费了时间，这才使你的玫瑰变得如此重要。\"\n\n\"正因为你为你的玫瑰花费了时间……\"小王子又重复着，要使自己记住这些。\n\n\"人们已经忘记了这个道理，\"狐狸说，\"可是，你不应该忘记它。你现在要对你驯服过的一切负责到底。你要对你的玫瑰负责……\"\n\n\"我要对我的玫瑰负责……\"小王子又重复着。\n\n——安托万·德·圣埃克絮佩里《小王子》第二十一章（节选），马振聘 译，人民文学出版社\n\n爱不是占有，是花费时间，是负起责任。今夜，愿您也想起那朵属于自己的\"玫瑰\"。", "cardImg": "night_2026-10-21.jpg"}, {"date": "2026-10-22", "type": "晨读", "title": "恩上加恩", "card": "morning_2026-10-22.png", "text": "一句话：\n\"当时，你们的主曾宣布说：如果你们感谢，我誓必对你们恩上加恩；如果你们忘恩负义，那末，我的刑罚确是严厉的。\"\n——《古兰经》14:7 · 马坚译\n\n一段话：\n据艾奈斯·本·马利克传述，安拉的使者（愿主福安之）说：\"的确安拉喜欢这样的仆人，他每吃一口食物便赞颂安拉，或每喝一口水也赞颂安拉。\"（《穆斯林圣训集》2734）\n\n感恩不必等宏大的时刻。一口饭、一杯水之后的一句\"一切赞颂全归安拉\"，就足以让真主喜悦。仆人因安拉的恩惠而赞颂他，这赞颂本身就是抵达喜悦的路。真主慷慨地赐给给养，又以一句赞颂为满足——原来获取喜悦可以这么简单。饭后的一句赞词，是用餐的礼仪，更是心灵的记号：这一切并非理所当然。清晨醒来，先数一数已经拥有的。\n\n一篇文章：\n今天的文章来自英国学者阿里·哈穆达（Ali Hammuda）官方频道的《心的转变》（Change of Heart）系列第 10 集：感恩（Shukr）。\n\n他把感恩讲成一种\"心的状态\"，而不是挂在嘴边的一句谢谢。这种状态，恰恰是现代人特有的\"不满足\"的解药：我们活在物质丰裕的时代，消费主义又被精心设计得让人永远焦虑、永远想要更多——感恩让人停下来，看见已经拥有的。\n\n这一集也重塑了我们看待考验的方式：磨难不再只是打击，也可以成为看清恩典的镜子。他对照了《古兰经》中先知们展现的感恩榜样，讲述感恩带来的回赐：现世的知足与安宁，以及真主的喜悦。\n\n最后落到实处：感恩要用心、舌、四肢三者共同践行——心里承认恩典来自真主，口头常常赞颂感谢，身体力行顺从与行善。感恩不是一时的感觉，而是一种可以练习的生活方式。\n\n正如今天卡片上的经文：感恩的人，真主\"誓必恩上加恩\"。清晨，从一句由衷的赞颂开始。\n\n原作者：Ali Hammuda（阿里·哈穆达，英国）\n原文链接：https://www.youtube.com/playlist?list=PL9OPVukugS7xZ-PY008PN6_kGInouP0rz", "cardImg": "morning_2026-10-22.jpg"}, {"date": "2026-10-22", "type": "30u30", "title": "30u30 第6天｜The First Law of Complexodynamics（复杂动力学第一定律）", "card": "", "text": "30u30 第6天｜The First Law of Complexodynamics（复杂动力学第一定律）——Scott Aaronson，2011年（博客文章，非正式论文）\n\n一句话：2011年，物理学家Sean Carroll在一次会议的开幕演讲里抛了个问题——为什么熵一直在单调上升，\"复杂性/有趣程度\"却是先升后降、在中间达到顶峰？计算机科学家Scott Aaronson用这篇博客文章给出一个候选答案：他新造了一个词\"complextropy\"（可译作复杂度熵），并猜想它在时间轴上\"两头小、中间大\"，管这叫\"复杂动力学第一定律\"——但他自己也坦白：\"我还不知道怎么证明这个猜想。\"\n\n核心思想：想象你往咖啡里倒牛奶。刚倒进去，黑白分明，很简单；搅到一半，奶白色的卷须和漩涡翻出漂亮花纹，最复杂；搅匀了，一杯均匀的浅棕色，又变简单了。熵（混乱度）全程都在上升，但\"有意思的程度\"先升后降。宇宙也一样：大爆炸之初是简单的高能粒子汤，无数年后的热寂是均匀的低能粒子汤，而今天——在中间——有星系、有大脑。问题是：怎么给\"有意思\"一个严格的数学定义？Kolmogorov复杂度（描述一个东西所需的最短程序长度）不行：完全随机的字符串复杂度最高，但它一点都不有趣——你只用说一句\"它是随机的\"就讲完了它的一切。Aaronson搬出\"sophistication\"（精致度）：找一个包含x的集合S，使得x在S里是个\"典型成员\"（看起来随机的），那么描述这个集合S本身要花多少比特，就是x的精致度。全0字符串的精致度很低（S就是它自己），纯随机字符串的精致度也很低（S就是\"所有字符串\"），只有真有结构的东西才高。但还有个漏洞：对确定性系统，精致度永远超不过log(t)——因为\"t步后的状态\"总可以描述成\"初始状态＋规则＋跑t步\"。于是Aaronson祭出关键一招：给定义加上\"效率\"约束——描述集合S的程序必须在n·log(n)时间内跑完，采样和重建两个环节都必须高效。这就是complextropy。不加效率约束，你总可以作弊；而加上之后，中间时刻咖啡杯里那些卷须边界就成了实实在在的、没法被高效压缩掉的结构信息。所谓\"第一定律\"就是猜想：complextropy在初始时刻小、中间时刻大、达到平衡后又变小。Aaronson说，这篇文章真正的贡献不是答案，而是把问题问得足够精确——精确到它变成一个\"真的可以证明定理、真的可以发论文\"的具体问题，而不是空谈。\n\n为什么重要：第一，它把\"熵\"和\"复杂性\"这两个常被混用的词彻底分开：熵单调上升，复杂性先升后降，随机不等于复杂。第二，它是第4、5天（MDL/最小描述长度）的自然续集：MDL说\"描述越短模型越好\"，这篇追问\"描述长度漏掉了什么\"——随机字符串描述最长却最无聊，说明光看压缩长度还不够，还得把\"结构\"和\"随机\"分开。第三，这篇博客直接催生了明天第7天要讲的论文《The Coffee Automaton》（Aaronson、Carroll和当时还是MIT本科生的Lauren Ouellette合作，arXiv:1405.6903），把博客里的猜想变成了真正的实验——这个系列前后呼应，Aaronson自己就是这么设计的。\n\n和现代AI的关系：大模型本质上就是压缩机。预测下一个token，就是把语言里\"既不平凡也不随机\"的结构（语法、知识、推理套路）装进参数——只会背常用语的模型太简单，输出乱码的模型太随机，好模型恰恰是在学习sophistication量的那种\"真正的结构\"。两段编码（模型描述＋残差）的直觉就是预训练本身：模型权重是\"集合S的描述\"，剩下压缩不掉的部分是噪声，压缩得越好模型越好——这和第4、5天的MDL精神一脉相承。仓库的后记还提到一个实证：拿gzip当Kolmogorov复杂度的粗糙代理这个做法后来被广泛采用，包括2023年那场\"gzip打败BERT\"的争论——\"压缩\"是个极强的结构探测器，连文本分类任务都能掰手腕。最后留一个仓库笔记里的开放问题（只是问题，不是结论）：神经网络训练到中途，内部表征会不会也在某个中间点\"最复杂\"？不确定。\n\n代码要点：仓库把Aaronson的咖啡杯思想实验变成了可跑的模拟（Python＋gzip/zlib＋NumPy＋Matplotlib）：\n1. create_initial_grid＋batch_swap：64×64像素格，上半黑（咖啡）下半白（牛奶），每步随机挑一对相邻的咖啡-牛奶像素交换——就是Aaronson原文描述的动力学；\n2. gzip_complexity：把像素格序列化成字节，gzip压缩后的大小当作Kolmogorov复杂度的粗糙近似（压缩级别固定用9，保证可比）；\n3. coarse_grained_kc：Sean Carroll在评论区提的建议——先把图像模糊/降采样再压缩，抓的是宏观结构而不是像素噪声；\n4. two_part_code：两段编码——第一段是粗粒化后的\"模型\"（sophistication的代理），第二段是还原精确状态所需的残差；\n5. multiscale_kc：Luca Trevisan在评论区提的多尺度分析——在每个尺度上都测一遍复杂度，看\"鼓包\"到底住在哪个尺度；\n6. 跑完run_simulation：熵单调上升，而复杂度（gzip大小、两段编码第一段）先升后降，走出一条特征性的\"驼峰\"曲线——正是\"第一定律\"猜想的形状；\n7. 5道练习：gzip测复杂度、咖啡混合模拟、多尺度分析、两段编码、各种度量大对比，答案在solutions目录。\n\n原论文：https://scottaaronson.blog/?p=762\n当天页面：https://github.com/Ojhaharsh/30u30/tree/main/papers/06_Complexodynamics\n\n明天第7天就是这篇的\"实证续集\"：《The Coffee Automaton》——Aaronson和Carroll把博客里的猜想变成了真正的论文和实验。", "cardImg": ""}, {"date": "2026-10-22", "type": "午读", "title": "What it Feels Like to Die（第8集）", "card": "noon_2026-10-22.png", "text": "标题：Ep.8《What it Feels Like to Die》（死亡是什么感觉？）\n讲者：Dr. Omar Suleiman（奥马尔·苏莱曼博士）\n视频：https://www.youtube.com/watch?v=Lk2f0vHkM5g\nYaqeen 页面：https://yaqeeninstitute.org/watch/series/the-other-side-barzakh-and-beyond/what-it-feels-like-to-die-the-other-side\n\n精华一句：\n先知最常念的祈祷只有一句：\"调转人心的主啊，请坚定我的心在你的宗教上。\"连先知都怕心翻转，你我凭什么觉得自己稳得住？\n\n凝练一段：\n这一集讲\"死亡那一刻\"。讲者说，今世最大的压力不是贫穷、疾病或暴君，而是灵魂离体的瞬间：信士的灵魂像水壶里最后一滴水般滑出，恶人的灵魂却被钩子从身体里撕扯出来。坟墓的挤压无人能免，蒙卡尔与纳基尔的拷问只认你在今世压力下练出的答案。所以先知最常念的祈祷是求\"坚定\"——而你每一次在诱惑前说\"我畏惧真主\"、在暴君前说一句真话，都是在为那场考试彩排。\n\n完整全文翻译：\n奉至仁至慈的真主之名。\n\n抓紧了。你的世界在摇晃，把你往四面八方撕扯。无论你多么努力想站稳，障碍总把你击倒：这边是诱惑在拉扯，那边是考验在挤压；疲惫和沮丧压得你喘不过气，有时你觉得自己再也走不动一步。但请你看仔细：有一条绳索伸向你，牢不可破、坚定不移——而能不能握紧它，全看你自己。\n\n盖斯·本·阿巴德说：有一次我在清真寺里，一个面容谦卑的人走了进来，礼了两拜简短的拜。人们说：那是阿卜杜拉·本·赛俩目，是乐园居民中的一员。他礼完走后，我跟了上去，一直跟到他家里，进屋和他攀谈。等他放松下来，我问他：你进清真寺时，人们说了那样的话——真是你吗？他说：赞美真主！人对自己不知道的事不该妄言。不过我可以告诉你他们为什么这么说。我在先知（愿主福安之）时代做过一个梦，就讲给了先知听。我梦见自己走进一座园子，园子里的草木繁茂、辽阔无边，园子正中有一根铁柱，牢牢钉在大地上，顶端直插云霄；柱顶上有一个把手。有人叫我爬上去抓住它。我说：我怎么上得去？这时一位扶助者从我身后托起我的衣袍，对我说：上去。我爬了上去，一把抓住了那个把手。他对我说：抓紧这个把手。我从梦中醒来时，手里还握着那个把手。我去见先知（愿主福安之），把梦告诉了他。他说：至于那座园子，就是伊斯兰的园子；至于那根柱子，就是伊斯兰的支柱；至于那个把手，就是真主在《古兰经》中描述的最坚实的把柄（العروة الوثقى）。他对我说：你将一直处在伊斯兰之上，直到你去世。（[哈基姆《Al-Mustadrak》；暂无可核对的权威中文译文，此处中文为讲稿英文的忠实翻译。]）\n\n请你想一想，真主——赞美他，至高无上的他——用多少种方式提醒我们\"抓紧\"。他让我们抓紧最坚实的把柄，好让我们得救——因为这个世界会欺骗你，把你带往各种歧途。他对我们这个整体说：\nوَاعْتَصِمُوا بِحَبْلِ اللَّهِ جَمِيعًا\n\"你们当全体坚持真主的绳索。\"（《古兰经》3:103（节选）· 马坚译）\n因为这个世界会分裂你们，把你们从真主的恩惠中带走——而那恩惠，永远与集体同在。他说：\nخُذُوا مَا آتَيْنَاكُم بِقُوَّةٍ\n\"你们当坚守我所赐你们的经典。\"（《古兰经》2:63（节选）· 马坚译）\n因为伊斯兰这件事是严肃的，而对律法的欺骗，源于一颗死去的心。\n\n先知（愿主福安之）说：将有一个时代，其中坚守宗教者的忍耐，如同手握一块烧红的炭——因为欲望环伺四周，触手可及。（《铁密济圣训集》2260；阿拉伯原文经 sunnah.com 核对；暂无可核对的权威中文译文，此处中文为讲稿英文的忠实翻译。）\n\n先知（愿主福安之）说：你们当紧紧抓住我的圣行，像一个人用臼齿死死咬住它一样——因为你们将活在一个充满欺骗的时代，一旦离开先知（愿主福安之）的圣行，很容易就会溺死在偏误里。（《艾布·达乌德圣训集》4607；《铁密济圣训集》2676；阿拉伯原文经 sunnah.com 核对；暂无可核对的权威中文译文，此处中文为讲稿英文的忠实翻译。）\n\n真主的使者（愿主福安之）提到这样一种人：一位有地位、有美貌的女人召唤他去私通，在那一刻他克制住自己，说：إِنِّي أَخَافُ اللَّهَ——\"我确畏惧真主。\"就因为他没有在那一刻的炽热中屈服，真主赐他在宝座荫庇下的清凉。（《布哈里圣训实录》6806；《穆斯林圣训实录》1031；阿拉伯原文经 sunnah.com 核对；暂无可核对的权威中文译文，此处中文为讲稿英文的忠实翻译。）\n\n请你想一想先知（愿主福安之）说的：最伟大的吉哈德，是在暴君面前说一句真话。请你想象阿卜杜拉·本·胡扎法（愿主喜悦他）那样的人，还有其他圣门弟子——他们站在世上最强大的暴君的庭院里，说出那句真话。再想想加沙那些勇敢的男女——他们每天都直面暴君，从不在压力下屈服。他们或许会失去生命，因为他们不被眼前的宝座威压吓倒；但他们的灵魂会迅速升向天上至仁主的宝座，在乐园中永远遨游。那不过是一瞬间的压力——而今世再没有比死亡那一刻更大的压力了。\n\n正因如此，先知（愿主福安之）最常念的祈祷是这一句：\nيَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ\n\"调转人心的主啊，请坚定我的心在你的宗教上。\"（《铁密济圣训集》3522；阿拉伯原文经 sunnah.com 核对；中文为可核对的权威译文，见 hadeethenc.com/zh/browse/hadith/3142。）\n\n请你想想 ثَبَات（坚定）这个词。真主说：\nيُثَبِّتُ اللَّهُ الَّذِينَ آمَنُوا بِالْقَوْلِ الثَّابِتِ فِي الْحَيَاةِ الدُّنْيَا وَفِي الْآخِرَةِ\n\"在今世和后世，真主以坚固的言辞使信道者坚信。\"（《古兰经》14:27（节选）· 马坚译）\n因为当你面对今世短暂的瞬间——死亡的剧痛、恶魔最后一次怂恿你不信——你依然能念出 لَا إِلَٰهَ إِلَّا اللَّهُ。\n\n但请注意：先知（愿主福安之）没有把这句祈祷局限在今世——因为你最需要坚定的时刻，是天使进入你的坟墓审问你的那一刻。那时他们比任何暴君都可怕，那处境比你今世面对过的任何事都更令人窒息。正因如此，先知（愿主福安之）说：当你们埋葬你们的兄弟或姐妹时——\nسَلُوا اللَّهَ لَهُ الثَّبَاتَ\n\"你们当为他向真主祈求坚定\"——因为他将经历此生最艰难的考验。（《艾布·达乌德圣训集》3221；阿拉伯原文经 sunnah.com 核对；暂无可核对的权威中文译文，此处中文为讲稿英文的忠实翻译。）\n\n而问题是：你根本不知道这些考验何时到来。就像你每天以睡眠和醒来预演生与死，你也在每一次信仰受压的时刻，以 لَا إِلَٰهَ إِلَّا اللَّهُ 预演死亡的压力——\nوَمَا تَدْرِي نَفْسٌ مَّاذَا تَكْسِبُ غَدًا وَمَا تَدْرِي نَفْسٌ بِأَيِّ أَرْضٍ تَمُوتُ\n\"任何人都不知道自己明日将做什么事，任何人都不知道自己将死在什么地方。\"（《古兰经》31:34（节选）· 马坚译）\n所以你不可能在临死前的几天或几刻才为这场考试做准备——因为你不知道主考官会在哪一刻突然把考卷拍在你面前。灵魂离体的那一刻，是真主——赞美他，至高无上的他——定下的时刻，不是你定的。人不知道自己何时把灵魂交付给那个 بَرْزَخ（间隔期）。就像怀胎三十八周的母亲不知道自己何时宫缩、何时分娩。\n\n伊玛目古尔图比（愿主慈悯他）写过一段极美的诗。他说：\n我们行走在命运划定的路上，\n命定前行者，必将继续前行。\n我们的给养散布四方，\n但属于我们的，一分不会少。\n若死亡被写定在某片土地，\n人绝不会在他乡咽下最后一口气。\n（[古尔图比《At-Tadhkirah》；此处中文为讲稿英文的忠实翻译。]）\n\n我们每个人都有一片土地，灵魂将在那里被\"接生\"到下一个世界——而我们不知道它在哪里。先知（愿主福安之）说：当时刻到来，真主会在那个确切的地点，为我们安排一件要办的事；当我们抵达那里，死亡天使已在等候，取走我们的灵魂。（《铁密济圣训集》2147；阿拉伯原文经 sunnah.com 核对；暂无可核对的权威中文译文，此处中文为讲稿英文的忠实翻译。）\n\n伊玛目古尔图比（愿主慈悯他）还传述了一个耐人寻味的故事，关于苏莱曼（愿主赐他平安）。他说：有一天，苏莱曼和一个人在一起，那人说：真主的先知啊，我在印度有件要紧事要办，你能求真主命令风，顷刻间把我送到印度吗？苏莱曼看向死亡天使，发现他在微笑。他问：你笑什么？死亡天使说：真奇怪——我奉命在这个时辰结束时，在印度取走这个人的灵魂，可我刚才还看见他和你在一起。于是他看见风在那个时辰把那人送到了印度，他的灵魂果然从那里被取走了。（[古尔图比《At-Tadhkirah》；此处中文为讲稿英文的忠实翻译。]）\n\n当你的死亡时刻降临——有时它来得最出人意料，地点也最出人意料。在那一刻，你忽然抬头，看见天使们向你走来——带着欣喜，或带着怒火。他们曾把你的灵魂吹进你的身体，如今他们来把它取出。无论身边还有谁，此刻你只看得见他们。\n\n先知（愿主福安之）说：如果你是一个信士的灵魂，你会看见天使们带着光明降临，在你视线的尽头、天际线上；死亡天使走近，带来一块散发着乐园麝香气息的寿衣。他们对你说：赛俩目，不要害怕，纯洁的灵魂啊，到真主的慈悯与喜悦中来吧。你微笑着，灵魂从身体里跃出——你的眼睛看着它进入那块寿衣，渴望去见一位喜悦它的主，准备升上诸天，准备领受它的报偿。它出来得像水壶里最后一滴水，顺滑无声——不痛，没有创伤。（[《穆斯奈德·艾哈迈德》；此处中文为讲稿英文的忠实翻译。]）\n\n反过来，一个恶人的灵魂看见天使们带着怒火向它走来，击打它——灵魂便躲进身体深处，天使便用钩子把它拽出来，像撕扯棉花一样。\"出来吧，去见一位你曾漠视的主的怒火，去面对你曾希望不是真的那些后果。\"（[《穆斯奈德·艾哈迈德》；此处中文为讲稿英文的忠实翻译。]）\n\n所以，抓紧 لَا إِلَٰهَ إِلَّا اللَّهُ——坚定之辞，稳固之语。因为这是你在复生日之前，此生中最天翻地覆的一刻。\n\n曾有一位天使把你的灵魂吹进你的身体，你在几个月的\"产程\"后，经历一次艰难的挤压才来到人间。这一次，天使取走你的灵魂：它要么穿过诸天，得到它需要的一切安慰与慰藉——就像子宫里娇嫩的婴儿；要么坠入 سِجِّين（深渊），灵性流产的胎儿被丢弃的地方。\n\n但接着你必须过渡到间隔期——你的\"重生\"开始了。每个灵魂都必须回到坟墓里\"分娩\"，正如真主向我们许诺的：他将使我们归于大地，正如他当初从大地中创造我们。\n\n先知（愿主福安之）提到坟墓的挤压——它和坟墓的刑罚不是一回事。连正直的赛阿德·本·穆阿兹都没能免于它——尽管他的去世撼动了真主的宝座（《布哈里圣训实录》3803；《穆斯林圣训实录》2466）；也没能免于它的，是一个纯洁的婴儿——他从没机会犯罪，本不该受罚。（挤压圣训见《穆斯奈德·艾哈迈德》，阿拉伯原文见本集 References：إِنَّ لِلْقَبْرِ ضَغْطَةً وَلَوْ كَانَ أَحَدٌ نَاجِيًا مِنْهَا لَنَجَا مِنْهَا سَعْدُ بْنُ مُعَاذٍ；婴儿事见《塔巴拉尼中集》；此处中文为讲稿英文的忠实翻译。）\n\n不过，有\"艰难而必然\"的，也有\"罪恶叠加的艰难\"。你看赛阿德（愿主喜悦他），他的\"产程\"相对轻松——只有一次挤压（《奈萨仪圣训集》2055）；而有的人，肋骨会在过程中被压碎（《艾布·达乌德圣训集》4753）。（此处中文为讲稿英文的忠实翻译。）\n\n然后是考试。曾是两位天使记下你的善恶——رَقِيبٌ عَتِيد；现在将是两位天使考问你——مُنكَر وَنَكِير（蒙卡尔与纳基尔）；复活时陪伴你的，又是两位天使——سَائِقٌ وَشَهِيد。而那两位天使以什么形象来见你，取决于你的行为：蒙卡尔和纳基尔以美好的形象来见善人，以丑陋的形象来见恶人——你的天使的形象，是你自己亲手塑造的。（《艾布·达乌德圣训集》4753；此处中文为讲稿英文的忠实翻译。）\n\n那难以置信的压力袭来——他们用洪亮的声音说：مَن رَبُّكَ؟ مَا دِينُكَ؟ مَن نَبِيُّكَ؟——\"谁是你的主？你的宗教是什么？你的先知是谁？\"而你唯一能答上来的办法，是在今世的压力下就学会作答；否则你会惊慌失措、哑口无言。\n\n但如果你抓紧了——产程会过去，考试会过去，你的灵魂会在新世界里安定下来，就像它今世以记念真主——赞美他，至高无上的他——而安定一样。\n\nلَعَلِّي أَعْمَلُ صَالِحًا فِيمَا تَرَكْتُ كَلَّا إِنَّهَا كَلِمَةٌ هُوَ قَائِلُهَا وَمِن وَرَائِهِم بَرْزَخٌ إِلَىٰ يَوْمِ يُبْعَثُونَ\n\"也许我能借我的遗留的财产而行善。绝不然！这是他一定要说的一句话，在他们的前面，有一个屏障，直到他们复活的日子。\"（《古兰经》23:100 · 马坚译）\n\n核对说明：转录稿取自 Yaqeen 官网 WP 接口（https://cdn.yaqeeninstitute.org/wp-json/wp/v2/posts/33242 的 acf.transcript_content，WEBVTT 全文，AI 生成），为第 1 优先级来源；本集 References 共 13 组，已用于核对全部引文。古兰经阿拉伯原文取自 api.quran.com text_uthmani，中文为马坚译（节选处已标注\"（节选）\"）。圣训阿拉伯原文经 sunnah.com 逐条核对（铁密济 3522、铁密济 2260、艾布·达乌德 4607、铁密济 2676、布哈里 6806、穆斯林 1031、艾布·达乌德 4344、铁密济 2174、艾布·达乌德 3221、铁密济 2147、布哈里 3803、穆斯林 2466）；其中\"调转人心的主\"祈祷辞另有可核对的权威中文译文 hadeethenc.com/zh/browse/hadith/3142（艾奈斯传述，[صحيح]，铁尔米兹、艾哈迈德辑录），其余圣训暂无可核对的权威中文译文，正文为讲稿英文的忠实翻译并已逐条标注，未入卡片与精华一句。卡片引文为《铁密济圣训集》3522 祈祷辞（节选）· 中文见 hadeethenc.com。", "cardImg": "noon_2026-10-22.jpg"}, {"date": "2026-10-22", "type": "夜读", "title": "《渐》——丰子恺哲理散文", "card": "night_2026-10-22.png", "text": "《渐》——丰子恺哲理散文\n\n丰子恺（1898－1975），现代画家、散文家、艺术教育家。《渐》发表于1928年，选自《缘缘堂随笔》。全篇只讲一个字——\"渐\"：一年一年地、一月一月地、一日一日地、一时一时地、一分一分地、一秒一秒地，人生就这样被\"渐\"推着，圆滑地进行。\n\n使人生圆滑进行的微妙的要素，莫如\"渐\"；造物主骗人的手段，也莫如\"渐\"。在不知不觉之中，天真烂漫的孩子\"渐渐\"变成野心勃勃的青年；慷慨豪侠的青年\"渐渐\"变成冷酷的成人；血气旺盛的成人\"渐渐\"变成顽固的老头子。因为其变更是渐进的，一年一年地、一月一月地、一日一日地、一时一时地、一分一分地、一秒一秒地渐进，犹如从斜度极缓的长远的山坡上走下来，使人不察其递降的痕迹，不见其各阶段的境界，而似乎觉得常在同样的地位，恒久不变，又无时不有生的意趣与价值，于是人生就被确实肯定，而圆滑进行了。\n\n假使人生的进行不像山陂而像风琴的键板，由do忽然移到re，即如昨夜的孩子今朝忽然变成青年；或者象旋律的\"接离进行\"地由do忽然跳到mi，即如朝为青年而夕暮忽成老人，人一定要惊讶、感慨、悲伤、或痛感人生的无常，而不乐为人了。故可知人生是由\"渐\"维持的。这在女人恐怕尤为必要：歌剧中，舞台上的如花的少女，就是将来火炉旁边的老婆子，这句话，骤听使人不能相信，少女也不肯承认，实则现在的老婆子都是由如花的少女\"渐渐\"变成的。\n\n人之能堪受境遇的变衰，也全靠这\"渐\"的助力。巨富的纨袴子弟因屡次破产而\"渐渐\"荡尽其家产，变为贫者；贫者只得做佣工，佣工往往变为奴隶，奴隶容易变为无赖，无赖与乞丐相去甚近，乞丐不妨做偷儿……这样的例，在小说中，在实际上，均多得很。因为其变衰是延长为十年二十年而一步一步地\"渐渐\"地达到的，在本人不感到什么强烈的刺激。故虽到了饥寒病苦刑笞交迫的地步，仍是熙熙然贪恋着目前的生的欢喜。假如一位千金之子忽然变了乞丐或偷儿，这人一定愤不欲生了。\n\n这真是大自然的神秘的原则，造物主的微妙的工夫！阴阳潜移，春秋代序，以及物类的衰荣生杀，无不暗合于这法则。由萌芽的春\"渐渐\"变成绿荫的夏，由凋零的秋\"渐渐\"变成枯寂的冬。我们虽已经历数十寒暑，但在围炉拥衾的冬夜仍是难于想象饮冰挥扇的夏日的心情；反之亦然。然而由冬一天一天地、一时一时地、一分一分地、一秒一秒地移向夏，由夏一天一天地、一时一时地、一分一分地、一秒一秒地移向冬，其间实在没有显著的痕迹可寻。昼夜也是如此：傍晚坐在窗下看书，书页上\"渐渐\"地黑起来，倘不断地看下去（目力能因了光的渐弱而渐渐加强），几乎永远可以认识书页上的字迹，即不觉昼之已变为夜。黎明凭窗，不瞬目地注视东天，也不辨自夜向昼的推移的痕迹。儿女渐渐长大起来，在朝夕相见的父母全不觉得，难得见面的远亲就相见不相识了。往年除夕，我们曾在红蜡烛底下守候水仙花的开放，真是痴态！倘水仙花果真当面开放给我们看，便是大自然的原则的破坏，宇宙的根本的摇动，世界人类的末日临到了！\n\n\"渐\"的作用，就是用每步相差极微极缓的方法来隐蔽时间的过去与事物的变迁的痕迹，使人误认其为恒久不变。这真是造物主骗人的一大诡计！这有一件比喻的故事：某农夫每天早晨抱了犊而跳过一沟，到田里去工作，夕暮又抱了它跳过沟回家。每日如此，未尝间断。过了一年，犊已渐大，渐重，差不多变成大牛，但农夫全不觉得，仍是抱了它跳沟。有一天他因事停止工作，次日再就不能抱了这牛而跳沟了。造物的骗人，使人留连于其每日每时的生的欢喜而不觉其变迁与辛苦，就是用这个方法的。人们每日在抱了日重一日的牛而跳沟，不准停止。自己误以为是不变的，其实每日在增加其苦劳！\n\n我觉得时辰钟是人生的最好的象征了。时辰钟的针，平常一看总觉得是\"不动\"的；其实人造物中最常动的无过于时辰钟的针了。日常生活中的人生也如此，刻刻觉得我是我，似乎这\"我\"永远不变，实则与时辰钟的针一样的无常！一息尚存，总觉得我仍是我，我没有变，还是留连着我的生，可怜受尽\"渐\"的欺骗！\n\n\"渐\"的本质是\"时间\"。时间我觉得比空间更为不可思议，犹之时间艺术的音乐比空间艺术的绘画更为神秘。因为空间姑且不追究它如何广大或无限，我们总可以把握其一端，认定其一点。时间则全然无从把握，不可挽留，只有过去与未来在渺茫之中不绝地相追逐而已。性质上既已渺茫不可思议，分量上在人生也似乎太多。因为一般人对于时间的悟性，似乎只够支配搭船乘车的短时间；对于百年的长期间的寿命，他们不能胜任，往往迷于局部而不能顾及全体。试看乘火车的旅客中，常有明达的人，有的宁牺牲暂时的安乐而让其坐位于老弱者，以求心的太平（或博暂时的美誉）；有的见众人争先下车，而退在后面，或高呼\"勿要轧，总有得下去的！\"\"大家都要下去的！\"然而在乘\"社会\"或\"世界\"的大火车的\"人生\"的长期的旅客中，就少有这样的明达之人。所以我觉得百年的寿命，定得太长。象现在世界上的人，倘定他们搭船乘车的期间的寿命，也许在人类社会上可减少许多凶险残惨的争斗，而与火车中一样的谦让，和平，也未可知。\n\n然人类中也有几个能胜任百年或千古的寿命的人。那是\"大人格\"，\"大人生\"。他们能不为\"渐\"所迷，不为造物所欺，而收缩无限的时间并空间于方寸的心中。故佛家能纳须弥于芥子。中国古诗人（白居易）说：\"蜗牛角上争何事？石火光中寄此身。\"英国诗人（Blake）也说：\"一粒沙里见世界，一朵花里见天国；手掌里盛住无限，一刹那便是永劫。\"\n\n——丰子恺《渐》（1928年作，选自《缘缘堂随笔》；作者1898－1975，逝世已逾五十年，公有领域）\n\n孩子渐渐长大，我们渐渐老去；时间从不惊扰谁，也从不停留。愿我们都能做那\"不为'渐'所迷\"的人——在一秒一秒的流逝里，活出\"大人格\"。", "cardImg": "night_2026-10-22.jpg"}, {"date": "2026-10-22", "type": "古兰经学习", "title": "古兰经学习｜黄牛章 21-30", "card": "", "text": "【2:21】\n阿拉伯原文：يَـٰٓأَيُّهَا ٱلنَّاسُ ٱعْبُدُوا۟ رَبَّكُمُ ٱلَّذِى خَلَقَكُمْ وَٱلَّذِينَ مِن قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ\n英译（Saheeh International）：O mankind, worship your Lord, who created you and those before you, that you may become righteous -\n中译（马坚）：众人啊！你们的主，创造了你们，和你们以前的人，你们当崇拜他，以便你们敬畏。\n\n【2:22】\n阿拉伯原文：ٱلَّذِى جَعَلَ لَكُمُ ٱلْأَرْضَ فِرَٰشًا وَٱلسَّمَآءَ بِنَآءً وَأَنزَلَ مِنَ ٱلسَّمَآءِ مَآءً فَأَخْرَجَ بِهِۦ مِنَ ٱلثَّمَرَٰتِ رِزْقًا لَّكُمْ ۖ فَلَا تَجْعَلُوا۟ لِلَّهِ أَندَادًا وَأَنتُمْ تَعْلَمُونَ\n英译（Saheeh International）：[He] who made for you the earth a bed [spread out] and the sky a ceiling and sent down from the sky, rain and brought forth thereby fruits as provision for you. So do not attribute to Allāh equals while you know [that there is nothing similar to Him].\n中译（马坚）：他以大地为你们的席，以天空为你们的幕，并且从云中降下雨水，而借雨水生许多果实，做你们的给养，所以你们不要明知故犯地给真主树立匹敌。\n\n【2:23】\n阿拉伯原文：وَإِن كُنتُمْ فِى رَيْبٍ مِّمَّا نَزَّلْنَا عَلَىٰ عَبْدِنَا فَأْتُوا۟ بِسُورَةٍ مِّن مِّثْلِهِۦ وَٱدْعُوا۟ شُهَدَآءَكُم مِّن دُونِ ٱللَّهِ إِن كُنتُمْ صَـٰدِقِينَ\n英译（Saheeh International）：And if you are in doubt about what We have sent down [i.e., the Qur’ān] upon Our Servant [i.e., Prophet Muḥammad (ﷺ)], then produce a sūrah the like thereof and call upon your witnesses [i.e., supporters] other than Allāh, if you should be truthful.\n中译（马坚）：如果你们怀疑我所降示给我的仆人的经典，那末，你们试拟作一章，并舍真主而祈祷你们的见证，如果你们是诚实的。\n\n【2:24】\n阿拉伯原文：فَإِن لَّمْ تَفْعَلُوا۟ وَلَن تَفْعَلُوا۟ فَٱتَّقُوا۟ ٱلنَّارَ ٱلَّتِى وَقُودُهَا ٱلنَّاسُ وَٱلْحِجَارَةُ ۖ أُعِدَّتْ لِلْكَـٰفِرِينَ\n英译（Saheeh International）：But if you do not - and you will never be able to - then fear the Fire, whose fuel is people and stones, prepared for the disbelievers.\n中译（马坚）：如果你们不能作──你们绝不能作──那末，你们当防备火狱，那是用人和石做燃料的，已为不信道的人们预备好了。\n\n【2:25】\n阿拉伯原文：وَبَشِّرِ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّـٰلِحَـٰتِ أَنَّ لَهُمْ جَنَّـٰتٍ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَـٰرُ ۖ كُلَّمَا رُزِقُوا۟ مِنْهَا مِن ثَمَرَةٍ رِّزْقًا ۙ قَالُوا۟ هَـٰذَا ٱلَّذِى رُزِقْنَا مِن قَبْلُ ۖ وَأُتُوا۟ بِهِۦ مُتَشَـٰبِهًا ۖ وَلَهُمْ فِيهَآ أَزْوَٰجٌ مُّطَهَّرَةٌ ۖ وَهُمْ فِيهَا خَـٰلِدُونَ\n英译（Saheeh International）：And give good tidings to those who believe and do righteous deeds that they will have gardens [in Paradise] beneath which rivers flow. Whenever they are provided with a provision of fruit therefrom, they will say, \"This is what we were provided with before.\" And it is given to them in likeness. And they will have therein purified spouses, and they will abide therein eternally.\n中译（马坚）：你当向信道而行善的人报喜；他们将享有许多下临诸河的乐园，每当他们得以园里的一种水果为给养的时候，他们都说：这是我们以前所受赐的。其实，他们所受赐的是类似的。他们在乐园里将享有纯洁的配偶，他们将永居其中。\n\n【2:26】\n阿拉伯原文：۞ إِنَّ ٱللَّهَ لَا يَسْتَحْىِۦٓ أَن يَضْرِبَ مَثَلًا مَّا بَعُوضَةً فَمَا فَوْقَهَا ۚ فَأَمَّا ٱلَّذِينَ ءَامَنُوا۟ فَيَعْلَمُونَ أَنَّهُ ٱلْحَقُّ مِن رَّبِّهِمْ ۖ وَأَمَّا ٱلَّذِينَ كَفَرُوا۟ فَيَقُولُونَ مَاذَآ أَرَادَ ٱللَّهُ بِهَـٰذَا مَثَلًا ۘ يُضِلُّ بِهِۦ كَثِيرًا وَيَهْدِى بِهِۦ كَثِيرًا ۚ وَمَا يُضِلُّ بِهِۦٓ إِلَّا ٱلْفَـٰسِقِينَ\n英译（Saheeh International）：Indeed, Allāh is not timid to present an example - that of a mosquito or what is smaller than it. And those who have believed know that it is the truth from their Lord. But as for those who disbelieve, they say, \"What did Allāh intend by this as an example?\" He misleads many thereby and guides many thereby. And He misleads not except the defiantly disobedient,\n中译（马坚）：真主的确不嫌以蚊子或更小的事物设任何譬喻；信道者，都知道那是从他们的主降示的真理；不信道者，却说：真主设这个譬喻的宗旨是甚麽？他以譬喻使许多人入迷途，也以譬喻使许多人上正路；但除悖逆者外，他不以譬喻使人入迷途。\n\n【2:27】\n阿拉伯原文：ٱلَّذِينَ يَنقُضُونَ عَهْدَ ٱللَّهِ مِنۢ بَعْدِ مِيثَـٰقِهِۦ وَيَقْطَعُونَ مَآ أَمَرَ ٱللَّهُ بِهِۦٓ أَن يُوصَلَ وَيُفْسِدُونَ فِى ٱلْأَرْضِ ۚ أُو۟لَـٰٓئِكَ هُمُ ٱلْخَـٰسِرُونَ\n英译（Saheeh International）：Who break the covenant of Allāh after contracting it and sever that which Allāh has ordered to be joined and cause corruption on earth. It is those who are the losers.\n中译（马坚）：他们与真主缔约之後，并断绝真主命人联络的，且在地方上作恶；这等人，确是亏折的。\n\n【2:28】\n阿拉伯原文：كَيْفَ تَكْفُرُونَ بِٱللَّهِ وَكُنتُمْ أَمْوَٰتًا فَأَحْيَـٰكُمْ ۖ ثُمَّ يُمِيتُكُمْ ثُمَّ يُحْيِيكُمْ ثُمَّ إِلَيْهِ تُرْجَعُونَ\n英译（Saheeh International）：How can you disbelieve in Allāh when you were lifeless and He brought you to life; then He will cause you to die, then He will bring you [back] to life, and then to Him you will be returned.\n中译（马坚）：你们怎麽不信真主呢？你们原是死的，而他以生命赋予你们，然後使你们死亡，然後使你们复活；然後你们要被召归於他。\n\n【2:29】\n阿拉伯原文：هُوَ ٱلَّذِى خَلَقَ لَكُم مَّا فِى ٱلْأَرْضِ جَمِيعًا ثُمَّ ٱسْتَوَىٰٓ إِلَى ٱلسَّمَآءِ فَسَوَّىٰهُنَّ سَبْعَ سَمَـٰوَٰتٍ ۚ وَهُوَ بِكُلِّ شَىْءٍ عَلِيمٌ\n英译（Saheeh International）：It is He who created for you all of that which is on the earth. Then He directed Himself to the heaven, [His being above all creation], and made them seven heavens, and He is Knowing of all things.\n中译（马坚）：他已为你们创造了大地上的一切事物，复经营诸天，完成了七层天。他对於万物是全知的。\n\n【2:30】\n阿拉伯原文：وَإِذْ قَالَ رَبُّكَ لِلْمَلَـٰٓئِكَةِ إِنِّى جَاعِلٌ فِى ٱلْأَرْضِ خَلِيفَةً ۖ قَالُوٓا۟ أَتَجْعَلُ فِيهَا مَن يُفْسِدُ فِيهَا وَيَسْفِكُ ٱلدِّمَآءَ وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ ۖ قَالَ إِنِّىٓ أَعْلَمُ مَا لَا تَعْلَمُونَ\n英译（Saheeh International）：And [mention, O Muḥammad], when your Lord said to the angels, \"Indeed, I will make upon the earth a successive authority.\" They said, \"Will You place upon it one who causes corruption therein and sheds blood, while we exalt You with praise and declare Your perfection?\" He [Allāh] said, \"Indeed, I know that which you do not know.\"\n中译（马坚）：当时，你的主对众天神说：我必定在大地上设置一个代理人。他们说：我们赞你超绝，我们赞你清净，你还要在大地上设置作恶和流血者吗？他说：我知道你们所不知道的。\n", "cardImg": "", "audio": [{"src": "quran_al-baqarah_21-30.mp3", "label": "黄牛章 21-30"}]}, {"date": "2026-10-23", "type": "晨读", "title": "他必使你满足", "card": "morning_2026-10-23.png", "text": "一句话：\n\"谁信托真主，他将使谁满足。\"\n——《古兰经》65:3（节选）· 马坚译\n\n一段话：\n\"大地上的动物，没有一个不是由真主担负其给养的，没有一个不是真主知道其住所和贮藏处的。一切事物都记载在一本明确的天经中。\"\n——《古兰经》11:6 · 马坚译\n\n飞鸟每天清晨空腹离巢、黄昏饱腹而归——它没有仓库，没有存款，给养却从不落空。人的焦虑，多半来自认错了角色：我们只管\"谋生\"，而\"赐给养\"的是另一位。托靠不是躺平不动，而是像鸟一样展翅飞出去：系紧骆驼的绳子，尽该尽的力，然后把结果放心地交出去。你的给养早已被写定，它会来，从你料想不到的地方来。\n\n一篇文章：\n今天的文章来自 Yaqeen Institute 的博客《一盏灯、一艘救生艇、一架梯子》（A Lamp, a Lifeboat, a Ladder），作者 Zahra Wadia。\n\n2020年3月，疫情之初，她失业了；四个月后，母亲又确诊了癌症。双重打击之下，她被迫重新学习从小听到大的那句话：托靠真主，但骆驼的绳子要系得比最老练的旅人还紧——托靠，从不是撒手不管，而是尽力之后的心安。\n\n最触动她的是母亲的平静。医生问要不要心理疏导，母亲笑了：\"我有我的信仰，我直接与真主对话。\"母亲祷告室里只有一盏旧台灯，女儿要换盏体面的，母亲说光就是光，能照见经文上的字就够了。手术前那一周，母亲的双手不是举起祈祷，就是在为家人准备饭菜——她迎接癌症，像迎接客人一样。\n\n失业赋闲的她开始在后院种菜，邻居送来自家菜园的果蔬，她回赠亲手做的果酱。她第一次发现，给养原来一直在身边流动。而当朋友们在停车场里轮流哭泣、社区送来食物鲜花和留言时，她在别人的慷慨里看见了真主\"至仁至恕\"的属性，也渴望成为那样的人。\n\n她的领悟是：曾以为恩典越多就离真主越近，结果恰恰相反——靠近真主之后，恩典反而更多；意义和服务，恰恰生长在匮乏与紧迫之地。正如诗人鲁米写的那句：做一盏灯，或一艘救生艇，或一架梯子。\n\n原作者：Zahra Wadia\n原文链接：https://yaqeeninstitute.org/read/blog/a-lamp-a-lifeboat-a-ladder", "cardImg": "morning_2026-10-23.jpg"}, {"date": "2026-10-23", "type": "30u30", "title": "30u30 第7天｜Quantifying the Rise and Fall of Complexity in Closed Systems: The Coffee Automaton（《封闭系统复杂度兴衰的量化：咖啡自动机》）", "card": "", "text": "30u30 第7天｜Quantifying the Rise and Fall of Complexity in Closed Systems: The Coffee Automaton（《封闭系统复杂度兴衰的量化：咖啡自动机》）——Scott Aaronson、Sean M. Carroll、Lauren Ouellette，2014年（arXiv论文）\n\n一句话：这是昨天那篇博客的\"实证续集\"——Aaronson在Day 6里猜想\"复杂度先升后降、熵只升不降\"，这篇把一杯咖啡兑奶油的过程做成二维元胞自动机，用gzip压缩实打实地测了一遍：复杂度真的走出一条先升后降的驼峰曲线，而熵全程单调上升。代码是当年还是MIT本科生的Lauren Ouellette写的。\n\n核心思想：还是那杯咖啡。刚把奶油倒进去，\"上白下黑\"，一句话说清，很简单；搅到一半，奶白色的卷须一缕缕扎进咖啡，像大理石花纹，这时候描述它最费劲，最复杂；搅匀了，\"均匀浅棕\"，又一句话说清。熵全程上升，但\"有意思的程度\"两头小、中间大。关键是怎么给\"有意思\"一个能动手算的定义——Kolmogorov复杂度（最短描述长度）不行，纯随机串的复杂度最高，可它一点都不有趣。作者们定了\"apparent complexity 表观复杂度\"：先把画面打马赛克（粗粒化：把g×g小方格取平均、再按浓度分档），然后gzip压缩，压缩后的字节数就是复杂度估计。马赛克一打，像素级噪音被抹平：搅匀的杯子打完码是一片均匀灰，压出来很小；中间态的奶油丝打码后仍是真纹理，压出来最大——\"有趣\"就藏在宏观结构里。实验设了两个模型对照：相互作用版（每步随机挑一对相邻的不同色格子交换，一格只住一个粒子，像真实液体）和非相互作用版（奶油粒子各自独立随机游走，可以重叠，纯对照组）。结果：相互作用版复杂度先升后降；非相互作用版一开始也\"看起来\"升降，但换成更精细的7档分档加行多数修正（把阈值边界附近抖动的格子拍回本行多数值）后，曲线被压平到接近零——之前的鼓包原来是测量假象。结论很干脆：复杂度需要相互作用，互不搭理的独立随机游走产生不了宏观结构。附录还用Chernoff界严格证明了非相互作用版的表观复杂度永远大不起来。量级关系也测出来了（拟合优度r²都在0.97以上）：最大熵随n²涨（跟粒子总数走），最大复杂度随n涨（复杂度只沿着咖啡奶油那条一维边界长出来），到达峰值的时间随n²涨。作者们还很老实地报告了两次失败尝试：OSCR两段编码算法（对二维结构不敏感，结果全是噪声）、粗粒化加差值两段编码（差值的表示方式引入假象），最后只留下\"直接压粗粒化图\"这一条路。四种候选度量（表观复杂度、sophistication、logical depth、light-cone）只选了表观复杂度，理由直白：\"我们不知道怎么高效地近似sophistication和logical depth\"——算不动的定义再漂亮也没用。论文留的开放问题是：解析证明相互作用版\"一定会\"变复杂——仓库笔记写到2024年仍未解决。\n\n为什么重要：第一，这是极少数把\"复杂度随时间演化\"真正动手测出来的工作，把Day 6的哲学猜想变成了可重复实验，而且作者自己抓住了自己的测量假象并修正，这种诚实很难得。第二，它给\"宇宙为什么中间最精彩\"提供了一个玩具模型：大爆炸之初简单（低熵均匀），中间冒出星系、生命、大脑（复杂），黑洞蒸发、粒子弥散之后又变简单——论文摘要里明确写了这个宇宙学类比。第三，方法论上确立了\"用现成压缩器近似Kolmogorov复杂度\"这条路，后来被反复沿用。\n\n和现代AI的关系：大模型本质上就是压缩机——预训练就是在海量文本上找最短描述，学到的是\"既不平凡也不随机\"的真正结构，这正是Day 4/5的MDL思想，也是这篇拿gzip当复杂度探针的同一逻辑。仓库笔记里还提到一个实证回响：2023年Jiang等人的论文用纯gzip做文本分类，在小样本任务上能和BERT掰手腕——\"压缩\"这个结构探测器从2014年的咖啡杯一直活到了大模型时代。一个松散的联想（论文没断言，只是问题）：神经网络训练到中途，中间层的表征会不会也在某个中间点\"最有用\"？不确定。\n\n代码要点（implementation.py，纯NumPy加gzip）：\n1. CoffeeAutomaton类：grid_size设网格边长，model选'interacting'或'non_interacting'；初始状态上半格奶油（1）、下半格咖啡（0）；\n2. step()：相互作用版每步随机挑相邻不同色格子交换——原论文单步只换一对，100×100网格要上千万步，仓库改成批量交换不冲突的多对，定性行为不变、速度起飞；\n3. 非相互作用版：每个奶油粒子独立随机游走，用uint16计数网格（粒子可重叠），附录证明用的是周期边界；\n4. measure_entropy等于gzip(细粒度网格字节，level 9)的长度；measure_complexity等于粗粒化、分档、行多数修正、gzip的长度，默认grain_size等于n除以10；\n5. train_minimal.py：命令行跑模拟画曲线，--compare-models对照两种模型，--adjusted用第6节修正版，--scaling复现n和n²标度律；5道练习在exercises/，答案在solutions/。\n坑：压缩前先把数组转bytes；分档必须在压缩前做（浮点平均值压不动）；这里的\"熵\"指gzip大小，不是香农公式。\n\n原论文：https://arxiv.org/abs/1405.6903\n当天页面：https://github.com/Ojhaharsh/30u30/tree/main/papers/07_coffee_automaton\n\n明天第8天进入新篇章：AlexNet（Krizhevsky、Sutskever、Hinton，2012）——深度学习引爆全场的ImageNet一战。", "cardImg": ""}, {"date": "2026-10-23", "type": "午读", "title": "When You Meet the Souls of Gaza（第9集）", "card": "noon_2026-10-23.png", "text": "午读｜《The Other Side: Barzakh and Beyond》第9集\n标题：When You Meet the Souls of Gaza（当你遇见加沙的灵魂）\n讲者：Dr. Omar Suleiman（时长14:35）\n视频：https://www.youtube.com/watch?v=8Jrwlf-pCXE\n\n精华一句：\n\"为主道而被戕害的人，你们不要说他们是死的；其实，他们是活的，但你们不知觉。\"\n——《古兰经》2:154 · 马坚译\n\n凝练一段：\n本集直面悲伤与愤怒之间的张力：为加沙正在承受的苦难悲伤，对逍遥法外的暴君愤怒——而中间世界（barzakh）同时回应这两种情绪，因为真主的公道已经在运行之中。烈士们的灵魂化作绿鸟，在天堂的河流边啄食果实、栖息于金灯盏；他们在死亡时感到的痛苦不过如小刺一蜇，坟墓为他们拓宽，连坟墓的审问都免了。而暴君们在中间世界朝夕受刑，坟墓将他们挤压，复活日将被集合成蝼蚁遭人践踏。但知道公道在运行，绝不削弱我们为今天仍活在苦难中的被压迫者寻求公道的责任——被压迫者的回报在真主那里，站出来对抗压迫者的责任，在我们这里。\n\n全文翻译（1/4）：\n愿暴君之眼永不得安眠。你有多少个夜晚，在无助中辗转反侧，因为那些藏在西装之下、躲在炸弹之后的可鄙怪物？你可曾想过，那些被人类恶魔无情地烧灼、摧残、折磨的男男女女与孩童，又被夺走了多少睡眠？你有多少次望着暴君，只盼失眠的是他们？Fala namat a'yun al-jubana——愿懦夫之眼永不得安眠。这是哈立德（愿主喜悦他）在临终之榻上说的话（فَلَا نَامَتْ أَعْيُنُ الجُبَنَاءِ，见《Siyar A'lam al-Nubala'》1/382）。虽然那句话有它特定的现世语境，但你也许会发现，自己正对今日的懦夫许下同样的心愿，甚至更重。然后你也许会问：我盼着那些让无数人受苦的人自己受苦，我是坏人吗？有时我渴望得到安慰——知道那些被杀害的人如今已得安慰；可我也想看到这些在今世逍遥法外的暴君，在那边被清算。你并不孤单。我们都在两种情绪之间摇摆：为同胞正在承受的苦难悲伤，对施暴的罪犯愤怒。就连奉为普世慈悯而来的先知（愿主福安之），有时也会为那些把世界变成种族灭绝游乐场的人祈求（惩罚）。而中间世界（barzakh）的奇妙之处在于，它同时回应这两种情绪——因为真主的公道，已经在运行之中。\n\n那是在耶麻麦战役的前夜，即将被杀的将士们做了各种各样的梦。阿巴德·本·比希尔（愿主喜悦他）醒来说：昨晚我梦见天开了，我的灵魂升了上去，然后天门在我身后关闭（见《Tabaqat Ibn Sa'd》3/441）。至于图菲勒·本·阿慕尔（愿主喜悦他），他的梦更加鲜明。他说：昨晚我梦见自己被砍头，头被砍下的瞬间，一只鸟从我口中飞出，飞向一个女人，那女人把鸟纳入怀中。我的儿子追在我身后找我，却怎么也追不上。他说，我对这梦的解读是：我将在战场上被砍头；那只鸟——فَرُوْحِي，是我的灵魂；wal-mar'atu al-ard utfanu feeha，那女人就是大地，我将葬在其中；与我同来参战的儿子不会殉道，他会困惑我去了哪里（见《Siyar A'lam al-Nubala'》1/346）。结果分毫不差。阿巴德的遗体被残害得只剩胎记能辨认；图菲勒果然被砍头，儿子活着离开了战场（见《Al-Isti'ab》2/762）。讲这些血淋淋的细节，是想说：老实讲，过去一年里我们见过的血腥死亡，可能比我们一辈子见过的都多。而看看这一切多么熟悉——加沙的人们用绘画来表达：画花朵，代表被砍头的烈士们。加沙有多少个图菲勒？有多少个阿巴德？有多少烈士，已经加入了他们曾读过的那些人的行列？就像图菲勒的儿子追不上他一样，我们都只能猜想：我们的烈士们现在怎么样了。而烈士们，有话要对我们说。\n\n全文翻译（2/4）：\n先知（愿主福安之）说：吴侯德战役的烈士们的灵魂离开身体时——其中许多人遗体残缺——真主把他们的灵魂安置在绿鸟的身体里，绿鸟飞到天堂的河流边，啄食那里的果实，栖息在悬于真主宝座之下的金灯盏上。（穆斯林圣训集1887；艾布·达乌德圣训集2520）真主亲自对他们说话，亲自安抚他们。当他们尝到回报的甜美，他们说：谁去告诉我们的家人，我们在天堂里活着、受给养，让他们像我们一样继续奋斗，不要在战斗中泄气？赞主超绝，他们不只为安慰我们，他们要激励我们。真主说：我亲自把你们的消息告诉他们。就在那时，真主降下了经文：\nوَلَا تَقُولُوا۟ لِمَن يُقْتَلُ فِى سَبِيلِ ٱللَّهِ أَمْوَٰتٌۢ ۚ بَلْ أَحْيَآءٌ وَلَـٰكِن لَّا تَشْعُرُونَ\n\"为主道而被戕害的人，你们不要说他们是死的；其实，他们是活的，但你们不知觉。\"（《古兰经》2:154 · 马坚译；讲稿英文后半句\"与他们的主同在、受给养\"意近3:169：\"他们在真主那里享受给养\"。）\n吴侯德的烈士们和加沙的烈士们想让我们知道：他们很好；也想让我们知道：我们必须继续走下去。因为首先，他们虽然不在我们身边了，但他们与他们的主同在。还记得阿西娅（愿主喜悦她）受刑至殉道时说的话吗？\nرَبِّ ٱبْنِ لِى عِندَكَ بَيْتًا فِى ٱلْجَنَّةِ\n\"我的主啊！求你在你那里，为我建筑一所房子在乐园里。\"（《古兰经》66:11 · 马坚译）\n注意：在房屋之前、在回报之前，她先求的是与真主同在。如今她与他同在。真主说：\"在主那里，是虔诚者，是见证者\"（《古兰经》57:19 · 马坚译，讲稿引其中\"烈士们在他们的主那里\"之意）。阿西娅与她的主同在，古往今来所有的烈士都是如此。但你知道吗？他们也彼此相伴。不只是死于同一场暴行的烈士，而是跨越世代的烈士们。想象一下，不同时代的烈士们彼此相识。阿卜杜拉·本·阿慕尔·本·阿绥（愿主喜悦他们父子俩）传述：烈士们的灵魂在绿鸟体内，像访客一样游荡，他们彼此相识、彼此结交，一同啜食天堂之树的果实。（伊本·艾比·舍白《穆桑纳夫》36684）想象加沙的烈士们，飞出露天监狱，与斯雷布雷尼察种族灭绝的烈士们并肩飞翔；维吾尔的鸟拥抱罗兴亚和克什米尔的鸟；死于大灾难（Nakba）的人，迎接如今死于巴勒斯坦的人；也门和苏丹那些被饿死的灵魂，如今同享天堂之树的果实；想想黎巴嫩和叙利亚的烈士，与千年前在同一片沙姆土地上被屠杀的人相遇；然后想想他们一起飞向苏麦娅——先知时代第一位烈士；再与哈姆扎（愿主喜悦他）、贾法尔（愿主喜悦他）以及圣门弟子中的烈士们坐在一起。吴侯德的哈姆扎，见到加沙那些以他命名而殉道的孩子哈姆扎，会是什么情景？\n\n全文翻译（3/4）：\n他们被称为 shuhada（烈士/见证者），不只因为真主见证了他们的牺牲，更因为他们死后即刻见证了真主的回报。你在屏幕上看过多少次被炸得支离破碎的遗体，心想：他们该承受了多么难以忍受、无情的痛苦？但如果我告诉你，他们在死亡那一刻受的苦，可能远没有你想的那么多呢？先知（愿主福安之）说：烈士在死亡时感到的痛苦，不超过你们中一人被小刺蜇一下。（铁尔密兹圣训集1668）当我们觉得他们已经受够了苦，真主早已开始赐予他们远超任何人想象的回报。当然，这绝不是轻视许多烈士在死前那一刻之前承受的苦难——许多人并非瞬间死去；但要说的是，真主的回报必将让他们忘记那痛苦，如今他们在天堂自由翱翔，永远不再受苦。而其他信士在坟墓中都要受考验，烈士们却连审问都免了，因为先知（愿主福安之）说：他们头顶闪烁的刀光，已是对他们足够的考验。（奈萨仪圣训集2052）那 jabbarin（暴君、压迫者）呢——那些对烈士之死负责的人？为什么看起来暴君在今世逍遥法外？为什么好人总像是英年早逝，恶人却寿长安乐、把今世抓在手里？其实这都是真主计划的一部分。他推迟对他们的惩罚，是为了彻底毁灭他们。真主确然宽限压迫者，可一旦他擒住他，就绝不放他走。（布哈里圣训集4686；穆斯林圣训集2583）在我们眼中，他们似乎死在舒适的床上，仆人和医生环绕；但谁也救不了他们最后时刻的剧痛——正如烈士的死亡时刻是痛苦的终点、幸福的起点，压迫者的最后时刻却是剧痛：灵魂被从身体里撕扯挤压出来，而这只是永恒刑罚的开始。坟墓为烈士拓宽，却对暴君猛然收紧。想象那些让别人被压在废墟下的人，如今被坟墓窒息般的挤压压碎。毫不偶然：《古兰经》里唯一明确提到坟墓之刑的，正是关于史上最大的暴君——法老。真主在赦宥者章说：\nٱلنَّارُ يُعْرَضُونَ عَلَيْهَا غُدُوًّا وَعَشِيًّا ۖ وَيَوْمَ تَقُومُ ٱلسَّاعَةُ أَدْخِلُوٓا۟ ءَالَ فِرْعَوْنَ أَشَدَّ ٱلْعَذَابِ\n\"他们朝夕受火刑。复活时来临之日，或者将说：你们让法老的宗族进去受最严厉的刑罚吧！\"（《古兰经》40:46 · 马坚译）\n想想你的朝夕，再想想他们的朝夕。你每天清晨醒来、夜晚入睡，记念词（adhkar）几乎都是赞颂真主赐予你的今世恩典；可你是否也赞颂他在那边为他们施行的公道？艾布·胡莱勒（愿主喜悦他）每天清晨醒来会说：\nذهب الليل وجاء النهار وعرض آل فرعون على النار\n夜去了，昼来了，法老的宗族被呈于火前。傍晚他又说：昼去了，夜来了，法老的宗族被呈于火前。（宰哈比《Siyar A'lam al-Nubala'》2/611）看见今世的不公依然让你心痛，但你要知道：暴君们此刻正在中间世界受刑，而且每朝每夕都在加重。你一生中见过一些战争罪犯死去，可他们发动了我们今天仍在承受的暴政机器。所以有些学者说，经文说\"法老的宗族\"，不只是他那个时代的追随者，而是每一个步他后尘的暴君。\n\n全文翻译（4/4）：\n你看，jabbarin 是 shuhada 的反面。烈士们把生命献给了比自己更大的事业，暴君们却把生命用来把自己撑得更大。于是真主——至大的主——要让他们看看自己有多渺小。先知（愿主福安之）说：傲慢者和暴君们将在复活日被集合成细小的虫蚁，人们因他们在真主面前的卑贱而践踏他们。（伊本·艾比·敦亚《谦逊与隐退集》，哈桑）与此同时，想象一下：先知（愿主福安之）说，烈士们头上将戴着王冠——就像暴君们在今世不义地戴着的王冠一样。你知道吗，每当我们看到一场暴行，心想\"不会再有更坏的了\"，暴君们总能突破下限，让我们说\"这是我们见过最坏的\"。先知（愿主福安之）说：这些暴君在受刑时，竟然祈求真主推迟复活日，因为他们知道等待他们的火狱全貌更加可怕。（巴拉传述：\"فيقول رب لا تقم الساعة\"——\"他说：我的主啊，求你不要让复活日来临。\"）真主的使者（愿主福安之）说：真主——至强制的（al-Jabbar）——将把他的诸天与大地握在手中。他（愿主福安之）边说边开合自己的手，然后他说：\nأنا الجبار أنا الملك أين الجبارون أين المتكبرون\n我是至强制的，我是君王，暴君们在哪里？傲慢者们在哪里？（布哈里圣训集7412；穆斯林圣训集2788，阿卜杜拉·本·欧麦尔传述）\n先知（愿主福安之）讲这段时满腔激愤，讲坛都在震动，一些圣门弟子以为他要跌下来。这才是真正的愤怒。那么，我们真实的痛苦和悲伤呢？烈士们能为70位亲人说情，是有原因的。（铁尔密兹圣训集1663：烈士为七十位亲属说情）那些以惨烈方式失去亲人、痛彻心扉的家属，如今将因烈士的说情而进入天堂，这是给他们的荣耀。赞主超绝，你在屏幕上看到的那些人里，有多少已经是烈士，或是烈士的家属？加沙有多少人家里没有一位烈士？几乎家家都有。所以你能想象天堂里的加沙有多大吗？眼前的景象如此惨烈，这很难想象；但若想不通，活着更难。就像黄牛座章（85章）里的人们：多少火坑，瞬间变成天堂的花园？想想法老女儿的梳头女仆，被扔进火坑，可先知（愿主福安之）在登霄之夜的最高天上闻到了她的香气。（艾哈迈德《穆斯奈德》2821）\"他们将受烈火的刑罚\"（لهم عذاب الحريق，《古兰经》85:10片段，讲稿原文）——又有多少看似在今世豪宅里享福的暴君，将永受火刑？\n\n但这里有个要点：知道真主在中间世界没有亏待我们的烈士、也没有放过我们的暴君，让我们心安——但这绝不该削弱我们为今天仍活在苦难中的被压迫者寻求公道的追求。因为被压迫者的回报在真主那里，而站出来对抗压迫者的责任，在我们这里。这就是要点。压迫者拼命统治这个世界，因为他们除此之外别无可期；而我们有远为宏大的在等待。所以我们对他们说：我们的监护者是真主，你们没有监护者；我们的万人坑是天堂的万花园，你们的城堡是火狱的囚室；我们的结局是胜利，你们的下场是屈辱。\nلَعَلِّىٓ أَعْمَلُ صَـٰلِحًا فِيمَا تَرَكْتُ ۚ كَلَّآ ۚ إِنَّهَا كَلِمَةٌ هُوَ قَآئِلُهَا ۖ وَمِن وَرَآئِهِم بَرْزَخٌ إِلَىٰ يَوْمِ يُبْعَثُونَ\n\"也许我能借我的遗留的财产而行善。绝不然！这是他一定要说的一句话，在他们的前面，有一个屏障，直到他们复活的日子。\"（《古兰经》23:100 · 马坚译）\n\n核对说明：\n转录来源：Yaqeen 官网本集页面的 AI 转录稿（官网 WordPress 接口 posts/33278 的 acf.transcript_content 全文，14:35），YouTube 字幕未启用。\n引文核对：《古兰经》2:154、40:46、23:100、66:11、57:19 阿拉伯原文取自 api.quran.com text_uthmani，中文均为马坚译逐字核对；讲稿英文\"与他们的主同在、受给养\"意近 3:169（\"他们在真主那里享受给养\"），已附注。本集圣训（穆斯林圣训集1887绿鸟、铁尔密兹1668小刺、奈萨仪2052刀光、布哈里4686宽限压迫者、布哈里7412/穆斯林2788至强制者、铁尔密兹1663为七十亲属说情）阿拉伯原文与本集官网 References 脚注逐条核对，中文按讲稿英文忠实转述并注明出处；未找到可逐字核对的权威中文译文的，均未用于卡片与精华一句。", "cardImg": "noon_2026-10-23.jpg"}, {"date": "2026-10-23", "type": "夜读", "title": "《假如给我三天光明》（节选）——海伦·凯勒", "card": "night_2026-10-23.png", "text": "《假如给我三天光明》（节选）——海伦·凯勒\n\n海伦·凯勒（1880－1968），美国作家、教育家。一岁多时因一场大病失明失聪，在安妮·沙利文老师的帮助下学会读书写字，最终成为享誉世界的演说家与社会活动家。她写道：假如上天给我三天光明，第一天看人，第二天看艺术，第三天看生活——然后，回到永恒的黑暗。\n\n第一天\n\n我常常想，如果每一个人在他刚刚步入社会时，患上几天聋盲症，那将是一件很好的事情：因为黑暗将会让他更加珍爱视觉；寂静将会让他更明白声音的愉悦。\n\n我经常测试我的那些有正常视力的朋友，想看看他们究竟看到了什么。最近，我问一个刚刚从森林中散步回来的朋友，问她看到了什么，她回答说：“没什么特别的。”\n\n我自问：这怎么可能呢？在森林中散步一个小时都看不到什么值得注意的东西？而我这个看不见东西的人，仅仅靠触摸就能发现许许多多让我感兴趣的事情：我能感觉到树叶精致的对称；春天，我摸着树枝，希望能找到一个蓓蕾，因为它是大自然从寒冬中苏醒过来的最早征兆。有时我会把手轻轻放到一棵小树上，如果够幸运的话，会感受到一阵幸福的悸动，因为有鸟儿在放声高唱。\n\n有时，我的心在哭泣，渴望见到这世上所有的一切。仅仅靠触觉就能感受到这么多的幸福，那么，如果能看见，我会发现多少更美好的东西啊？\n\n我要把这段时间分为三个部分。第一天，我想看看那些给我关怀和友谊的人，是他们让我的生命变得有意义。第一天将会是繁忙的一天，我会把我所有的朋友都叫来，然后长久地凝视他们的脸庞，把他们美丽心灵折射于外的特征铭记于心。\n\n我会把目光停留在一个婴儿的脸上，这样我就会看到一个人还未意识到生命的种种冲突之前的渴望、纯真的美。我要看一看那些曾经读给我听的书，它们向我展示了生命中深层的意义。我还要看看我的小苏格兰狗和勇敢的丹麦狗，看看它们忠诚的、值得信赖的眼睛。\n\n下午，我要到森林中散步，我要让我的眼睛陶醉在大自然的美景中。我希望我能看到一个壮丽、辉煌的日落景色，而晚上，我想我大概是睡不着了。\n\n第二天\n\n第二天，我会和黎明一起醒来，我要看着黑夜是如何变成白天的，这是一个令人激动的奇迹，我会敬畏地注视着太阳的光芒唤醒沉睡的大地，多么壮观！\n\n这一天，我要快速地看看这个世界，它的过去，它的现在。我想看看人类发展的进程，所以我要去博物馆，在那里我会看到地球上的动物和人类的浓缩历史。庞大的恐龙和乳齿象在地球上漫游闲逛，而后来人类出现了，他们只有微小的身躯，却有发达的脑袋，他们占领了动物的王国，成了地球的主人。\n\n我要去的下一站是艺术博物馆。我已经用我的双手了解了古尼罗河畔的神和女神的雕像，我感觉过帕台农神庙中的复制品，也感觉过冲锋的雅典勇士的韵律美。长满胡须、饱经风霜的荷马的面容对我来说特别亲切，因为他也是个盲人。\n\n这样，第二天，我将透过艺术来探索人类的心灵世界，所有以前透过触摸了解的东西，现在我都可以看见了，更加让人激动的是，华丽的绘画世界将向我敞开。\n\n第二天的夜晚，我会在剧院或者电影院度过，我多么想亲眼看到哈姆雷特迷人的风采啊！\n\n第三天\n\n下一个早晨，我依然会早早向黎明问候，期待发现新的乐趣，期待更多的美在我眼前展示出来。今天，也就是第三天，我要去体验工作的世界，我要看看忙忙碌碌的人们是怎样生活的。城市是我的目的地。\n\n首先，我会站在一个繁忙的街角，注视人群，从他们的表面去想像他们日常生活的一些事情。看到微笑，我会很开心；看到坚定果敢，我会很骄傲；看到悲伤，我会同情怜悯。\n\n自始至终，我的眼睛都会睁得大大的，所有一切的东西，开心的、不开心的，我都要看在眼里，这样我才能更深地理解人们是怎么工作，怎么生活的。\n\n午夜，我将重新回到永恒的黑暗中。在那短暂的三天，我自然不可能看完所有我想看的东西，只有当黑暗重新降临到我身上时，我才意识到我有多少东西没有看。\n\n我这个看不见东西的人可以给你们看得见东西的人一点忠告：请善用你的眼睛，就好像明天你就会失明。聆听美妙的乐曲，鸟儿的歌唱，管弦乐队雄浑有利的曲调，犹如明天的你就会失聪。去闻一闻花儿的芬芳，尝一尝每一口食物的鲜美，就好像明天的你将永远失去嗅觉和味觉。尽量运用你的每一感觉，从各个方面尽情体会这个世界的快乐和美丽，这些感觉都是大自然赐予你的，而在所有的感觉当中，我相信，视觉一定是最令人愉快的。\n\n——海伦·凯勒《假如给我三天光明》（节选）；作者1880－1968，逝世已逾五十年，公有领域；译文据通行中译本，关键引文经双源核对\n\n把活着的每一天，都当作能看见的第一天。", "cardImg": "night_2026-10-23.jpg"}];

            html = '<p class="q-ar-row"><span class="q-label">原文</span>' +
              '<span class="q-ar" dir="rtl" lang="ar">' + arHtml(ln.slice("阿拉伯原文：".length).trim()) + "</span></p>";
          } else if ((m = ln.match(/^(英译(?:（[^）]*）)?)：([\s\S]*)$/))) {
            html = '<p class="q-en"><span class="q-label">' + esc(m[1]) + "</span>" + enHtml(m[2]) + "</p>";
          } else if ((m = ln.match(/^(中译(?:（[^）]*）)?)：([\s\S]*)$/))) {
            html = '<p class="q-zh"><span class="q-label">' + esc(m[1]) + "</span>" + linkifyEsc(m[2]) + "</p>";
          } else if (hasArabic(ln)) {
            /* Bare archive lines (lesson 1) get the same labels as the
               annotated format (lesson 2), so both lessons render alike. */
            html = '<p class="q-ar-row"><span class="q-label">原文</span>' +
              '<span class="q-ar" dir="rtl" lang="ar">' + arHtml(ln) + "</span></p>";
          } else if (/[\u4e00-\u9fff]/.test(ln)) {
            html = '<p class="q-zh"><span class="q-label">中译（马坚）</span>' + linkifyEsc(ln) + "</p>";
          } else {
            html = '<p class="q-en"><span class="q-label">英译（Saheeh International）</span>' + enHtml(ln) + "</p>";
          }
          if (verse) verse.push(html); else out.push(html);
        });
        flushIntro(); flushVerse();
        return out.join("");
      }

      /* ---------- header summary ---------- */
      var dates = ENTRIES.map(function (e) { return e.date; }).sort();

        "共 <b>" + ENTRIES.length + "</b> 条，" + prettyDate(dates[0]) + " 至 " + prettyDate(dates[dates.length - 1]) +

      /* ---------- filter chips ---------- */

          b.setAttribute("aria-pressed", "true");

      /* ---------- render days ---------- */
      var daysEl = document.getElementById("days");

      /* ---------- reader ---------- */

      /* ---------- audio-only view (「听音频」) ----------
         Shows just the lesson's audio: title, the standard note, and one
         controllable player per track. Opens playing (the tap on the list
         card is the user gesture); only one track plays at a time; closing
         the view stops playback and returns to the list. */
      var audioView = document.getElementById("audioView");
      function openAudioView(e) {
        document.getElementById("audioViewMeta").innerHTML =
          tagHtml(e) + '<span class="time">' + e.date + " " + weekdayOf(e.date) + "</span>";
        document.getElementById("audioViewTitle").textContent = e.title;
        var body = document.getElementById("audioViewBody");
        var html = '<p class="audio-view-note">每一节先诵读原文（诵读者：阿法西），接着朗读英文译文（朗读者：Ibrahim Walk）。</p>';
        e.audio.forEach(function (a) {
          html += '<div class="audio-item"><p class="audio-label">' + esc(a.label) + "</p>" +
            '<audio controls preload="metadata" src="assets/' + esc(a.src) + '"></audio></div>';
        });
        body.innerHTML = html;
        var tracks = Array.prototype.slice.call(body.querySelectorAll("audio"));
        tracks.forEach(function (au) {
          au.addEventListener("play", function () {
            tracks.forEach(function (o) { if (o !== au && !o.paused) o.pause(); });
          });
        });
        body.scrollTop = 0;
        audioView.showModal();
        if (tracks.length) {
          var p = tracks[0].play();
          if (p && p.catch) p.catch(function () {});
        }
      }
      document.getElementById("audioViewClose").addEventListener("click", function () { audioView.close(); });
      audioView.addEventListener("click", function (ev) { if (ev.target === audioView) audioView.close(); });
      audioView.addEventListener("close", function () {
        audioView.querySelectorAll("audio").forEach(function (a) { a.pause(); });
      });

      /* ---------- tap-to-listen (Quran lessons) ----------
         Each verse block maps to one [start, end] segment of one audio
         player; the Arabic recitation and the English reading inside a
         segment play together and are never split. Playback itself is
         continuous: tapping a verse seeks to its start and plays from
         there straight through every following verse to the end of the
         track — a verse boundary never pauses anything. Tapping the
         verse currently being read pauses in place (progress frozen,
         verse stays highlighted in a paused style); tapping it again
         resumes from the frozen point and keeps playing across verse
         ends the same way. Tapping any other verse jumps to its start
         at once and continues from there. The player's own play/pause
         button uses the same continuous semantics, and the highlight
         follows verse by verse.
         While this plays, the reader auto-scrolls around the word
         currently being read (the .q-now word): it stays in a comfort
         band in the middle of the reading area under the pinned player,
         gliding smoothly as the recitation advances, verse after verse.
         A manual scroll is never fought — the follow yields until the
         current word is about to leave the visible area or a new verse
         begins, then it takes over again. Pausing stops all scrolling;
         a seek re-centers on the new current word.
         A reading cursor rides the same playhead (see "reading cursor"
         below): words already read carry a highlighter wash — the
         Arabic words across the verse's Arabic segment, the English
         words across its English segment — so a verse the recitation
         has finished stands covered end to end, in both lines. */
      function wireTapToListen(body) {
        var audios = Array.prototype.slice.call(body.querySelectorAll("audio"));
        if (!audios.length) return;
        audios.forEach(function (au) {
          var table = VERSE_TIMINGS[au.getAttribute("data-asrc")];
          if (!table) return;
          var occ = WORD_OCC[au.getAttribute("data-asrc")] || {};
          var lookup = {};
          table.forEach(function (row) {
            var vo = occ[row[0]] || {};
            lookup[row[0]] = { start: row[1], arEnd: row[2], end: row[3], arSp: [row[4], row[5]], enSp: [row[6], row[7]], arOcc: groupOcc(vo.a), enOcc: groupOcc(vo.e) };
          });
          au._timing = lookup;
        });
        var verseMap = new Map();
        body.querySelectorAll(".q-verse[data-vkey]").forEach(function (v) {
          var key = v.getAttribute("data-vkey");
          for (var i = 0; i < audios.length; i++) {
            var au = audios[i];
            if (au._timing && au._timing[key]) {
              var tm = au._timing[key];
              verseMap.set(v, { audio: au, start: tm.start, arEnd: tm.arEnd, end: tm.end, arSp: tm.arSp, enSp: tm.enSp, arOcc: tm.arOcc, enOcc: tm.enOcc });
              v.classList.add("q-tap");
              v.setAttribute("role", "button");
              v.setAttribute("title", "点读这一节");
              break;
            }
          }
        });
        if (!verseMap.size) return;

        /* A play() issued by a verse tap must not be mistaken for the user
           pressing the player's own play button. Discrimination is purely
           event-driven (no clocks, no timers): each tap that starts a
           paused player leaves a one-shot token on that player
           (au._tapPlay); the next "play" event on it spends the token,
           while a "play" with no token came from the player's own
           controls and clears any stale paused-verse mark. Any "pause" or
           "ended" on the player also drops an unspent token. Playback
           semantics are identical either way — continuous to the end of
           the track — so the token only guards the paused mark. */
        function tapPlay(au) {
          if (au.paused) au._tapPlay = true;
          var p = au.play();
          if (p && p.catch) p.catch(function () { au._tapPlay = false; });
        }
        function clearPausedMarks() {
          body.querySelectorAll(".q-verse.q-paused").forEach(function (x) { x.classList.remove("q-paused"); });
        }
        function setPlaying(verseEl) {
          body.querySelectorAll(".q-verse.q-playing").forEach(function (x) { x.classList.remove("q-playing"); });
          if (verseEl) verseEl.classList.add("q-playing");
        }
        function verseForTime(au, t) {
          var found = null;
          verseMap.forEach(function (info, el) {
            if (info.audio === au && t >= info.start && t < info.end) found = el;
          });
          return found;
        }

        /* ---- reading cursor （诵读光标） ----
           A word-by-word sweep driven purely by the playhead: within a
           verse, both lines are painted from measured per-word
           occurrences (see WORD_OCC / paintLineOcc) — the Arabic from
           the Quran Foundation's production segment data for this very
           reciter, the English from a forced alignment of the reading
           against the printed text — because the voice's pace is
           anything but even: an even sweep left words unpainted after
           the voice had already finished them, and ran ahead through
           the pauses between words. A line with no occurrence data
           falls back to mapping the played fraction of its speech
           window onto its words (paintLine). Either way, the moment a
           verse finishes, both lines stand covered end to end.
           The windows are the voice's real start/stop inside each
           per-verse file (see VERSE_TIMINGS): the files' silent head and
           tail padding no longer drags the sweep ahead of the sound.
           Verses fully behind the playhead stay covered; verses ahead
           stay clean. Because the paint is a function of currentTime
           alone, it freezes where a pause freezes, follows seeks and
           progress-bar drags, and applies identically to tap-to-listen
           segments and to continuous play. Each span remembers its last
           painted state, so a repaint only touches spans whose state
           actually moved. The word at the playhead (.q-now) also swells
           slightly — see the reading-cursor CSS. */
        function wordSpans(el, sel) {
          if (!el._spans) el._spans = {};
          if (!el._spans[sel]) el._spans[sel] = Array.prototype.slice.call(el.querySelectorAll(sel));
          return el._spans[sel];
        }
        /* A verse's occurrence list ([spanIndex, start, end], in time
           order) grouped by the word span each occurrence belongs to,
           so a word the voice utters twice carries both its intervals. */
        function groupOcc(list) {
          if (!list) return null;
          var map = {};
          list.forEach(function (o) {
            (map[o[0]] = map[o[0]] || []).push([o[1], o[2]]);
          });
          return map;
        }
        function paintLine(spans, frac, playing) {
          var n = spans.length;
          if (!n) return;
          var upto = Math.max(0, Math.min(n, Math.floor(frac * n)));
          /* The leading edge shows only once this line's segment has
             actually begun (frac > 0) — an untouched line stays clean. */
          var cur = playing && frac > 0 && upto < n ? upto : -1;
          spans.forEach(function (sp, i) {
            var want = i < upto ? "r" : (i === cur ? "n" : "");
            if (sp._st === want) return;
            sp._st = want;
            sp.classList.toggle("q-read", want === "r");
            sp.classList.toggle("q-now", want === "n");
          });
        }
        /* Fraction of one speech window the playhead has crossed,
           clamped to [0, 1]: before the voice starts nothing is
           covered, once it stops the line stands fully covered. */
        function speechFrac(t, win) {
          if (t <= win[0]) return 0;
          if (t >= win[1]) return 1;
          return (t - win[0]) / (win[1] - win[0]);
        }
        /* One line painted from measured per-word occurrences
           (WORD_OCC) instead of an even sweep. Each word's state comes
           from the latest occurrence of it that has begun: while the
           playhead sits inside that occurrence the word is the current
           one; once the occurrence has ended the word stands read. A
           word the voice utters twice therefore lights again when its
           later occurrence begins and is swept a second time, exactly
           as heard, and in the gap between its two utterances it keeps
           the read state the first one earned. Before a word's first
           occurrence begins it stays clean. When playback is paused,
           the word under the playhead rests unpainted — the same rest
           state the sweep paints. Same span-state bookkeeping as
           paintLine. */
        function paintLineOcc(spans, occMap, t, playing) {
          spans.forEach(function (sp, i) {
            var list = occMap[i];
            var want = "";
            if (list) {
              var cur = null;
              for (var k = 0; k < list.length; k++) {
                if (t >= list[k][0]) cur = list[k];
                else break;
              }
              if (cur) want = t < cur[1] ? (playing ? "n" : "") : "r";
            }
            if (sp._st === want) return;
            sp._st = want;
            sp.classList.toggle("q-read", want === "r");
            sp.classList.toggle("q-now", want === "n");
          });
        }
        function paintCursor(au) {
          var t = au.currentTime;
          var playing = !au.paused && !au.ended;
          verseMap.forEach(function (info, el) {
            if (info.audio !== au) return;
            var arSpans = wordSpans(el, ".q-ar .q-w");
            if (info.arOcc) {
              paintLineOcc(arSpans, info.arOcc, t, playing);
            } else {
              paintLine(arSpans, speechFrac(t, info.arSp), playing);
            }
            var enSpans = wordSpans(el, ".q-en .q-w");
            if (info.enOcc) {
              paintLineOcc(enSpans, info.enOcc, t, playing);
            } else {
              paintLine(enSpans, speechFrac(t, info.enSp), playing);
            }
          });
        }
        function clearCursor() {
          verseMap.forEach(function (info, el) {
            [".q-ar .q-w", ".q-en .q-w"].forEach(function (sel) {
              wordSpans(el, sel).forEach(function (sp) {
                if (!sp._st) return;
                sp._st = "";
                sp.classList.remove("q-read");
                sp.classList.remove("q-now");
              });
            });
          });
        }
        /* timeupdate fires only a few times a second; a rAF loop keeps
           the sweep smooth while anything plays and stops by itself
           when every player is paused or ended. */
        var rafId = null;
        function cursorTick() {
          rafId = null;
          var any = false;
          audios.forEach(function (au) {
            if (au._timing && !au.paused && !au.ended) { paintCursor(au); followRecenter(au); any = true; }
          });
          if (any) rafId = requestAnimationFrame(cursorTick);
        }
        function cursorKick() { if (rafId === null) rafId = requestAnimationFrame(cursorTick); }

        /* ---- auto-scroll follow: keep the current word centered ----
           The follow target is the word being read right now (.q-now in
           the verse under the playhead), not the verse block. While
           anything plays (followRecenter runs on every cursor frame,
           timeupdate, play and seeked), the word is kept inside a
           comfort band — the middle 35%–65% of the reading area below
           the pinned player. Inside the band nothing scrolls, so there
           is no per-word jitter; once the word drifts out of the band,
           the page glides smoothly to bring it back to the center, in
           small steps, line by line, through the Arabic segment, the
           English segment and across verse boundaries alike. A verse
           change re-centers unconditionally, so the follow never breaks
           at a boundary. Between word occurrences (a pause inside a
           verse, before the first word) the anchor falls back to the
           last word already read, then the verse's first word, then the
           verse block itself. Paused playback never scrolls.
           A manual scroll yields: wheel / touch scrolling sets
           follow.yielding, and the follow then stays out of the way
           until the current word is about to leave the visible area
           entirely, or a new verse begins, or a seek forces a re-center
           (followRecenter's force flag). */
        var follow = { verse: null, yielding: false };
        function followRegion() {
          var bodyRect = body.getBoundingClientRect();
          var top = bodyRect.top;
          var box = body.querySelector(".audio-box");
          if (box) {
            var br = box.getBoundingClientRect();
            /* Once pinned, the usable area starts at the player's
               bottom edge. Before it pins (reader still at the very
               top), it rides one body-padding lower than its pinned
               spot. */
            top = body.scrollTop > 2 ? Math.max(top, br.bottom) : top + br.height + 20;
          }
          return { top: top, bottom: bodyRect.bottom, height: Math.max(1, bodyRect.bottom - top) };
        }
        function followTargetEl(au) {
          var v = verseForTime(au, au.currentTime);
          if (!v) return null;
          var now = v.querySelector(".q-w.q-now");
          if (now) return now;
          var spans = v.querySelectorAll(".q-w");
          var lastRead = null;
          for (var i = 0; i < spans.length; i++) {
            if (spans[i].classList.contains("q-read")) lastRead = spans[i];
          }
          if (lastRead) return lastRead;
          return spans.length ? spans[0] : v;
        }
        function followGlide(targetTop) {
          var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          try {
            body.scrollTo({ top: targetTop, behavior: reduce ? "auto" : "smooth" });
          } catch (err) {
            body.scrollTop = targetTop;
          }
        }
        function followRecenter(au, force) {
          if (au.paused || au.ended) return;
          var v = verseForTime(au, au.currentTime);
          if (!v) return;
          var verseChanged = v !== follow.verse;
          if (verseChanged) { follow.verse = v; follow.yielding = false; }
          var el = followTargetEl(au);
          if (!el) return;
          var reg = followRegion();
          var r = el.getBoundingClientRect();
          var cy = r.top + r.height / 2;
          if (follow.yielding && !verseChanged && !force) {
            /* The reader scrolled by hand: stay out of the way unless
               the current word is about to leave the visible area. */
            if (r.bottom > reg.top + 24 && r.top < reg.bottom - 24) return;
            follow.yielding = false;
          }
          if (!force && !verseChanged &&
              cy >= reg.top + reg.height * 0.35 && cy <= reg.top + reg.height * 0.65) return;
          var delta = cy - (reg.top + reg.height * 0.5);
          if (Math.abs(delta) < 2) return;
          followGlide(body.scrollTop + delta);
        }
        body.addEventListener("wheel", function () { follow.yielding = true; }, { passive: true });
        body.addEventListener("touchmove", function () { follow.yielding = true; }, { passive: true });
        audios.forEach(function (au) {
          if (!au._timing) return;
          au.addEventListener("timeupdate", function () {
            /* Continuous play: nothing here ever pauses at a verse
               boundary — the highlight simply moves on to the next verse. */
            if (!au.paused) setPlaying(verseForTime(au, au.currentTime));
            paintCursor(au);
            followRecenter(au);
          });
          au.addEventListener("play", function () {
            audios.forEach(function (o) { if (o !== au && !o.paused) o.pause(); });
            if (au._tapPlay) {
              au._tapPlay = false;   /* this play was ordered by a verse tap */
            } else {
              /* Started from the player's own controls: the same
                 continuous play; a paused-verse mark left by an earlier
                 tap-pause is stale once the track runs again. */
              clearPausedMarks();
            }
            setPlaying(verseForTime(au, au.currentTime));
            paintCursor(au);
            cursorKick();
            followRecenter(au);
          });
          au.addEventListener("pause", function () { au._tapPlay = false; paintCursor(au); });
          au.addEventListener("seeked", function () {
            setPlaying(verseForTime(au, au.currentTime));
            paintCursor(au);
            /* After a progress-bar drag (or a verse-tap jump), re-center
               on wherever the playhead now sits. */
            followRecenter(au, true);
          });
          au.addEventListener("ended", function () { au._tapPlay = false; clearPausedMarks(); setPlaying(null); follow.verse = null; follow.yielding = false; clearCursor(); });
        });
        verseMap.forEach(function (info, el) {
          el.addEventListener("click", function () {
            var au = info.audio;
            var current = verseForTime(au, au.currentTime) === el;
            if (current && !au.paused && !au.ended) {
              /* Tap the verse being read: pause in place, progress
                 frozen. Whichever verse the playhead has reached is
                 "current", so this works the same after playback has
                 crossed any number of verse boundaries on its own. */
              au.pause();
              el.classList.add("q-paused");
              return;
            }
            if (current && au.paused) {
              /* Tap the verse the playhead rests in: resume from the
                 frozen point and keep playing continuously — across
                 this verse's end and every later one, until the track
                 ends or a tap pauses again. */
              el.classList.remove("q-paused");
              tapPlay(au);
              return;
            }
            /* Any other verse (or any verse while the playhead sits
               elsewhere): jump to its start at once and play
               continuously from there; no verse end ever stops it. */
            audios.forEach(function (o) { if (o !== au && !o.paused) o.pause(); });
            clearPausedMarks();
            try { au.currentTime = info.start; } catch (err) {}
            setPlaying(el);
            tapPlay(au);
          });
        });
      }

      /* ---------- tap-a-word lookup (点词查意) ----------
         Tapping an English word in a lesson's 英译 line opens a small card
         with its ECDICT 音标 + 中文释义 and a 朗读发音 button. The button
         plays the pronunciation WORD_AUDIO assigns to the tapped word
         (Youdao dictvoice's recorded US voice, or the site's own MP3 for
         the forms dictvoice lacks) exactly as it appears in the verse — its
         surface form, never the lemma the card's dictionary info is keyed
         to — through one shared Audio element; if that voice fails to load
         or play it falls back to speechSynthesis with the same surface
         form, so
         the button always speaks. The word click is intercepted in the capture
         phase on the reader body and stopped there, so it can never reach
         the verse block's tap-to-listen toggle; taps anywhere else in the
         verse behave exactly as before. */
      var wordPop = document.getElementById("wordPop");
      var wordPopWord = document.getElementById("wordPopWord");
      var wordPopPhon = document.getElementById("wordPopPhon");
      var wordPopLemma = document.getElementById("wordPopLemma");
      var wordPopDefs = document.getElementById("wordPopDefs");
      var wordPopBase = document.getElementById("wordPopBase");
      var wordPopBasePhon = document.getElementById("wordPopBasePhon");
      var wordPopBaseDefs = document.getElementById("wordPopBaseDefs");
      var popWord = null;   /* surface word shown in the open card */
      var popLemma = null;  /* dictionary lemma (the span's data-k): card info only, never pronounced */
      var popSpeak = null;  /* the tapped word as it appears in the verse, edge punctuation stripped: the form actually pronounced */
      /* One shared player for every card's 朗读发音. wordAttempt is a
         generation counter: stopping or switching words bumps it, so a
         late error from an older word can never hijack the current one. */
      var wordAudio = new Audio();
      wordAudio.preload = "none";
      var wordAttempt = 0;

      function stopSpeech() {
        wordAttempt++;
        if ("speechSynthesis" in window) speechSynthesis.cancel();
        wordAudio.pause();
      }
      function hideWordPop() {
        if (wordPop.classList.contains("hidden")) return;
        wordPop.classList.add("hidden");
        popWord = null;
        popLemma = null;
        popSpeak = null;
        stopSpeech();
      }
      function showWordPop(span) {
        var key = span.getAttribute("data-k");
        var entry = key && WORD_DICT[key];
        if (!entry) return;
        stopSpeech();   /* switching words drops any reading in progress */
        popWord = span.textContent;
        popLemma = key;
        /* Pronunciation targets the word as printed in the verse (e.g.
           corrupters, believed), never the lemma: only edge punctuation
           is stripped from the surface form. */
        popSpeak = popWord.replace(/^[^A-Za-z\u00C0-\u024F\u1E00-\u1EFF]+/, "").replace(/[^A-Za-z\u00C0-\u024F\u1E00-\u1EFF]+$/, "");
        wordPopWord.textContent = popWord;
        var base = popWord.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        var form = key !== base ? WORD_FORM[base] : null;
        if (form) {
          /* Two layers. Main layer: the tapped form itself — its own
             gloss (WORD_FORM, from the form's own ECDICT entry, or the
             nearest form's entry plus an explicit form label) and its
             own phonetic (the form's own ECDICT entry, else CMUdict
             converted to IPA; empty when neither dictionary carries the
             form — never the lemma's phonetic in its place). */
          wordPopPhon.textContent = form.p ? "/" + form.p + "/" : "";
          var mainT = form.f ? form.t + "（" + form.f + "）" : form.t;
          wordPopDefs.innerHTML = mainT.split("\n").map(esc).join("<br>");
          /* Supplementary layer: the lemma, smaller, under its own
             原形： heading, with the lemma's phonetic and full gloss. */
          wordPopLemma.textContent = "原形：" + key;
          wordPopBasePhon.textContent = entry.p ? "/" + entry.p + "/" : "";
          wordPopBaseDefs.innerHTML = entry.t.split("\n").map(esc).join("<br>");
          wordPopBase.classList.remove("hidden");
        } else {
          /* The tapped word is the lemma itself: a single layer, the
             entry as it has always been shown. */
          wordPopPhon.textContent = entry.p ? "/" + entry.p + "/" : "";
          wordPopDefs.innerHTML = entry.t.split("\n").map(esc).join("<br>");
          wordPopBase.classList.add("hidden");
        }
        wordPop.classList.remove("hidden");
        /* Anchor under the word, clamped horizontally to the reader
           dialog's inner edges (10px inset) so the card never pokes past
           the dialog on wide screens; it slides left to hug the dialog's
           right edge when the tapped word sits near the end of a line.
           Vertically it stays clamped to the viewport as before, flipping
           above the word when there is no room below. */
        var r = span.getBoundingClientRect();
        var M = 10;
        var pw = wordPop.offsetWidth, ph = wordPop.offsetHeight;
        var dlg = reader.getBoundingClientRect();
        var dlgMin = dlg.left + M;
        var dlgMax = Math.max(dlgMin, dlg.right - pw - M);
        var left = Math.min(Math.max(dlgMin, r.left), dlgMax);
        var top = r.bottom + 8;
        if (top + ph > window.innerHeight - M) top = Math.max(M, r.top - ph - 8);
        wordPop.style.left = left + "px";
        wordPop.style.top = top + "px";
      }
      document.getElementById("readerBody").addEventListener("click", function (ev) {
        var w = ev.target && ev.target.closest ? ev.target.closest(".q-word") : null;
        if (!w) return;
        ev.stopPropagation();   /* the verse tap-to-listen must never see this */
        ev.preventDefault();
        showWordPop(w);
      }, true);
      document.addEventListener("click", function (ev) {
        if (wordPop.classList.contains("hidden")) return;
        if (ev.target.closest && ev.target.closest("#wordPop")) return;
        if (ev.target.closest && ev.target.closest(".q-word")) return;
        hideWordPop();
      });
      document.getElementById("wordPopClose").addEventListener("click", function () { hideWordPop(); });
      document.getElementById("readerBody").addEventListener("scroll", hideWordPop);
      reader.addEventListener("close", hideWordPop);
      /* Fallback voice: the original speechSynthesis reading, kept so the
         button still speaks when the recorded pronunciation cannot play. */
      function speakWordTTS(word) {
        if (!("speechSynthesis" in window)) return;
        speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(word);
        var voices = speechSynthesis.getVoices();
        var gb = null, us = null;
        voices.forEach(function (v) {
          if (/^en-GB/i.test(v.lang) && !gb) gb = v;
          if (/^en-US/i.test(v.lang) && !us) us = v;
        });
        if (gb) { u.voice = gb; u.lang = "en-GB"; } else if (us) { u.voice = us; u.lang = "en-US"; } else { u.lang = "en-US"; }
        u.rate = 0.9;
        speechSynthesis.speak(u);
      }
      /* Primary voice, picked per word from WORD_AUDIO (build-time
         verified): Youdao dictvoice's recorded US pronunciation of the
         tapped word's surface form — or, for the few forms dictvoice does
         not carry, the site's own MP3 of that same surface form — played
         through the shared wordAudio element. A load error, a rejected
         play() promise, or a synchronous failure falls back to
         speechSynthesis exactly once for this tap. */
      function speakWord(word) {
        stopSpeech();
        var attempt = wordAttempt;
        var live = true;   /* this attempt may still fall back */
        function fallback() {
          if (!live || attempt !== wordAttempt) return;
          live = false;
          speakWordTTS(word);
        }
        wordAudio.onerror = fallback;
        wordAudio.onplaying = function () { if (attempt === wordAttempt) live = false; };
        var akey = word.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        wordAudio.src = WORD_AUDIO[akey] === "mp3"
          ? WORD_AUDIO_INLINE[akey]
          : "https://dict.youdao.com/dictvoice?audio=" + encodeURIComponent(word) + "&type=2";
        var p;
        try { p = wordAudio.play(); } catch (err) { fallback(); return; }
        if (p && typeof p.catch === "function") p.catch(fallback);
      }
      document.getElementById("wordPopSpeak").addEventListener("click", function () {
        if (!popWord) return;
        /* Reading a word aloud first pauses the lesson audio (no resume). */
        document.getElementById("readerBody").querySelectorAll("audio").forEach(function (a) { a.pause(); });
        speakWord(popSpeak || popWord);
      });

      /* ---------- lightbox ---------- */
      var lightbox = document.getElementById("lightbox");
      function openLightbox(e) {
        var img = document.getElementById("lightboxImg");
        img.src = "assets/" + e.cardImg;
        img.alt = e.title + " 的推送卡片";
        var dl = document.getElementById("lightboxDl");
        dl.href = "assets/" + e.cardImg;
        dl.setAttribute("download", e.card);
        lightbox.showModal();
      }
      document.getElementById("lightboxClose").addEventListener("click", function () { lightbox.close(); });
      lightbox.addEventListener("click", function (ev) { if (ev.target === lightbox) lightbox.close(); });

      /* ---------- filter + search ---------- */
      var noResults = document.getElementById("noResults");
      function applyFilter() {
        var q = state.q.trim().toLowerCase();
        var anyVisible = false;
        daysEl.querySelectorAll(".day").forEach(function (sec) {
          var visible = 0;
          sec.querySelectorAll(".entry").forEach(function (card) {
            var okType = state.type === "全部" || card.dataset.type === state.type;
            var okQ = !q || card.dataset.search.indexOf(q) !== -1;
            var show = okType && okQ;
            card.classList.toggle("hidden", !show);
            if (show) visible++;
          });
          sec.classList.toggle("hidden", visible === 0);
          var c = sec.querySelector(".day-count");
          if (c) c.textContent = visible + " 条";
          if (visible) anyVisible = true;
        });
        noResults.classList.toggle("hidden", anyVisible);
      }
      document.getElementById("searchInput").addEventListener("input", function (ev) {
        state.q = ev.target.value;
        applyFilter();
      });
    </script>
  </body>
</html>
